<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Power · 骨架</title>
<link rel="stylesheet" href="css/app.css?v=20260922">
</head>
<body>
<canvas id="cv"></canvas>
<!-- UI2:两个工具钮是图标钮(行内 SVG,颜色全走 css token),文字收进 title / aria-label。
     SN6 右下角工具钮。钮的行为走 render/85-settings 的事件委托。 -->
<div id="tools">
  <div class="seg" id="segTier" title="三级星图:星图自己的比例尺阶梯 —— 画面短边横跨 战术 2 / 舰队 15 / 战区 45 光秒"><button class="hbtn" data-tier="1">战术</button><button class="hbtn" data-tier="2">舰队</button><button class="hbtn" data-tier="3">战区</button></div><!-- SN6b 从顶栏搬到这儿(用户拍板"三按钮放在右下角,大小和形状参考态势感知V3")。id 未变 ⇒ render/85-settings 的委托与 80-viewtier 里写高亮的那行都不用改 -->
  <div class="seg" id="segTool"><button class="hbtn" data-tool="geom" title="缩圈:地图右上角弹出【定位几何】小窗——我方全体观测合起来,对方那艘船的误差椭圆现在有多大、离导弹门/主炮门还差多少。悬停敌方目标临时看;左键点敌方目标常驻;点我方舰看它正在打(或正在等)的那个目标" aria-label="缩圈"><svg class="tl-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="i-ship" d="M17.6 12.9 8 6.4 11 12.3 8.4 17.9Z"/><ellipse class="i-ell" cx="12" cy="12" rx="10.8" ry="5.4" transform="rotate(-13 12 12)"/><path class="i-los" d="M0 14.8 24 9.2"/></svg></button><button class="hbtn" data-tool="sig" title="信号视野:画出我方每艘舰的【被探测范围】——光学/红外恒有;开了雷达才有被听见的那一圈。半径直接读感知层的量程律,与判据同一个数" aria-label="信号视野"><svg class="tl-ico" viewBox="0 0 24 24" aria-hidden="true"><circle class="i-r3" cx="12" cy="12.6" r="11.4"/><circle class="i-r2" cx="12" cy="12.6" r="8.2"/><circle class="i-r1" cx="12" cy="12.6" r="5"/><path class="i-ship" d="M12 5.4 15.9 18 12 14.8 8.1 18Z"/></svg></button></div>
</div>
<!-- SN7 定位几何小窗:叠在地图右上角、紧贴右轨左侧(照 demos/sensors/态势感知V3.html 的 #pPhase)。自己的小 canvas,不进主画布;
     开关是右下角 #tools 的「缩圈」钮(render/85-settings 的委托)。 -->
<div id="geomPane" class="panel" hidden><canvas id="geomCv"></canvas><div class="gp-tag">定位几何<b>GEOMETRY</b></div><div class="gp-hint" id="geomHint"></div></div>
<!-- MT1 对局结果卡片:只在对局分出胜负时由 scenario/97-match 的 matchTick 显示。 -->
<div id="matchEnd" class="panel" hidden><div class="me-title" id="meTitle">胜利</div><div class="me-sub" id="meSub"></div><div class="me-stat" id="meStat"></div><div class="me-btns"><button class="btn" id="meAgain">再来一局</button><button class="btn" id="meRange">回靶场</button></div></div>
<div id="mapTag">战术层<b>TACTICAL</b></div><!-- SN6 当前层的读数,只在【换层那一刻】写(render/80-viewtier 的 vtFrame) -->

<div id="hud" class="panel">
  <div class="logo">SPACE POWER<span> · 骨架</span></div>
  <div id="clock">00:00</div>
  <div id="rate">x1</div>
  <button class="hbtn" id="btnPause" title="暂停/继续(空格)">⏸</button>
  <button class="hbtn" id="btnSlow" title="减速(-)">−</button>
  <button class="hbtn" id="btnFast" title="加速(+)">+</button>
  <div class="spacer"></div>
  <button class="hbtn" id="btnMatch" title="进入对局">对局</button><!-- MT1 对局入口(scenario/97-match);进了对局它变成「回靶场」 -->
  <button class="hbtn" id="btnTut" title="教程 · 指挥官手册(Esc 关闭)">教程</button><!-- RF5-D 排在 .spacer 之后 = 顶栏右端。SL1(2026-09-22 瘦身):原来跟在它后面被藏着的七个旧钮(录制/GM/互搏/靶场参数/场景菜单/回放/设置)已整套删除;GM 仍走 F8 -->
</div>

<!-- FM1 编队书签栏(左轨顶部,常驻)。这是编队的唯一可见入口。
     刻意不给 class="panel":.panel 带 overflow:hidden + 边框背景,会把一叠独立小条圈成一块面板。内容由 render/87-fmbar.js 填。 -->
<div id="fmBar"></div>
<!-- FM7 测试用「加船」小条:挂在左轨书签栏下方。靶场只有 3 艘蓝舰,凑不出两支编队,阵型没法手试。
     内容由 scenario/96-spawn.js 建。 -->
<div id="spawnBar"></div>
<!-- FM1 编队菜单(点书签展开)。.p-title / #fmActs 两个容器必须是【静态元素】(信息区 #selFm 已搬到右轨 #selPanel 里)——
     事件全部委托到它们身上,而 on() 遇元素不存在只会静默跳过,动态创建的容器挂不上委托。
     默认 display:none,由 updFmBar() 写回 'flex'(不是 '')。 -->
<div id="fmMenu" class="panel" style="display:none">
  <div class="p-title"><b id="fmTitle">编队</b><span class="hint" id="fmHint">—</span></div>
  <div id="fmActs"></div>
</div>

<!-- RF2 简化UI:选中舰实时信息面板(右轨)。SL1(2026-09-22 瘦身):旧舰队卡面板 / 事件面板 / 右轨底部的事件流面板已整套删除,右轨只剩这一块 -->
<div id="selPanel" class="panel">
  <div class="p-title"><b id="selTitle">未选中</b><span class="hint">左键点选 · 拖拽框选</span></div>
  <div id="selInfo"></div>
  <!-- FL1 编队信息区:原 #fmMenu 里的 #fmInfo,整块搬到右轨。理由是"左边只放操作、右边只放实时数据"。
       必须是【静态元素】:87-fmbar 的事件委托挂在它身上,而 on() 遇元素不存在只会静默跳过。
       显隐由 88-selpanel 的 updateSelPanel 独占(选中的恰好是一支编队才显示),87-fmbar 只管往里写内容。 -->
  <div id="selFm" style="display:none"></div>
  <div id="fcSec"><!-- RF5 火控计算机:序列/目标解算列表。#fcList 必须是静态元素——on() 遇元素不存在会静默跳过,动态创建挂不上委托 -->
    <div class="fc-hd">火控计算机<span class="fc-btn" id="fcPickBtn" title="把当前序列态那条设为唯一开火序列;再按一次回到轮询">选择</span></div><!-- RF8b 舰级"选择"钮:刻意【不进 #fcList】——那里每 20 帧重渲一次,且委托要求带 data-seq(舰级动作没有),上一版的大序列钮正是栽在这条上 -->
    <div id="fcList"></div>
  </div>
</div>

<!-- RANGE1 靶场参数面板:左上角,UI1 左轨车道统一定位。SL1:顶栏那个开关钮已删,面板逻辑(scenario/95-range)保留,css 里仍按 RF2 的老样子藏着 -->
<div id="trPanel" class="panel" style="display:none"><!-- UI1 原来这里写死 max-height:calc(100% - 316px),把旋钮区压成 8px;现由 --rail-top/--dock-b 派生 -->
  <div class="p-title"><b>🎯 靶场参数</b><span class="hint">逐靶可调</span></div>
  <div class="tr-tabs" id="trTabs"></div>
  <div class="tr-body" id="trBody"></div>
  <div class="tr-read" id="trRead"></div>
  <div class="tr-btns">
    <button class="ed-btn" id="trSyncBtn" title="打开后改任一旋钮同时作用于三个靶">同步全靶:关</button>
    <button class="ed-btn" id="trReset" title="伤害/命中/防御链读数全部归零并重新计时">归零统计</button>
    <button class="ed-btn danger" id="trClose">✕ 关闭</button>
  </div>
</div>

<!-- RF3 简化UI:底部操作栏三区 = 舰名区 | 规格读数列(标签上/数值下) | 开关组(88-selpanel 按 s.weapons 配装动态生成) -->
<div id="cmdBar" class="panel">
  <div class="cmd-ship"><b id="ciName">—</b><span id="ciCls">—</span></div>
  <div class="cmd-sep"></div>
  <div id="ciSpec"></div>
  <div class="cmd-sep"></div>
  <div class="cmd-btns"></div>
</div>
<div id="cmdTip"></div>
<!-- RF5-D 教程模态(顶栏 #btnTut 唤出)。内容由 render/85-tutorial.js 惰性写进 #tutBody(打开过一次才存在),
     所以常规画面下这里是三个空壳,零元素泄漏。SL1:旧设置面板的遮罩已删,这是顶栏唯一的模态。 -->
<div id="tutOverlay">
  <div id="tutPanel">
    <div class="tut-hd">
      <h2>指挥官手册</h2>
      <span class="tut-hd-hint">Esc / 点遮罩 关闭 · 打开期间模拟暂停</span>
      <button class="hbtn" id="tutCloseBtn" title="关闭教程(Esc)">✕</button>
    </div>
    <div class="tut-body" id="tutBody"></div>
  </div>
</div>

<!-- FM4 舰队编组控制页(编队菜单的「编组控制」钮唤出)。几何抄 #tutOverlay:外层 flex 居中 + 卡片定高 + 内层独立滚动。
     内容由 render/89-fmpage.js 的 fmPageRender() 写进 #fpBody,
     常规画面下这里是三个空壳。委托挂在 #fmPage / #fpClose 两个静态元素上,所以内容随便重渲都挂得住。 -->
<div id="fmPage">
  <div id="fmPagePanel">
    <div class="fp-hd">
      <h2>舰队编组控制</h2>
      <span class="fp-hd-hint" id="fpHint">—</span>
      <button class="hbtn" id="fpClose" title="关闭(Esc)">✕</button>
    </div>
    <div class="fp-body" id="fpBody"></div>
  </div>
</div>

<div id="xhTip"></div><!-- RF5 悬停敌舰信息卡:跟随光标,内容按 litBlue 接触等级分档(command/74-targeting 写 innerHTML)。刻意不给 class="panel":.panel 带 z-index:var(--z-panel) 与 overflow:hidden,会把层级压回面板档还裁掉内容,几何一律自带(抄 #cmdTip) -->

<!-- RF1: 目录=系统。编号十位是系统层(0core/1ships/2sensors/3physics/4formation/5weapons/6bots/7command/8render/9scenario)。
     硬约束仅两条:core/00 定义 on() 必须最先(85/95/96/97 顶层调用它);core/99 顶层执行 init() 必须最后(且 init 调 loadRangeCfg,
     故 scenario/95 必须在它之前)。其余跨文件引用全在运行期解析,层序排列只为可读性。 -->
<script src="js/core/00-config.js?v=20260922"></script>
<script src="js/core/01-state.js?v=20260922"></script>
<script src="js/ships/10-hull-geometry.js?v=20260922"></script>
<script src="js/ships/11-classes.js?v=20260922"></script>
<script src="js/sensors/20-signature.js?v=20260922"></script>
<script src="js/sensors/21-detect.js?v=20260922"></script>
<script src="js/sensors/22-percep.js?v=20260922"></script><!-- SN4 感知纯函数层:零顶层执行(只声明模块私有的 Float64Array 缓冲与三个纯字面量常量,不读 SENS/sReq/ships 任何东西)、不调 on()、不是 core/99,所以两条加载顺序硬约束都不涉及;跨文件引用(SENS 在 20-signature、sReq 在 00-config)全部运行期解析,与 formation/39-fmcaps 同口径 —— 排在 21-detect 之后只为目录编号好读,换到别处也不会错 -->
<script src="js/sensors/23-cov.js?v=20260922"></script><!-- SN6 误差椭圆感知内核:同样零顶层执行(只声明;ladApply 不在加载期跑) -->
<script src="js/physics/30-motion.js?v=20260922"></script>
<script src="js/physics/31-step-ships.js?v=20260922"></script>
<script src="js/physics/32-route-refine.js?v=20260922"></script>
<script src="js/formation/39-fmcaps.js?v=20260922"></script><!-- FM4 编队能力模型层:9 维能力(读配装实例字段)/四套站位模板/五条带半径/插槽扩容/匈牙利最优指派。纯函数,零顶层执行;排在 40 之前只为可读性,跨文件引用全在运行期解析 -->
<script src="js/formation/40-slots.js?v=20260922"></script>
<script src="js/formation/41-follow.js?v=20260922"></script>
<script src="js/formation/42-formation.js?v=20260922"></script>
<script src="js/formation/43-step.js?v=20260922"></script>
<script src="js/formation/44-orders.js?v=20260922"></script><!-- FM1 编队重做:40几何(纯函数)/41通用跟随层/42编队实体(生命周期)/43每tick结算/44命令层。顶层只有 const/let/function,零顶层执行,跨文件引用全在运行期解析 -->
<script src="js/weapons/50-missile-spec.js?v=20260922"></script>
<script src="js/weapons/51-defs.js?v=20260922"></script>
<script src="js/weapons/51-ciws.js?v=20260922"></script>
<script src="js/weapons/52-fire.js?v=20260922"></script>
<script src="js/weapons/53-nets.js?v=20260922"></script>
<script src="js/weapons/54-missiles.js?v=20260922"></script>
<script src="js/weapons/55-damage.js?v=20260922"></script>
<script src="js/weapons/56-step-projectiles.js?v=20260922"></script>
<script src="js/weapons/57-step-weapons.js?v=20260922"></script>
<script src="js/weapons/58-firecontrol.js?v=20260922"></script><!-- RF5 火控计算机引擎:序列数据模型+stepFireControl/Post。位置只为目录编号可读性(编号 58 > 57,归位到 weapons 块末尾),跨文件引用全在运行期解析:本文件顶层只有 const/let/function 声明,零顶层执行 -->
<script src="js/core/05-sim.js?v=20260922"></script>
<script src="js/core/06-timecomp.js?v=20260922"></script><!-- TC1 接触降速:frame() 每帧调 tcStep;依赖全部在运行期解析 -->
<script src="js/bots/60-doctrine.js?v=20260922"></script>
<script src="js/bots/61-enemy.js?v=20260922"></script>
<script src="js/command/70-input.js?v=20260922"></script>
<script src="js/command/71-keys.js?v=20260922"></script>
<script src="js/command/74-targeting.js?v=20260922"></script><!-- RF5 悬停准星/吸附状态 xh + #xhTip 信息卡。按目录编号序归位在 command 块末尾;顶层只有 let/const/function,零顶层执行,跨文件引用全在运行期解析 -->
<script src="js/render/80-viewtier.js?v=20260922"></script><!-- SN6 三级星图:层界与缩放上下限由距离梯子推出;与 80-camera 共用编号(先例:85-settings/85-tutorial) -->
<script src="js/render/80-camera.js?v=20260922"></script>
<script src="js/render/81-background.js?v=20260922"></script>
<script src="js/render/82-ship-icons.js?v=20260922"></script>
<script src="js/render/82-lod.js?v=20260922"></script><!-- SN6 聚合层:舰 → 舰队框 → 舰队组;与 82-ship-icons 共用编号 -->
<script src="js/render/83-hud.js?v=20260922"></script>
<script src="js/render/83-geom.js?v=20260922"></script><!-- SN7 定位几何小窗(缩圈图)。与 83-hud 共用编号 83(先例:85-settings / 85-tutorial) -->
<script src="js/render/84-scene.js?v=20260922"></script>
<script src="js/render/84-fmplot.js?v=20260922"></script><!-- FM4 编队能力站位的地图可视化。与 84-scene 共用编号 84(先例:weapons/51-defs 与 51-ciws),都属于“场景图层”;顶层只有 const/function,零顶层执行,由 84-scene 的 render() 运行期调用 -->
<script src="js/render/85-settings.js?v=20260922"></script>
<script src="js/render/85-tutorial.js?v=20260922"></script><!-- RF5-D 教程面板。与 85-settings 共用编号 85(先例:weapons/51-defs 与 51-ciws),语义上教程与设置相邻。顶层调用 on(),故必须晚于 core/00;其余引用全在运行期解析 -->
<script src="js/render/87-fmbar.js?v=20260922"></script><!-- FM1 编队书签栏 + 编队菜单。与 87-fleetcards 共用编号 87(先例:weapons/51-defs 与 51-ciws、render/85-settings 与 85-tutorial),语义上都是"舰队编成"的呈现。顶层只有 on(...) 委托挂载,故必须晚于 core/00;updFmBar() 由 core/99 每 20 帧调用,其余跨文件引用全在运行期解析 -->
<script src="js/render/88-selpanel.js?v=20260922"></script>
<script src="js/render/89-radial.js?v=20260922"></script>
<script src="js/render/89-fmpage.js?v=20260922"></script><!-- FM4 舰队编组控制页。与 89-radial 共用编号 89(先例:render/85-settings 与 85-tutorial)。顶层有 on(...) 委托挂载与两条 window 监听,故必须晚于 core/00;其余跨文件引用全在运行期解析 --><!-- RF5 Phase C 目标轮盘的几何与渲染:半径/角度/容量常量与 drawRadial/radialHit/radialInBand/radPages 全在这一份。必须晚于 88-selpanel(扇区射程读数走它的 KIND_INFO);顶层只有 const/let/function,零顶层执行 -->
<script src="js/scenario/90-envs.js?v=20260922"></script>
<script src="js/scenario/91-init.js?v=20260922"></script>
<script src="js/scenario/95-range.js?v=20260922"></script>
<script src="js/scenario/96-spawn.js?v=20260922"></script><!-- FM7 测试用加船小条。放在 95 之后、core/99 之前:它顶层调 on(),而 on() 定义在 core/00 -->
<script src="js/scenario/97-match.js?v=20260922"></script><!-- MT1 对局入口 / 红方摆位 / 结果卡片。顶层调 on(),须在 core/00 之后;matchPlaceRed 被 91-init 运行期调用 -->
<script src="js/core/99-main.js?v=20260922"></script>
</body>
</html>
