# GitHub Pages:sensor-rework 放根目录(原版),art-d2 放 d2/(美术修改版),拼成一个站点发布(2026-11-11 用户:d2 放服务器日本连不上,改放 Pages)
# 两个分支各有一份同样的本文件:推哪个分支都会重新拼一次
name: pages
on:
  push:
    branches: [sensor-rework, art-d2]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sensor-rework
          path: site
      - uses: actions/checkout@v4
        with:
          ref: art-d2
          path: site/d2
      - run: rm -rf site/.git site/.github site/d2/.git site/d2/.github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
