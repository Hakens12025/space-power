<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>命运2风格战场 · 演示</title>
<!-- 2026-10-17 演示页(不加载引擎):把命运2设计风格(skill「命运2设计」)套到战场上,看能不能整体换风格。
     分两层:世界层(背景 / 星云 / 行星 / 船体 / 特效 + 颗粒)换新风格;信息层(网格 / 可见光圈边 / 接触记号 / 舰名 / 比例尺)保持锐利、不加颗粒。
     左边是现在引擎的截图(同比例尺),右边是新风格;阵营色可切「亮 / 压浊」。Canvas 2D 画,颗粒 = 预生成的噪点贴图平铺(进引擎时也这么做,不每帧算滤镜) -->
<style>
  :root{--void:#05070c;--txt:#c7d0dc;--dim:#6a7d92;--line:#1e2836;--acc:#5aa7ff;--gold:#E3C05A}
  body{margin:0;background:var(--void);color:var(--txt);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:13px}
  .wrap{width:1560px;margin:0 auto;padding:16px 0 24px}
  .hd{display:flex;align-items:center;gap:14px;margin-bottom:12px;color:var(--dim);font-size:12px}
  .hd b{color:#e8eef7;font-weight:normal;font-size:15px}
  .tg{display:flex;gap:4px;align-items:center}
  .tg button{background:#0e1420;border:1px solid #2a3a50;border-radius:4px;color:var(--txt);font:12px inherit;padding:4px 10px;cursor:pointer}
  .tg button.on{border-color:var(--acc);color:var(--acc);background:rgba(90,167,255,.1)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
  .cap{color:var(--dim);font-size:12px;margin:0 0 5px}.cap b{color:var(--gold);font-weight:normal}
  img,canvas{display:block;width:772px;height:434px;border:1px solid var(--line);border-radius:4px;background:#000}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><b>命运2风格战场</b>演示页 · 不加载引擎 · 左 = 现在的引擎(截图),右 = 新风格(世界层换、信息层不换)
    <span class="tg">阵营色 <button data-k="fac" data-v="bright">亮(现值)</button><button data-k="fac" data-v="muted">压浊</button></span>
    <span class="tg">颗粒 <button data-k="grain" data-v="1">开</button><button data-k="grain" data-v="0">关</button></span>
    <span class="tg">信息层 <button data-k="info" data-v="1">开</button><button data-k="info" data-v="0">关</button></span></div>
  <div class="row"><div><p class="cap">现在 · 战术层(比例尺 28,000 km,对局开局)</p><img src="命运2风格-现引擎战术层.png"></div>
    <div><p class="cap"><b>新风格</b> · 战术层(同比例尺;另加了敌舰、导弹、拦截、命中、未知 / 陈旧接触,看信息层在新背景上还读不读得出)</p><canvas id="cvA"></canvas></div></div>
  <div class="row"><div><p class="cap">现在 · 近景(比例尺 5,330 km,靶场)</p><img src="命运2风格-现引擎近景.png"></div>
    <div><p class="cap"><b>新风格</b> · 近景(看船体剪影、尾焰、护盾受击、碎石)</p><canvas id="cvB"></canvas></div></div>
</div>
<script>
const W=1600,H=900;
const P={bg:'#141922',bone:'#E6DFCC',white:'#F1ECDD',paper:'#CFC6B0',ink:'#1E2023',char:'#34373B',slate:'#5E6A72',ochre:'#D49A3F',rust:'#B5452E',ember:'#D4693A',
  cyan:'#8FD3E0',rose:'#E58F9E',mint:'#9FD8C4',butter:'#EED89A',lilac:'#A99AD6',peach:'#F0B48A'};
const IRI=[P.rose,P.butter,P.mint,P.cyan,P.lilac,P.peach];
const FAC={bright:{blue:'#5aa7ff',red:'#ff6b6b'},muted:{blue:'#6E9CC2',red:'#C8573F'}};
const ST={fac:'muted',grain:'1',info:'1'};
let sd=1;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
const mix=(a,b,t)=>{const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};

/* ---------- 颗粒贴图:预生成一次,平铺(同 skill 的 grainD / grainL 两层) ---------- */
const GR=(()=>{const n=256,mk=(dark)=>{const c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d'),im=g.createImageData(n,n);
  for(let i=0;i<n*n;i++){const v=Math.random(),a=dark?Math.max(0,v*1.7-0.95):Math.max(0,v*1.8-1.25);im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=dark?0:245;im.data[i*4+3]=Math.round(a*255);}
  g.putImageData(im,0,0);return c;};return {d:mk(true),l:mk(false)};})();
function grain(g){if(ST.grain!=='1')return;g.save();g.setTransform(1,0,0,1,0,0);g.globalAlpha=0.55;g.fillStyle=g.createPattern(GR.d,'repeat');g.fillRect(0,0,g.canvas.width,g.canvas.height);
  g.globalAlpha=0.2;g.fillStyle=g.createPattern(GR.l,'repeat');g.fillRect(0,0,g.canvas.width,g.canvas.height);g.restore();}

/* ---------- 世界层的画法 ---------- */
function blob(g,cx,cy,R,amp,s){g.beginPath();for(let i=0;i<=96;i++){const a=i/96*Math.PI*2,r=R*(1+amp*(0.5*Math.sin(3*a+s)+0.3*Math.sin(5*a+s*1.7)+0.2*Math.sin(9*a+s*2.3)));i?g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):g.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}g.closePath();}
function nebula(g,cx,cy,R,s,cols){cols.forEach((c,i)=>{blob(g,cx+i*14,cy-i*10,R*(1-i*0.22),0.22,s+i*0.6);g.fillStyle=c;g.fill();});} // 分层硬边色块代替渐变
function stars(g,n,seed,bright){sd=seed;for(let i=0;i<n;i++){const x=rnd()*W,y=rnd()*H,r=0.6+rnd()*1.1;g.globalAlpha=0.25+rnd()*0.6;g.fillStyle=P.bone;g.beginPath();g.arc(x,y,r,0,7);g.fill();}g.globalAlpha=1;
  for(let i=0;i<bright;i++){const x=rnd()*W,y=rnd()*H;[[7,'rgba(143,211,224,.12)'],[4.5,'rgba(238,216,154,.22)']].forEach(([r,c])=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();}); // 亮星:两圈硬光晕 + 很短的碎光
    shards(g,x,y,2.6,3.2,6);g.fillStyle=P.white;g.beginPath();g.arc(x,y,1.8,0,7);g.fill();}}
function shards(g,x,y,r0,len,n){for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,l=len*(0.4+rnd()*0.8);g.strokeStyle=IRI[i%IRI.length];g.lineWidth=1+rnd();g.lineCap='round';g.globalAlpha=0.6+rnd()*0.4;
  g.beginPath();g.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);g.lineTo(x+Math.cos(a)*(r0+l),y+Math.sin(a)*(r0+l));g.stroke();}g.globalAlpha=1;}
function burst(g,x,y,r,seed){sd=seed;[[2.3,'rgba(54,66,94,.55)'],[1.7,'rgba(74,86,116,.6)']].forEach(([k,c])=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r*k,0,7);g.fill();});
  shards(g,x,y,r*1.05,r*1.3,22);[[P.cyan,-1.3,1.3],[P.rose,1.3,-1.3]].forEach(([c,dx,dy])=>{g.fillStyle=c;g.beginPath();g.arc(x+dx,y+dy,r,0,7);g.fill();});g.fillStyle=P.white;g.beginPath();g.arc(x,y,r-0.5,0,7);g.fill();}
function planet(g,cx,cy,R){g.save();[[R+30,'rgba(143,211,224,.06)'],[R+16,'rgba(143,211,224,.1)']].forEach(([r,c])=>{g.fillStyle=c;g.beginPath();g.arc(cx,cy,r,0,7);g.fill();}); // 大气:两圈硬边
  g.strokeStyle=P.cyan;g.lineWidth=2;g.beginPath();g.arc(cx-2,cy+2,R,0,7);g.stroke();g.strokeStyle=P.rose;g.beginPath();g.arc(cx+2,cy-2,R,0,7);g.stroke(); // 色差边
  g.beginPath();g.arc(cx,cy,R,0,7);g.clip();g.fillStyle='#1F2C36';g.fillRect(cx-R,cy-R,2*R,2*R);
  [['#2A3D49',0.18],['#3A5561',0.42],['#4F6F78',0.62]].forEach(([c,k])=>{g.fillStyle=c;g.beginPath();g.arc(cx-R*k,cy-R*k,R,0,7);g.fill();}); // 分层明暗交界(光从左上)
  sd=77;g.strokeStyle='rgba(230,223,204,.12)';g.lineWidth=3;for(let i=0;i<7;i++){const y=cy-R+R*0.25*i+rnd()*20;g.beginPath();g.ellipse(cx,y,R*1.05,R*0.12,0.1,0,7);g.stroke();} // 平涂纹带
  g.restore();}
/* 舰船剪影:轮廓抄自引擎 render/82-shipart.js 定稿的「重工长舰」(10-05)—— 只取主舰体、侧舱、背脊 / 上层建筑、炮管、尾段、喷口这几块,
   画法换成平涂:主体阵营色,上层建筑亮一档,炮管与尾段暗一档,下半舷整体压暗(光从左上),中缝负空间,喷口出分层硬边尾焰 */
const MIR=h=>{const o=h.map(p=>p.slice());for(let i=h.length-1;i>=0;i--){const [x,y]=h[i];if(y!==0)o.push([x,-y]);}return o;};
const RC=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const CBY=(x0,y0,x1,y1,c)=>[[x0+c,y0],[x1-c,y0],[x1,y0+c],[x1,y1-c],[x1-c,y1],[x0+c,y1],[x0,y1-c],[x0,y0+c]];
const FLY=p=>p.map(([x,y])=>[x,-y]);
const CIRC=(x,y,r)=>{const o=[];for(let i=0;i<16;i++){const a=i/16*Math.PI*2;o.push([x+Math.cos(a)*r,y+Math.sin(a)*r]);}return o;};
const SHIPS={ // [轮廓, 色档]:hull 主体 / side 侧舱(同主体略亮)/ top 上层建筑 / top2 再亮一档 / acc 炮管与尾段(暗)
  FF:{L:48,eng:[[-24,1.4],[-24,-1.4]],er:0.95,parts:[[MIR([[20,0],[20,1.8],[18,2.6],[-18,2.6],[-19,3.4],[-23,3.4],[-24,2.8],[-24,0]]),'hull'],[RC(20,-0.45,24,0.45),'acc'],
    [CBY(-2,2.2,12,4.4,0.8),'side'],[FLY(CBY(-2,2.2,12,4.4,0.8)),'side'],[RC(12,3.0,16.5,3.6),'acc'],[FLY(RC(12,3.0,16.5,3.6)),'acc'],
    [CBY(-14,-1.9,10,1.9,0.6),'top'],[CBY(-8,-1.3,4,1.3,0.4),'top2'],[CBY(-23,-2.8,-17.5,2.8,0.8),'acc']]},
  DD:{L:60,eng:[[-30,2.6],[-30,-2.6],[-30,0]],er:1.15,parts:[[MIR([[16,0],[16,2.4],[13,3.4],[-8,3.4],[-10,6.2],[-22,6.2],[-24,4.6],[-30,4.6],[-30,0]]),'hull'],
    [RC(16,-0.9,28,0.9),'acc'],[RC(26,-1.4,30,1.4),'acc'],[RC(4,-1.6,16,1.6),'acc'],[CBY(-20,-2.6,-2,2.6,0.8),'top'],[CBY(-13,-1.7,-4,1.7,0.6),'top2'],[CBY(-29.5,-3.8,-23,3.8,0.8),'acc']]},
  CL:{L:48,eng:[[-24,1.2],[-24,-1.2]],er:0.9,parts:[[MIR([[18,0],[18,1.6],[15,2.4],[-16,2.4],[-17,3.2],[-23,3.2],[-24,2.6],[-24,0]]),'hull'],[RC(18,-0.35,24,0.35),'acc'],
    [CBY(-20,2.0,-6,4.4,0.6),'side'],[FLY(CBY(-20,2.0,-6,4.4,0.6)),'side'],[CIRC(4,0,3.4),'top2'],[CBY(-16,-1.5,-1,1.5,0.4),'top'],[CBY(8,-1.5,14,1.5,0.4),'top'],[CBY(-23,-2.6,-17.5,2.6,0.7),'acc']]},
  CA:{L:75,eng:[[-37.5,2.2],[-37.5,-2.2],[-37.5,6],[-37.5,-6]],er:1.25,parts:[[MIR([[30,0],[30,4.6],[26,6.2],[-26,6.2],[-27,9.4],[-37.5,9.4],[-37.5,0]]),'hull'],
    [RC(-18,6.2,14,8.6),'side'],[FLY(RC(-18,6.2,14,8.6)),'side'],[RC(30,-1.3,37.5,1.3),'acc'],[RC(34.5,-1.8,37.5,1.8),'acc'],[RC(22,-2,30,2),'acc'],
    [CBY(-22,-3.6,20,3.6,1.2),'top'],[CBY(-12,-2.6,6,2.6,0.8),'top2'],[CBY(-8,-1.6,2,1.6,0.5),'top3'],[CBY(-36.5,-7.8,-27,7.8,1.4),'acc']]},
};
function ship(g,x,y,Lpx,cls,a,col,near){const S=SHIPS[cls],k=Lpx/S.L,poly=p=>{g.beginPath();p.forEach(([u,v],i)=>i?g.lineTo(u*k,v*k):g.moveTo(u*k,v*k));g.closePath();};
  const tone={hull:col,side:mix(col,'#ffffff',0.08),top:mix(col,'#ffffff',0.25),top2:mix(col,'#ffffff',0.42),top3:mix(col,'#ffffff',0.6),acc:mix(col,'#1E2023',0.5)};
  g.save();g.translate(x,y);g.rotate(a);
  const x0=S.eng[0][0]*k,fl=Lpx*(near?0.32:0.28);
  S.eng.forEach(([ex,ey])=>[[P.ember,1,1],[P.ochre,0.68,0.72],[P.white,0.38,0.42]].forEach(([c,s,w])=>{const r=S.er*k*1.25*w,ly=ey*k; // 尾焰:每个喷口三层硬边
    g.fillStyle=c;g.beginPath();g.moveTo(x0,ly-r);g.quadraticCurveTo(x0-fl*s*0.6,ly-r*0.7,x0-fl*s,ly);g.quadraticCurveTo(x0-fl*s*0.6,ly+r*0.7,x0,ly+r);g.closePath();g.fill();}));
  if(near){g.save();g.translate(2,2.4);g.globalAlpha=0.45;g.fillStyle=P.ink;S.parts.forEach(([p])=>{poly(p);g.fill();});g.restore();} // 平涂投影(偏右下)
  S.parts.forEach(([p,t])=>{poly(p);g.fillStyle=tone[t];g.fill();});
  g.save();poly(S.parts[0][0]);g.clip();g.fillStyle='rgba(20,22,26,.32)';g.fillRect(-S.L*k,0.2*k,2*S.L*k,20*k);g.restore(); // 下半舷压暗(光从左上)
  if(near){g.strokeStyle=P.bg;g.lineWidth=Math.max(0.7,k*0.35);g.beginPath();g.moveTo((S.parts[0][0][0][0]-3)*k,0);g.lineTo(x0*0.55,0);g.stroke();} // 中缝
  g.restore();}
function missile(g,x,y,a,col,trail){g.save();g.translate(x,y);g.rotate(a);for(let i=1;i<=7;i++){g.globalAlpha=0.85-i*0.1;g.fillStyle=P.butter;g.beginPath();g.arc(-4-i*i*0.9,0,Math.max(0.5,1.5-i*0.15),0,7);g.fill();} // 网点尾迹
  g.globalAlpha=1;g.fillStyle=col;g.beginPath();g.moveTo(5,0);g.lineTo(-3,2.4);g.lineTo(-1.5,0);g.lineTo(-3,-2.4);g.closePath();g.fill();g.restore();}
function rock(g,x,y,R,seed){sd=seed;const pts=[];for(let i=0;i<9;i++){const a=i/9*Math.PI*2,r=R*(0.7+rnd()*0.3);pts.push([x+Math.cos(a)*r,y+Math.sin(a)*r]);}
  g.fillStyle='#4A4F55';g.beginPath();pts.forEach(([px,py],i)=>i?g.lineTo(px,py):g.moveTo(px,py));g.closePath();g.fill();
  g.save();g.clip();g.fillStyle='#7C7F80';g.beginPath();g.arc(x-R*0.5,y-R*0.5,R*1.05,0,7);g.fill();g.fillStyle='#3A3E43';g.beginPath();g.arc(x+R*0.25,y+R*0.15,R*0.22,0,7);g.fill();g.restore();}

/* ---------- 信息层(保持锐利,不加颗粒;画法照引擎的意思) ---------- */
function grid(g,step,big){g.lineWidth=1;for(let x=0;x<=W;x+=step){g.strokeStyle=x%big?'rgba(42,58,80,.28)':'rgba(52,82,125,.42)';g.beginPath();g.moveTo(x+0.5,0);g.lineTo(x+0.5,H);g.stroke();}
  for(let y=0;y<=H;y+=step){g.strokeStyle=y%big?'rgba(42,58,80,.28)':'rgba(52,82,125,.42)';g.beginPath();g.moveTo(0,y+0.5);g.lineTo(W,y+0.5);g.stroke();}}
function label(g,x,y,t,col){g.font='12px "Microsoft YaHei"';g.textAlign='center';g.lineWidth=3;g.strokeStyle='rgba(5,7,12,.85)';g.strokeText(t,x,y);g.fillStyle=col||'#c7d0dc';g.fillText(t,x,y);}
function scaleBar(g,t){g.fillStyle='#6a9cc8';g.fillRect(24,H-118,100,4);g.font='12px Consolas';g.textAlign='left';g.fillStyle='#dbe6f2';g.fillText(t,24,H-126);}

/* ---------- 场景 A:战术层 ---------- */
function drawA(){const cv=document.getElementById('cvA'),g=cv.getContext('2d'),F=FAC[ST.fac];
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);g.fillStyle=P.bg;g.fillRect(0,0,W,H);
  nebula(g,1350,380,520,1.3,['#241F31','#2C2540','#362C4E']);nebula(g,-60,820,420,2.1,['#231E30','#2B2440']);
  stars(g,170,11,5);planet(g,1720,1180,560);
  const fc=[790,457],VR=350; // 舰队与可见光圈
  g.save();g.beginPath();g.rect(0,0,W,H);g.arc(fc[0],fc[1],VR,0,7,true);g.clip('evenodd'); // 圈外:网点暗化代替灰雾
  g.fillStyle='rgba(8,10,15,.38)';g.fillRect(0,0,W,H);g.fillStyle='rgba(8,10,15,.38)';
  for(let y=4;y<H;y+=8)for(let x=4+(y/8%2)*4;x<W;x+=8){const d=Math.hypot(x-fc[0],y-fc[1])-VR;if(d<0)continue;const r=Math.min(1.7,0.4+d/300);g.beginPath();g.arc(x,y,r,0,7);g.fill();}
  g.restore();
  const B=[['巡游舰1','CL',742,420],['护卫舰2','FF',818,420],['巡洋舰1','CA',780,457],['护卫舰1','FF',835,457],['驱逐舰1','DD',818,495]];
  const R=[['FF',1296,250],['FF',1336,288],['DD',1300,326]];
  // 我方轴炮弹(电离尾迹三段)飞向敌舰,敌舰被命中爆闪
  const sx=1150,sy=328,ang=Math.atan2(288-457,1336-780);[0.25,0.5,0.85].forEach((a,i)=>{g.strokeStyle=F.blue;g.globalAlpha=a;g.lineWidth=1.4;g.beginPath();g.moveTo(sx-Math.cos(ang)*(90-i*28),sy-Math.sin(ang)*(90-i*28));g.lineTo(sx-Math.cos(ang)*(62-i*28),sy-Math.sin(ang)*(62-i*28));g.stroke();});
  g.globalAlpha=1;g.fillStyle=P.white;g.beginPath();g.arc(sx,sy,2.2,0,7);g.fill();
  R.forEach(([c,x,y])=>ship(g,x,y,c==='DD'?15:12,c,Math.PI*0.84,F.red,false));
  burst(g,1336,288,7,5);
  // 敌方导弹齐射(网点尾迹)冲我方来;我方拦截弹迎上去
  [[1060,360],[1085,382],[1040,392],[1068,410]].forEach(([x,y])=>missile(g,x,y,Math.atan2(457-y,790-x),F.red));
  [[930,410],[945,428],[920,436]].forEach(([x,y])=>{g.fillStyle=P.white;g.beginPath();g.arc(x,y,1.8,0,7);g.fill();g.strokeStyle=F.blue;g.lineWidth=1;g.beginPath();g.arc(x,y,3.2,0,7);g.stroke();});
  B.forEach(([n,c,x,y])=>ship(g,x,y,c==='CA'?20:c==='DD'?15:c==='CL'?13:12,c,Math.PI,F.blue,false));
  grain(g);
  if(ST.info==='1'){grid(g,50,250);
    g.strokeStyle='rgba(230,223,204,.35)';g.lineWidth=1;g.setLineDash([6,6]);g.beginPath();g.arc(fc[0],fc[1],VR,0,7);g.stroke();g.setLineDash([]);
    g.strokeStyle='rgba(124,104,160,.75)';g.lineWidth=1.2;blob(g,1350,380,520,0.22,1.3);g.stroke(); // 星云边界线(信息)
    B.forEach(([n,c,x,y])=>{g.strokeStyle='rgba(90,167,255,.35)';g.lineWidth=1;g.beginPath();g.arc(x,y,c==='CA'?14:11,0,7);g.stroke();label(g,x,y+(c==='CA'?26:22),n);});
    g.strokeStyle='#4fe0ff';g.lineWidth=2;g.beginPath();g.arc(780,457,15,0,7);g.stroke(); // 选中
    R.forEach(([c,x,y],i)=>label(g,x+(i===1?44:-44),y+5,i===2?'敌·驱逐舰':'敌·护卫舰','#ff9a9a'));
    g.strokeStyle='#a0aab9';g.lineWidth=1.4;g.beginPath();g.moveTo(420,168);g.lineTo(428,180);g.lineTo(420,192);g.lineTo(412,180);g.closePath();g.stroke();label(g,420,210,'未知热源','#a0aab9');
    g.fillStyle='#a0aab9';g.beginPath();g.arc(300,650,3.5,0,7);g.fill();g.setLineDash([4,4]);g.strokeStyle='rgba(160,170,185,.7)';g.beginPath();g.arc(300,650,26,0,7);g.stroke();g.setLineDash([]);label(g,300,692,'陈旧 · 敌·护卫舰?','#a0aab9');
    scaleBar(g,'28,000 km');}}

/* ---------- 场景 B:近景 ---------- */
function drawB(){const cv=document.getElementById('cvB'),g=cv.getContext('2d'),F=FAC[ST.fac];
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);g.fillStyle=P.bg;g.fillRect(0,0,W,H);
  nebula(g,250,120,420,0.4,['#231E30','#2B2440','#352B4C']);stars(g,120,23,4);
  rock(g,640,250,26,3);rock(g,1240,640,14,8);rock(g,520,720,9,12);
  // 敌方导弹组 + 我方拦截弹,在两艘我舰前方
  [[980,300],[1005,322],[990,345]].forEach(([x,y])=>missile(g,x,y,Math.atan2(470-y,520-x),F.red));
  [[800,360],[815,380]].forEach(([x,y])=>{g.fillStyle=P.white;g.beginPath();g.arc(x,y,2.4,0,7);g.fill();g.strokeStyle=F.blue;g.lineWidth=1.2;g.beginPath();g.arc(x,y,4.2,0,7);g.stroke();});
  // 敌舰挨了一炮,护盾受击:一段彩虹碎色的弧 + 命中亮球
  ship(g,1270,330,70,'FF',Math.PI*0.86,F.red,true);
  sd=9;for(let i=0;i<14;i++){const a=-2.9+i*0.11,r=52;g.strokeStyle=IRI[i%IRI.length];g.lineWidth=3;g.globalAlpha=0.85;g.beginPath();g.arc(1270,330,r,a,a+0.08);g.stroke();}g.globalAlpha=1;
  burst(g,1222,318,7,21);
  ship(g,520,470,96,'CA',Math.PI*0.94,F.blue,true);ship(g,430,600,62,'FF',Math.PI*0.94,F.blue,true);
  // 我方轴炮弹正在飞
  [0.25,0.5,0.85].forEach((a,i)=>{g.strokeStyle=F.blue;g.globalAlpha=a;g.lineWidth=2;g.beginPath();g.moveTo(900+i*40,432-i*12);g.lineTo(930+i*40,423-i*12);g.stroke();});g.globalAlpha=1;g.fillStyle=P.white;g.beginPath();g.arc(1012,400,2.6,0,7);g.fill();
  grain(g);
  if(ST.info==='1'){grid(g,100,500);label(g,520,530,'巡洋舰1');label(g,430,642,'护卫舰1');label(g,1270,392,'敌·护卫舰','#ff9a9a');
    g.strokeStyle='#4fe0ff';g.lineWidth=2;g.beginPath();g.arc(520,470,56,0,7);g.stroke();label(g,640,226+60,'碎石','#8d95a0');scaleBar(g,'5,330 km');}}

function fit(cv){const d=window.devicePixelRatio||1;cv.width=Math.round(772*d);cv.height=Math.round(434*d);}
function draw(){['cvA','cvB'].forEach(id=>fit(document.getElementById(id)));drawA();drawB();
  document.querySelectorAll('.tg button').forEach(b=>b.classList.toggle('on',ST[b.dataset.k]===b.dataset.v));}
document.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{ST[b.dataset.k]=b.dataset.v;draw();});
draw();
</script>
