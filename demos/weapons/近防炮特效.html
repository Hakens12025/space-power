<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>近防炮特效</title>
<style>
  :root{--bg:#07090d;--panel:#0d1118;--line:#1d2533;--text:#c9d3e0;--dim:#7d8aa0;--acc:#5aa9ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif}
  #wrap{display:flex;height:100%}
  #stage{flex:1;position:relative;min-width:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #panel{width:330px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:12px 14px;overflow-y:auto}
  h1{font-size:15px;margin:0 0 6px}
  .rule{background:#101722;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 10px;color:var(--dim)}
  .rule b{color:var(--text)}
  .row{margin:8px 0}
  .row label{display:flex;justify-content:space-between;color:var(--dim)}
  .row label span{color:var(--text);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  button{background:#131b27;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer;font:inherit}
  button.on{border-color:var(--acc);color:var(--acc)}
  #log{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  @media (max-width:760px){#wrap{flex-direction:column}#stage{height:60vh;flex:none}#panel{width:100%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside id="panel">
    <h1>近防炮特效</h1>
    <div class="rule"><b>交火:</b>来袭导弹一进内圈,这艘船朝它打出几串曳光弹(亮黄白短线,带散布,一直往外飞)。<br><b>结果:</b>到达那一刻按内圈拦截率扣掉一部分 —— 被打掉的在导弹那里炸出小火花,漏过去的出命中闪光。<br>规则照引擎(内圈 6000 km、拦截率 0.85 x 随机),这页只看画法,不与引擎同步。</div>
    <div class="row"><label>倍速(游戏秒 / 真实秒)<span id="vR"></span></label><input id="sR" type="range" min="0" max="1000" value="0"></div>
    <div class="row"><label>特效至少停留(真实秒)<span id="vH"></span></label><input id="sH" type="range" min="0" max="1000" value="40"></div>
    <div class="row"><label>曳光弹流数 <span id="vN"></span></label><input id="sN" type="range" min="1" max="6" value="2"></div>
    <div class="row"><label>每流射速(发 / 真实秒)<span id="vF"></span></label><input id="sF" type="range" min="0" max="1000" value="250"></div>
    <div class="row"><label>散布 <span id="vS"></span></label><input id="sS" type="range" min="0" max="1000" value="582"></div>
    <div class="row"><label>曳光长度 <span id="vL"></span></label><input id="sL" type="range" min="0" max="1000" value="523"></div>
    <div class="row"><label>视野半径 <span id="vZ"></span></label><input id="sZ" type="range" min="0" max="1000" value="400"></div>
    <div class="btns">
      <button id="bOne">来一组</button><button id="bMany">多方向齐射</button><button id="bRun" class="on">在跑</button><button id="bCirc" class="on">画内外圈</button>
    </div>
    <div id="log"></div>
  </aside>
</div>
<script>
"use strict";
/* ---- 引擎数值(抄一份,不同步):驱逐舰近防 x1.5 之后 ---- */
const INNER = 6000, OUTER = 18750, INNER_P = 0.85, MSL_V = 7000, COUNT = 8;
const $ = id => document.getElementById(id);
const logMap = (u, a, b) => a * Math.pow(b / a, u / 1000);
const st = { rate: 1, hold: 1, n: 3, fire: 20, spread: 0.02, len: 0.1, viewR: 20000, run: true, circ: true };
function readUI() {
  st.rate = logMap(+$('sR').value, 1, 10); st.hold = (+$('sH').value) / 1000 * 2.5; st.n = +$('sN').value;
  st.fire = logMap(+$('sF').value, 5, 80); st.spread = (+$('sS').value) / 1000 * 0.06; st.len = logMap(+$('sL').value, 0.03, 0.3);
  st.viewR = logMap(+$('sZ').value, 8000, 60000);
  $('vR').textContent = 'x' + st.rate.toFixed(1); $('vH').textContent = st.hold.toFixed(1) + ' 秒'; $('vN').textContent = st.n;
  $('vF').textContent = Math.round(st.fire); $('vS').textContent = (st.spread * 57.3).toFixed(1) + '°'; $('vL').textContent = Math.round(st.len * 100) + '% 内圈';
  $('vZ').textContent = (st.viewR / 1e4).toFixed(1) + ' 万 km';
}
['sR', 'sH', 'sN', 'sF', 'sS', 'sL', 'sZ'].forEach(id => $(id).addEventListener('input', readUI));
$('bRun').onclick = e => { st.run = !st.run; e.target.classList.toggle('on', st.run); e.target.textContent = st.run ? '在跑' : '暂停'; };
$('bCirc').onclick = e => { st.circ = !st.circ; e.target.classList.toggle('on', st.circ); };
readUI();

const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize() { const r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1; W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
window.addEventListener('resize', resize); resize();

const groups = [], tracers = [], puffs = [], hits = [];
let log = [];
function spawn(ang) { const d = OUTER * 1.6; groups.push({ x: Math.cos(ang) * d, y: Math.sin(ang) * d, n: COUNT, alive: true, inT: -1, lastIn: -1e9, fireAcc: 0 }); }
$('bOne').onclick = () => spawn(Math.random() * 6.283);
$('bMany').onclick = () => { const a0 = Math.random() * 6.283; for (let k = 0; k < 4; k++)spawn(a0 + k * 1.571 + (Math.random() - 0.5) * 0.3); };
spawn(0.6);

let wall = 0, last = 0;
function frame(now) {
  const dtw = last ? Math.min(0.05, (now - last) / 1000) : 0; last = now; if (st.run) wall += dtw;
  const dtg = st.run ? dtw * st.rate : 0;
  const pxkm = Math.min(W, H) / 2 / st.viewR, cx = W / 2, cy = H / 2, S = (x, y) => [cx + x * pxkm, cy + y * pxkm];
  // 导弹:直飞向中心;进内圈开始挨打,到达时结算
  for (const g of groups) {
    if (!g.alive) continue;
    const d = Math.hypot(g.x, g.y), step = MSL_V * dtg;
    if (d <= INNER && g.inT < 0) g.inT = wall;
    if (d <= step) { // 到达:按引擎的式子结算
      g.alive = false;
      const surv = 1 - Math.random() * INNER_P, left = Math.round(g.n * surv), killed = g.n - left;
      for (let k = 0; k < killed; k++) { const a = Math.random() * 6.283, r = (0.05 + Math.random() * 0.25) * INNER; puffs.push({ x: g.x + Math.cos(a) * r * 0.3, y: g.y + Math.sin(a) * r * 0.3, t0: wall + Math.random() * 0.25 }); }
      if (left > 0) hits.push({ t0: wall, n: left });
      log.unshift('近防打掉 ' + killed + ' / ' + g.n + ' 枚,命中 ' + left + ' 枚');
      log = log.slice(0, 6);
      g.lastIn = wall;
      continue;
    }
    g.x -= g.x / d * step; g.y -= g.y / d * step;
    if (d <= INNER) g.lastIn = wall;
  }
  // 曳光弹:目标在内圈里、或刚结算完 hold 秒以内都在打
  for (const g of groups) {
    const firing = (g.alive && g.inT >= 0) || (!g.alive && wall - g.lastIn < st.hold);
    if (!firing || !st.run) continue;
    g.fireAcc += dtw * st.fire * st.n;
    while (g.fireAcc >= 1) {
      g.fireAcc -= 1;
      const base = Math.atan2(g.y, g.x), k = Math.floor(Math.random() * st.n), off = (k - (st.n - 1) / 2) * 0.012;
      tracers.push({ a: base + off + (Math.random() * 2 - 1) * st.spread, t0: wall, life: 0.45 + Math.random() * 0.2 });
    }
  }
  // 画
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
  if (st.circ) {
    ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
    ctx.strokeStyle = 'rgba(79,224,255,.25)'; ctx.beginPath(); ctx.arc(cx, cy, OUTER * pxkm, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = 'rgba(110,231,168,.35)'; ctx.beginPath(); ctx.arc(cx, cy, INNER * pxkm, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(160,175,200,.6)'; ctx.font = '11px system-ui,"Microsoft YaHei"'; ctx.fillText('内圈 6000 km', cx + INNER * pxkm * 0.72, cy - INNER * pxkm * 0.72);
  }
  // 我方舰
  ctx.fillStyle = '#5aa9ff'; ctx.beginPath(); ctx.moveTo(cx + 9, cy); ctx.lineTo(cx - 7, cy - 5); ctx.lineTo(cx - 7, cy + 5); ctx.closePath(); ctx.fill();
  // 曳光:从舰出发往外飞,飞出内圈外一点就灭
  ctx.lineCap = 'round';
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i], age = wall - t.t0; if (age > t.life) { tracers.splice(i, 1); continue; }
    const r1 = (age / t.life) * INNER * 1.25, r0 = Math.max(0, r1 - st.len * INNER), a = 1 - age / t.life;
    const p0 = S(Math.cos(t.a) * r0, Math.sin(t.a) * r0), p1 = S(Math.cos(t.a) * r1, Math.sin(t.a) * r1);
    ctx.strokeStyle = 'rgba(255,240,170,' + (0.9 * a).toFixed(3) + ')'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
  }
  // 导弹组
  for (const g of groups) {
    if (!g.alive) continue; const p = S(g.x, g.y);
    for (let k = 0; k < Math.min(8, g.n); k++) { const a = k / 8 * 6.283; ctx.fillStyle = '#ff6b6b'; ctx.fillRect(p[0] + Math.cos(a) * 4.5 - 1.2, p[1] + Math.sin(a) * 4.5 - 1.2, 2.4, 2.4); }
  }
  // 火花:被打掉的
  for (let i = puffs.length - 1; i >= 0; i--) {
    const f = puffs[i], age = wall - f.t0; if (age < 0) continue; if (age > 0.7) { puffs.splice(i, 1); continue; }
    const p = S(f.x, f.y), r = 2 + age * 18, a = 1 - age / 0.7;
    ctx.fillStyle = 'rgba(255,220,150,' + (0.9 * a).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(p[0], p[1], Math.max(1, 3 * (1 - age)), 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,170,90,' + (0.7 * a).toFixed(3) + ')'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 6.283); ctx.stroke();
  }
  // 命中闪光:漏过去的
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i], age = wall - h.t0; if (age > 1.2) { hits.splice(i, 1); continue; }
    const a = 1 - age / 1.2; ctx.strokeStyle = 'rgba(255,107,107,' + a.toFixed(3) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 8 + age * 30, 0, 6.283); ctx.stroke();
  }
  for (let i = groups.length - 1; i >= 0; i--)if (!groups[i].alive && wall - groups[i].lastIn > st.hold + 1)groups.splice(i, 1);
  $('log').innerHTML = log.join('<br>');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
