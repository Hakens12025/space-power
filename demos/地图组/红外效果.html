<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>红外效果</title>
<style>
html,body{margin:0;height:100%;background:#070a0e;overflow:hidden;font:12px "Microsoft YaHei",sans-serif;color:#cfd8e0}
#cv{position:fixed;left:0;top:0;display:block}
#ui{position:fixed;left:10px;bottom:10px;display:flex;flex-direction:column;gap:5px;user-select:none}
#ui .row{display:flex;gap:3px;align-items:center}
#ui button{background:#141b23;color:#9fb0c0;border:1px solid #2a3642;padding:4px 9px;font:inherit;cursor:pointer}
#ui button.on{background:#7a2a18;color:#fff0e0;border-color:#c0502a}
#ui .lab{color:#8fa0b0;margin-right:4px}
#perf{position:fixed;right:10px;top:8px;font:12px Consolas,monospace;color:#8fa0b0}
#hint{position:fixed;left:10px;top:8px;color:#5f7080}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hint">左键拖动任何东西 · 点船选中 · 右键拖动平移 · 滚轮缩放</div>
<div id="perf"></div>
<div id="ui">
  <div class="row" id="rowSel"><span class="lab" id="selName"></span>
    <span id="selFlame"><button data-fl="0">熄火</button><button data-fl="1">主推</button><button data-fl="-1">反推</button></span>
    <span id="selEmit"><button data-em="silent">静默</button><button data-em="paint">照射</button></span></div>
  <div class="row"><button id="irBtn">红外</button><span id="irMode"><button data-irm="jia">甲 位置</button><button data-irm="yi">乙 方向</button></span></div>
  <div class="row" id="irSun"><button data-sun="none">无太阳</button><button data-sun="dir">太阳·方向</button><button data-sun="pos">太阳·位置</button></div>
  <div class="row" id="irEnv"><button data-env="cloud">尘埃云</button><button data-env="planet">天体</button></div>
</div>
<script>
"use strict";
/* 红外效果独立演示页:效果照 ENV2 之前的地图组红外页(用户认可的样子)移植;不加载引擎,用到的引擎函数页内各写一份最小实现 */

/* ---- 引擎最小实现:常数抄自 js/(2026-09-25),抄完归本页,不回头同步 ---- */
const K_IR=82285714285.7143,A_IR=32135510204.081635,TH0_OPT=0.0324,L_REF=2726.8488005300883,HEAT_EMIT=0.15;
const EMIT_P={silent:0,paint:1,jam:2},SIZE={DD:0.7,CA:1};
const HULL_BASE={DD:7.0,CA:8.8,UNK:8.0},TIER_SCALE={1:1,2:1.13,3:1.28},HULL_ZOOM={A:0.4,LAND:0.55,MARK:0.45,MAX:1.9},LAND_KMPP=745.7523830845771;
const ROCK_SHAPE=[1,0.72,0.95,0.68,0.9,0.78,1.05];
const HULL={
  DD:{parts:[{p:'poly',pts:[[1.50,0],[0.58,0.22],[-0.88,0.20],[-0.98,0]],mirror:true},{p:'line',x1:0.06,y1:-0.48,x2:0.06,y2:0.48,w:0.11},{p:'rect',x:0.52,y:-0.12,w:0.26,h:0.24,dark:0.5}]},
  CA:{parts:[{p:'poly',pts:[[1.52,0],[0.64,0.32],[-0.90,0.30],[-1.02,0]],mirror:true},{p:'rect',x:-0.16,y:-0.58,w:0.36,h:0.40},{p:'rect',x:0.58,y:-0.14,w:0.28,h:0.28,dark:0.5},{p:'rect',x:-0.74,y:-0.14,w:0.28,h:0.28,dark:0.5}]}};
function engPowerOf(s){return s.flame<0?8:(s.flame>0?3:(s.sideFlame?1:0));}
function optLum(s){return s.size*(1+engPowerOf(s)+HEAT_EMIT*EMIT_P[s.emitMode]+(s.fireHot>0?3:0));}
function visRangeOf(s){return Math.sqrt(K_IR*optLum(s));}
function covTheta(o,t,d){return TH0_OPT*d/Math.sqrt(A_IR*optLum(t));}
function hullSize(cls,tier){return (HULL_BASE[cls]||7)*(TIER_SCALE[tier]||1);}
const SHIP_K=0.6;   // 本页舰标 / 舰形轮廓再缩到 0.6(拉远换记号不变),免得船比行星还显眼
function hullZoomRaw(){return HULL_ZOOM.LAND*Math.pow(cam.zoom*LAND_KMPP,HULL_ZOOM.A);}
function hullZoomF(){return Math.max(HULL_ZOOM.MARK,Math.min(HULL_ZOOM.MAX,hullZoomRaw()));}
function shipMarkMode(){return hullZoomRaw()<HULL_ZOOM.MARK;}
function envSunBlind(from,to){ /* 方向型太阳:视线落在禁区(半角 HALF)里 */
  const dx=to[0]-from[0],dy=to[1]-from[1],l=Math.hypot(dx,dy);if(!(l>0))return false;
  const a=IRM_SUN.BRG*Math.PI/180;return (dx*Math.cos(a)+dy*Math.sin(a))/l>=Math.cos(IRM_SUN.HALF*Math.PI/180);
}

/* ---- 镜头 ---- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
const cam={x:30000,y:-70000,zoom:0.0017};
function toScreen(x,y){return [(x-cam.x)*cam.zoom+W/2,(y-cam.y)*cam.zoom+H/2];}
function worldAt(sx,sy){return [(sx-W/2)/cam.zoom+cam.x,(sy-H/2)/cam.zoom+cam.y];}
function resize(){W=innerWidth;H=innerHeight;DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';}   // 画布按设备像素建,绘制仍用 CSS 像素

/* ---- 场景 ---- */
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),a|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function mkShip(cls,side,name,x,y,fx,fy){const l=Math.hypot(fx,fy);return {kind:'ship',cls:cls,tier:2,side:side,name:name,pos:[x,y,0],facing:[fx/l,fy/l,0],size:SIZE[cls],flame:0,sideFlame:0,emitMode:'silent',fireHot:0,dead:false};}
function mkRock(name,x,y,size,fa){return {kind:'rock',name:name,pos:[x,y,0],facing:[Math.cos(fa),Math.sin(fa),0],size:size,flame:0,sideFlame:0,emitMode:'silent',fireHot:0,dead:false};}
const ships=[
  mkShip('CA','blue','蓝·巡洋',-50000,0,1,0),mkShip('DD','blue','蓝·驱逐一',0,35000,1,0),mkShip('DD','blue','蓝·驱逐二',0,-35000,1,0),
  mkShip('CA','red','红·巡洋',230000,-80000,-1,0),mkShip('DD','red','红·驱逐一',150000,120000,0,-1),
  mkShip('DD','red','红·驱逐二',300000,40000,-1,0),mkShip('DD','red','红·驱逐三',110000,-170000,-1,1)];
ships[4].flame=1;ships[5].emitMode='paint';
function blueCentroid(){const b=ships.filter(s=>s.side==='blue'&&!s.dead);let x=0,y=0;for(const s of b){x+=s.pos[0]/b.length;y+=s.pos[1]/b.length;}return [x,y];}
const rocks=[];
{const r=rng(777);for(let n=0;n<24;n++){const a=r()*2*Math.PI,d=Math.sqrt(r())*50000;rocks.push(mkRock('碎石',-30000+Math.cos(a)*d,-150000+Math.sin(a)*d,0.35+r()*0.75,r()*2*Math.PI));}}
{const r=rng(4242),c=blueCentroid();let n=0,g=0;   /* 小行星:体型 1~3,不压在我方船身上 */
  while(n<8&&g++<200){const x=c[0]+(r()*2-1)*500000,y=c[1]+(r()*2-1)*400000,sz=1+r()*2,fa=r()*2*Math.PI;
    if(ships.some(s=>s.side==='blue'&&Math.hypot(s.pos[0]-x,s.pos[1]-y)<60000))continue;rocks.push(mkRock('小行星',x,y,sz,fa));n++;}}
let sel=null;
/* ?stress=N:撒 N 个直线漂移的热源(量性能用),出框从对边回来 */
const STRESS=[],STRESS_BOX=[30000,-70000,450000,260000];
function stressInit(n){const r=rng(99),B=STRESS_BOX;
  for(let k=0;k<n;k++){const a=r()*2*Math.PI,s=mkShip(k%2?'DD':'CA','red','热源',B[0]+(r()*2-1)*B[2],B[1]+(r()*2-1)*B[3],Math.cos(a),Math.sin(a));
    s.flame=k%4===0?1:0;ships.push(s);STRESS.push({s:s,v:300+r()*900});}}
function stressStep(){const B=STRESS_BOX;
  for(const q of STRESS){const p=q.s.pos;p[0]+=q.s.facing[0]*q.v;p[1]+=q.s.facing[1]*q.v;
    if(Math.abs(p[0]-B[0])>B[2])p[0]-=Math.sign(p[0]-B[0])*2*B[2];if(Math.abs(p[1]-B[1])>B[3])p[1]-=Math.sign(p[1]-B[1])*2*B[3];}}

/* ================= 红外图(移植自旧页 irm_old.js,物理与数都照旧)================= */
const IRM={on:false,mode:'jia',CELL:5,V0:0.02,VMAX:1000,CULL:0.0003,SIG_MIN:0.7,BINS:1440,SNR_MIN:0.0003,NOISE:0.005,NOISE_MS:200};
const IRM_T0=-0.1;
const IRM_RAMP=[[IRM_T0,[40,6,6,140]],[0,[70,12,12,150]],[0.25,[150,30,20,170]],[0.5,[220,80,30,190]],[0.75,[255,170,60,210]],[1,[255,245,210,230]]];
const IRM_LUT=(function(){const L=new Uint8ClampedArray(256*4);for(let k=0;k<256;k++){const t=IRM_T0+k/255*(1-IRM_T0);let a=0;while(a<IRM_RAMP.length-2&&t>IRM_RAMP[a+1][0])a++;
  const p=IRM_RAMP[a],q=IRM_RAMP[a+1],u=Math.max(0,Math.min(1,(t-p[0])/(q[0]-p[0])));for(let c=0;c<4;c++)L[k*4+c]=Math.round(p[1][c]+(q[1][c]-p[1][c])*u);}return L;})();
function irmT(v){
  if(!(v!==0)||!isFinite(v))return 0;
  const t=Math.sign(v)*Math.log(1+Math.abs(v)/IRM.V0)/Math.log(1+IRM.VMAX/IRM.V0);return t>1?1:(t<IRM_T0?IRM_T0:t);}
function irmIdx(v){return Math.round((irmT(v)-IRM_T0)/(1-IRM_T0)*255);}
let irmRef=null;
function irmRefGet(){ /* 刻度参照:熄火静默的 DD 恰在发现距离上 */
  if(irmRef)return irmRef;
  const t={size:SIZE.DD,flame:0,sideFlame:0,emitMode:'silent',fireHot:0};
  const R=visRangeOf(t);irmRef={R:R,sig:R*covTheta(null,t,R)};return irmRef;
}
function irmObservers(){return ships.filter(s=>s.side==='blue'&&!s.dead);}
function irmSources(){return ships.filter(s=>s.side!=='blue'&&!s.dead).concat(rocks.filter(r=>!r.dead));}
/* 目标有多热:自身 + 太阳晒的 x 朗伯球相位函数 */
const IRM_ROCK={DARK:0.5};
const IRM_SOLAR={S:1,G0:1};
function irmSunDirAt(p){
  if(IRM_SUN.mode==='dir'){const a=IRM_SUN.BRG*Math.PI/180;return [Math.cos(a),Math.sin(a)];}
  if(IRM_SUN.mode==='pos'&&irmStar){const dx=irmStar.pos[0]-p[0],dy=irmStar.pos[1]-p[1],l=Math.hypot(dx,dy)||1;return [dx/l,dy/l];}
  return null;
}
function irmPhase(o,t){
  const u=irmSunDirAt(t.pos);if(!u||irmInShadow(t.pos))return 0;
  const dx=o.pos[0]-t.pos[0],dy=o.pos[1]-t.pos[1],l=Math.hypot(dx,dy)||1,c=Math.max(-1,Math.min(1,(dx*u[0]+dy*u[1])/l)),a=Math.acos(c);
  return (Math.sin(a)+(Math.PI-a)*c)/Math.PI;
}
/* 尾焰与尾焰致盲(主推瞎后方、反推瞎前方) */
const IRM_PLUME={NOSE:0.1,TAIL_K:4,BAF:30};
function irmPlumeOf(s){
  if(!s||s.kind==='rock'||!s.flame||!s.facing)return null;
  const e=engPowerOf(s);if(!(e>0))return null;
  const k=s.flame>0?-1:1,l=Math.hypot(s.facing[0],s.facing[1])||1;
  return {ux:k*s.facing[0]/l,uy:k*s.facing[1]/l,lum:s.size*e};
}
function irmAspect(pl,t,o){
  const dx=o.pos[0]-t.pos[0],dy=o.pos[1]-t.pos[1],l=Math.hypot(dx,dy)||1,c=(dx*pl.ux+dy*pl.uy)/l;
  return IRM_PLUME.NOSE+(1-IRM_PLUME.NOSE)*(1+c)/2;
}
function irmBaffled(o,t){
  const pl=irmPlumeOf(o);if(!pl)return false;
  const dx=t.pos[0]-o.pos[0],dy=t.pos[1]-o.pos[1],l=Math.hypot(dx,dy)||1;
  return (dx*pl.ux+dy*pl.uy)/l>Math.cos(IRM_PLUME.BAF*Math.PI/180);
}
function irmLumK(o,t){
  const L=optLum(t);if(!(L>0))return 1;
  const pl=irmPlumeOf(t),hid=pl?pl.lum*(1-irmAspect(pl,t,o)):0;
  const self=(t.kind==='rock'?IRM_ROCK.DARK:1)*L-hid,sun=IRM_SOLAR.S*t.size*irmPhase(o,t);
  return (self+sun)/L;
}
/* 观测这一头:逆光 / 衬在云里时背景抬高(背景受限律),等效亮度打折 */
function irmContrast(o,t,cb){   // cb = 目标处的云背景(每个目标只算一次)
  const u=irmInShadow(o.pos)?null:irmSunDirAt(o.pos);if(!u)return 1/Math.sqrt(1+cb/IRM_SOLAR.G0);
  const d=Math.atan2(t.pos[1]-o.pos[1],t.pos[0]-o.pos[0])-Math.atan2(u[1],u[0]);
  return 1/Math.sqrt(1+(irmGlare(Math.atan2(Math.sin(d),Math.cos(d)))+cb)/IRM_SOLAR.G0);
}
function irmPair(o,t){
  const dx=t.pos[0]-o.pos[0],dy=t.pos[1]-o.pos[1],dz=(t.pos[2]||0)-(o.pos[2]||0),k=irmLumK(o,t);
  const d=Math.max(1,Math.hypot(dx,dy,dz)),R=visRangeOf(t),snr=(R/d)*(R/d)*k,ang=covTheta(o,t,d)/Math.sqrt(k);
  return {d:d,snr:snr,ang:ang,blur:d*ang,brg:Math.atan2(dy,dx)};
}
function irmHill(t,obs){ /* 甲的一座山:峰高(按参照归一)与宽度(km),取看得最清楚的那艘我方船 */
  let best=null,cb=NaN;
  for(let n=0;n<obs.length;n++){const o=obs[n];
    if(IRM_SUN.mode==='dir'&&envSunBlind(o.pos,t.pos)&&!irmInShadow(o.pos))continue;
    if(irmOccluded(o.pos,t.pos))continue;
    if(irmBaffled(o,t))continue;
    if(cb!==cb)cb=irmCloudBg(t.pos);
    const q=irmPair(o,t),m=irmContrast(o,t,cb),snr=q.snr*m,blur=q.blur/Math.sqrt(m);
    if(!best||snr>best.snr)best={snr:snr,blur:blur,o:o,k:n};
  }
  if(!best)return null;
  const ref=irmRefGet(),k=ref.sig/best.blur;
  return {peak:best.snr*k*k,sig:best.blur,o:best.o,k:best.k};
}
function irmSeen(o,t){ /* 离散判定:太阳禁区(观测船不在影子里时)、天体遮挡、尾焰致盲;与 irmHill 里的三条相同 */
  return !(IRM_SUN.mode==='dir'&&envSunBlind(o.pos,t.pos)&&!irmInShadow(o.pos))&&!irmOccluded(o.pos,t.pos)&&!irmBaffled(o,t);
}
function irmShowPeak(h){ /* 宽的山往底红收(VSUP) */
  const u=h.sig/irmRefGet().sig,w=u*u/(1+u*u);
  return IRM.V0*(Math.pow(1+h.peak/IRM.V0,1-w)-1);
}
/* 场:格点 i,j 落在屏幕 (i*CELL, j*CELL)。H = 山(乙 = 全景条投回来),B = 云 + 位置型恒星光晕,F = H + B 再盖天体 */
let irmF=null,irmH=null,irmB=null,irmGW=0,irmGH=0;
let irmNzSeed=20260923;
function irmNzRnd(){let t=(irmNzSeed=(irmNzSeed+0x6D2B79F5)>>>0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function irmGrid(){ /* 返回 true = 格子尺寸变了 */
  const C=IRM.CELL,gw=Math.ceil(W/C)+2,gh=Math.ceil(H/C)+2;
  if(irmF&&gw===irmGW&&gh===irmGH)return false;
  const n=gw*gh;irmF=new Float32Array(n);irmH=new Float64Array(n);irmB=new Float32Array(n);irmGW=gw;irmGH=gh;return true;
}
function irmSplatRect(s){ /* 贴片 s = {x,y,pk,a,c,ux,uy,iso}(格坐标);截断在峰降到 CULL 处 */
  const r=Math.max(s.a,s.c)*Math.sqrt(2*Math.log(s.pk/IRM.CULL));
  s.i0=Math.max(0,Math.floor(s.x-r));s.i1=Math.min(irmGW-1,Math.ceil(s.x+r));s.j0=Math.max(0,Math.floor(s.y-r));s.j1=Math.min(irmGH-1,Math.ceil(s.y+r));
  s.ar=s.i0>s.i1||s.j0>s.j1?0:(s.i1-s.i0+1)*(s.j1-s.j0+1);return s;
}
let irmEx=new Float64Array(256);
function irmSplat(s,sg){ /* sg = +1 贴上 / -1 揭掉(同样的数,原样相消) */
  if(!s.ar)return;
  const F=irmH,gw=irmGW,i0=s.i0,i1=s.i1,j0=s.j0,j1=s.j1,p=sg*s.pk,cx=s.x,cy=s.y;
  if(s.iso){ /* 可分离:每列、每行各一次 exp */
    const e=-0.5/(s.a*s.a);if(irmEx.length<i1-i0+1)irmEx=new Float64Array(2*(i1-i0+1));const ex=irmEx;
    for(let i=i0;i<=i1;i++){const dx=i-cx;ex[i-i0]=Math.exp(dx*dx*e);}
    for(let j=j0;j<=j1;j++){const dy=j-cy,fy=p*Math.exp(dy*dy*e),row=j*gw;for(let i=i0;i<=i1;i++)F[row+i]+=fy*ex[i-i0];}
    return;
  }
  /* 各向异性:每行指数是列号的二次式,从行内峰值列往两边前向差分递推(每格两次乘法) */
  const ux=s.ux,uy=s.uy,ea=-0.5/(s.a*s.a),ec=-0.5/(s.c*s.c),A=ea*ux*ux+ec*uy*uy,k=Math.exp(2*A);
  for(let j=j0;j<=j1;j++){
    const dy=j-cy,row=j*gw,a0=dy*uy-cx*ux,c0=dy*ux+cx*uy;
    let iv=Math.round(-(ea*ux*a0-ec*uy*c0)/A);if(iv<i0)iv=i0;else if(iv>i1)iv=i1;
    const av=ux*iv+a0,cv=-uy*iv+c0,gv=p*Math.exp(ea*av*av+ec*cv*cv);
    let g=gv,r=Math.exp(ea*(2*av*ux+ux*ux)+ec*(uy*uy-2*cv*uy));
    for(let i=iv;i<=i1;i++){F[row+i]+=g;g*=r;r*=k;}
    g=gv;r=Math.exp(-(ea*(2*av*ux-ux*ux)-ec*(uy*uy+2*cv*uy)));
    for(let i=iv-1;i>=i0;i--){g*=r;r*=k;F[row+i]+=g;}
  }
}
function irmTail(t,h){
  const pl=irmPlumeOf(t);if(!pl||!h.o)return null;
  const tot=optLum(t)*irmLumK(h.o,t),vis=pl.lum*irmAspect(pl,t,h.o);
  return tot>0?{share:Math.min(1,vis/tot),ux:pl.ux,uy:pl.uy}:null;
}
/* 近处看得出舰形(Johnson 准则,N = 4 在光学认出距离上) */
const IRM_RES={AR:3,AR_ROCK:1.5,FADE:1,HALO:0.5,DETAIL:6.4};
function irmResN(t,h){return 4*t.size*L_REF/h.sig;}

/* ---- 甲:每源一条记录。离散判定每帧算;物理(峰高、宽度)按工作量每帧封顶约 100 µs,
   状态变了的先算(P0),只挪了位置的山立刻挪、峰高宽度之后补(P1);山只在变了的地方揭旧贴新 ---- */
const IRJ={rec:new Map(),obs:[],q0:[],q1:[],fr:0,cost:0,cost0:0,area:0,reset:true};
const IRJ_NONE={list:[],sil:null};
function irjStCh(r,t){return r.fl!==t.flame||r.sf!==t.sideFlame||r.em!==t.emitMode||r.fh!==(t.fireHot>0)||r.fx!==t.facing[0]||r.fy!==t.facing[1];}
function irjStSet(r,t){r.fl=t.flame;r.sf=t.sideFlame;r.em=t.emitMode;r.fh=t.fireHot>0;r.fx=t.facing[0];r.fy=t.facing[1];}
function irjPhys(t,obs){const h=irmHill(t,obs);if(h)h.tl=irmTail(t,h);return h;}

function hullDraw(X,cls,col,dark,detail){ /* 舰体几何,已在舰体坐标系里(船头 +X,单位 = 图标半长) */

    else if(pt.p==='rect'){X.fillStyle=(detail&&pt.dark)?dark:col;X.fillRect(pt.x,pt.y,pt.w,pt.h);}

function irmDrawSil(X,t,e,mv){

function drawGrid(){

/* ---- 普通画面的星云:同一浓度函数,冷色低透明底色 + 三档等值线(做法同引擎 81-env 的 mapCloudPaint)。
   世界锚定瓦片:噪声坐标里 TG x TG 格一块、格距 2^L km(约 PX 屏幕像素),每块只造一次离屏画布;平移只造新露出来的块,
   静止帧只贴整屏缓存;每帧造块封顶约 BUDGET ms,没造好的先拿粗一两级或细一级的块垫着 ---- */
const NEB={PX:8,TG:16,BUDGET:1.5,MAXT:400,ISO:[0.15,0.4,0.7],LINE:['rgba(150,165,215,.18)','rgba(140,190,235,.28)','rgba(180,225,255,.42)'],

function nebLevel(){return Math.round(Math.log2(NEB.PX/cam.zoom));}
function nebKey(L,i,j){return L+'|'+i+'|'+j;}
function nebIsoRow(G,n,j,cp,lev,P){ /* marching squares(照引擎 terrIsoRow):第 j 行格子的等值线段加进 P[k],格点 i 在 i·cp;鞍点按格心均值定 */

  for(let i=0;i<n-1;i++){
    const a=G[r0+i],b=G[r0+i+1],c=G[r1+i+1],d=G[r1+i],mn=Math.min(a,b,c,d),mx=Math.max(a,b,c,d);
    if(mx<lev[0]||mn>=lev[nl-1])continue;

    for(let k=0;k<nl;k++){const L=lev[k];if(mx<L||mn>=L)continue;const p=P[k];
      const tx=x0+(L-a)/(b-a)*cp,ry=y0+(L-b)/(c-b)*cp,bx=x0+(L-d)/(c-d)*cp,ly=y0+(L-a)/(d-a)*cp;
      const cs=(a>=L?8:0)|(b>=L?4:0)|(c>=L?2:0)|(d>=L?1:0);
      switch(cs){
        case 1:case 14:p.moveTo(x0,ly);p.lineTo(bx,y1);break;
        case 2:case 13:p.moveTo(bx,y1);p.lineTo(x1,ry);break;
        case 3:case 12:p.moveTo(x0,ly);p.lineTo(x1,ry);break;
        case 4:case 11:p.moveTo(tx,y0);p.lineTo(x1,ry);break;
        case 6:case 9:p.moveTo(tx,y0);p.lineTo(bx,y1);break;
        case 7:case 8:p.moveTo(x0,ly);p.lineTo(tx,y0);break;
        case 5:case 10:{const up=(a+b+c+d)/4>=L;

          else{p.moveTo(tx,y0);p.lineTo(x1,ry);p.moveTo(x0,ly);p.lineTo(bx,y1);}

      }

}
function nebBuild(L,ti,tj){ /* 造一块:格点浓度 → 每格点一像素的小图放大(双线性)+ 三档等值线;全空的块不建画布 */

  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const d=irmCloudD((ti*TG+i)*st,(tj*TG+j)*st,2*st);G[j*n+i]=d;Gc[j*n+i]=IRM_CLOUD_C;if(d>0)any=true;}

  const d8=V.sm.img.data,lo=V.LO,hi=V.HI;
  const ab=Math.asinh(V.B);
  for(let k=0,q=0;k<n*n;k++,q+=4){const d=G[k],u=Math.asinh(V.B*d)/ab;   // asinh 保色拉伸(Lupton 2004):亮处不过曝

function nebHasCover(L,i,j){ /* 这块没造好时有没有别级的块垫得上 */

  for(let b=0;b<2;b++)for(let a=0;a<2;a++)if(!V.tiles.has(nebKey(L-1,2*i+a,2*j+b)))return false;

    for(let k=0;k<a.length&&V.tiles.size>V.MAXT;k++)if(a[k][1].used!==V.fr)V.tiles.delete(a[k][0]);}
}
function nebLabOk(x,y,dmin){ /* 噪声坐标 (x,y) 写字好不好:在屏里、不压舰名 / 天体 / 左下角开关;dmin >= 0 时还要那里够浓 */
  const p=toScreen(x+CLOUD.pos[0],y+CLOUD.pos[1]),r=uiRect;
  if(p[0]<40||p[0]>W-80||p[1]<30||p[1]>H-30||(r&&p[0]<r.right+30&&p[1]>r.top-30))return false;
  for(const s of ships){if(s.dead)continue;const q=toScreen(s.pos[0],s.pos[1]);if(Math.abs(q[0]-p[0])<80&&Math.abs(q[1]-p[1])<30)return false;}
  if(irmPlanet){const q=toScreen(irmPlanet.pos[0],irmPlanet.pos[1]);if(Math.hypot(q[0]-p[0],q[1]-p[1])<IRM_PLANET.R*cam.zoom+40)return false;}
  return !(dmin>=0)||irmCloudD(x,y,2*Math.pow(2,NEB.view.L))>=dmin;
}
function nebLabelFind(){ /* 「尘埃云」只写一处:原来的位置还好就不动(钉在云上);否则取屏里最浓的格点 */
  const V=NEB,v=V.view;if(V.lab&&nebLabOk(V.lab.x,V.lab.y,0.25))return;
  V.lab=null;let best=0.3;const TG=V.TG,n=TG+1,st=v.TW/TG;
  for(let j=v.j0;j<=v.j1;j++)for(let i=v.i0;i<=v.i1;i++){const T=V.tiles.get(nebKey(v.L,i,j));if(!T||!T.cv)continue;
    for(let b=2;b<n;b+=4)for(let a=2;a<n;a+=4){const d=T.G[b*n+a];if(!(d>best))continue;const x=(i*TG+a)*st,y=(j*TG+b)*st;if(nebLabOk(x,y,-1)){best=d;V.lab={x:x,y:y};}}}
}
function nebDraw(){ /* 普通画面的星云层:视图变了或有新块才重拼整屏缓存,然后 1:1 贴 */
  const V=NEB;V.fr++;
  if(V.dpr!==DPR){V.tiles.clear();V.dpr=DPR;V.vs=[];}
  if(!V.fc||V.fc.width!==cv.width||V.fc.height!==cv.height){V.fc=document.createElement('canvas');V.fc.width=cv.width;V.fc.height=cv.height;V.fx=V.fc.getContext('2d');V.vs=[];}
  const L=nebLevel(),TW=V.TG*Math.pow(2,L),ox=CLOUD.pos[0],oy=CLOUD.pos[1],w0=worldAt(0,0),w1=worldAt(W,H);
  const vs=[cam.x,cam.y,cam.zoom,W,H,DPR,ox,oy];let dirty=irvNe(vs,V.vs);
  if(dirty||V.pend){
    const v={L:L,TW:TW,ox:ox,oy:oy,i0:Math.floor((w0[0]-ox)/TW),i1:Math.floor((w1[0]-ox)/TW),j0:Math.floor((w0[1]-oy)/TW),j1:Math.floor((w1[1]-oy)/TW)},miss=[];V.view=v;
    for(let j=v.j0;j<=v.j1;j++)for(let i=v.i0;i<=v.i1;i++)if(!V.tiles.has(nebKey(L,i,j)))miss.push(i,j);
    V.pend=false;
    if(miss.length){
      let bare=0;for(let k=0;k<miss.length;k+=2)if(!nebHasCover(L,miss[k],miss[k+1]))bare++;
      if(bare*4>(v.i1-v.i0+1)*(v.j1-v.j0+1))for(let j=v.j0>>3;j<=v.j1>>3;j++)for(let i=v.i0>>3;i<=v.i1>>3;i++){const k=nebKey(L+3,i,j);if(!V.tiles.has(k))V.tiles.set(k,nebBuild(L+3,i,j));}
        // 视野四分之一以上什么都垫不上(开页、跳得远):先造粗三级的几块;平移露出的一条边不值得,一两帧就补上
      const ci=(cam.x-ox)/TW-0.5,cj=(cam.y-oy)/TW-0.5,ord=[];for(let k=0;k<miss.length;k+=2)ord.push(k);
      ord.sort(function(p,q){const a=miss[p]-ci,b=miss[p+1]-cj,c=miss[q]-ci,d=miss[q+1]-cj;return a*a+b*b-c*c-d*d;});   // 离屏幕中心近的先造
      const t0=performance.now();let k=0;
      for(;k<ord.length&&(k===0||performance.now()-t0<V.BUDGET);k++){const i=miss[ord[k]],j=miss[ord[k]+1];V.tiles.set(nebKey(L,i,j),nebBuild(L,i,j));}
      V.pend=k<ord.length;dirty=true;
    }
  }
  if(dirty){nebCompose();V.vs=vs;nebLabelFind();}
  else if(V.lab&&!nebLabOk(V.lab.x,V.lab.y,-1))nebLabelFind();   // 船拖到字上了:换个地方写
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(V.fc,0,0);ctx.setTransform(DPR,0,0,DPR,0,0);
  if(V.lab){const p=toScreen(V.lab.x+ox,V.lab.y+oy);label('尘埃云',p[0]-16,p[1]+4,'#8fa3b8');}
}
function drawPlain(){
  if(IRM_CLOUD.on)nebDraw();
  if(irmPlanet){const p=toScreen(irmPlanet.pos[0],irmPlanet.pos[1]),r=Math.max(4,IRM_PLANET.R*cam.zoom),u=irmSunDirAt(irmPlanet.pos);
    ctx.save();ctx.beginPath();ctx.arc(p[0],p[1],r,0,2*Math.PI);ctx.fillStyle='#26303a';ctx.fill();ctx.clip();
    if(u){ctx.translate(p[0],p[1]);ctx.rotate(Math.atan2(u[1],u[0]));ctx.fillStyle='#b0a070';ctx.fillRect(0,-r,r,2*r);}
    ctx.restore();label('天体',p[0]+r+4,p[1]+4,'#8a98a6');}
  const zf=hullZoomF();
  for(const k of rocks){if(k.dead)continue;const p=toScreen(k.pos[0],k.pos[1]);if(p[0]<-20||p[0]>W+20||p[1]<-20||p[1]>H+20)continue;
    ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(Math.atan2(k.facing[1],k.facing[0]));ctx.fillStyle=k.name==='小行星'?'#8a8278':'#6a655e';rockPath(ctx,Math.max(1.5,2.2*Math.sqrt(k.size)*zf));ctx.fill();ctx.restore();}
}
function drawShipIcon(s){
  const p=toScreen(s.pos[0],s.pos[1]);if(p[0]<-40||p[0]>W+40||p[1]<-40||p[1]>H+40)return;
  const col=s.side==='blue'?'#6fb4ff':'#ff6b5a';
  ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(Math.atan2(s.facing[1],s.facing[0]));
  if(shipMarkMode()){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,3.5);ctx.lineTo(-4,-3.5);ctx.closePath();ctx.fill();}
  else{const sz=hullSize(s.cls,s.tier)*hullZoomF()*SHIP_K;ctx.save();ctx.scale(sz,sz);hullDraw(ctx,s.cls,col,col,false);ctx.restore();
    if(s.flame){ctx.strokeStyle='#ffb040';ctx.lineWidth=2;ctx.beginPath();const x=s.flame>0?-sz:1.5*sz,d=s.flame>0?-1:1;ctx.moveTo(x,0);ctx.lineTo(x+d*sz*0.9,0);ctx.stroke();}}
  ctx.restore();
  if(s.emitMode==='paint'){ctx.save();ctx.setLineDash([2,3]);ctx.strokeStyle=col;ctx.beginPath();ctx.arc(p[0],p[1],14,0,2*Math.PI);ctx.stroke();ctx.restore();}
  label(s.name,p[0]+10,p[1]-9,s.side==='blue'?'#5a8ab8':'#b8645a');
}
function drawOverlay(){
  for(const s of ships)if(!s.dead&&(!IRM.on||s.side==='blue'))drawShipIcon(s);
  if(sel){const p=toScreen(sel.pos[0],sel.pos[1]);ctx.strokeStyle='#e8eef4';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p[0],p[1],18,0,2*Math.PI);ctx.stroke();}
  if(IRM_SUN.mode==='dir'){const a=IRM_SUN.BRG*Math.PI/180,q=edgePoint(Math.cos(a),Math.sin(a),30);sunIcon(q[0],q[1],'太阳');}
  if(irmStar){const p=toScreen(irmStar.pos[0],irmStar.pos[1]);
    if(p[0]>=0&&p[0]<=W&&p[1]>=0&&p[1]<=H){if(!IRM.on){ctx.fillStyle='#ffd060';ctx.beginPath();ctx.arc(p[0],p[1],Math.max(6,IRM_SUN.R_SAT*cam.zoom),0,2*Math.PI);ctx.fill();}label('恒星',p[0]+10,p[1]-10,'#ffd060');}
    else{const dx=p[0]-W/2,dy=p[1]-H/2,l=Math.hypot(dx,dy)||1,q=edgePoint(dx/l,dy/l,30);sunIcon(q[0],q[1],'恒星');}}
}

/* ---- 主循环与每帧毫秒数 ---- */
const PERF={n:0,sum:0,max:0,shown:0};
function frame(){
  const t0=performance.now();
  if(STRESS.length)stressStep();
  if((window.devicePixelRatio||1)!==DPR)resize();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#070a0e';ctx.fillRect(0,0,W,H);drawGrid();
  if(IRM.on)drawIrMap();else{IRV.live=false;drawPlain();}
  drawOverlay();
  const dt=performance.now()-t0;PERF.n++;PERF.sum+=dt;PERF.max=Math.max(PERF.max,dt);
  if(t0-PERF.shown>500){document.getElementById('perf').textContent='帧 '+(PERF.sum/PERF.n).toFixed(2)+' ms · 峰 '+PERF.max.toFixed(1)+' ms'+(IRM.on?' · 上次重算 '+IRV.tFull.toFixed(1)+' ms':'');PERF.n=0;PERF.sum=0;PERF.max=0;PERF.shown=t0;}
  requestAnimationFrame(frame);
}

/* ---- 交互:左键拖任何东西(12 像素内最近的点状物,其次天体圆盘、云的浓处);只点不拖 = 选船;右键拖平移;滚轮缩放 ---- */
function pickAt(sx,sy){
  let best=null,bd=12;
  for(const o of ships.concat(rocks,irmStar?[irmStar]:[])){if(o.dead)continue;const p=toScreen(o.pos[0],o.pos[1]),d=Math.hypot(p[0]-sx,p[1]-sy);if(d<bd){bd=d;best=o;}}
  if(!best&&irmPlanet){const p=toScreen(irmPlanet.pos[0],irmPlanet.pos[1]);if(Math.hypot(p[0]-sx,p[1]-sy)<Math.max(12,IRM_PLANET.R*cam.zoom))best=irmPlanet;}
  if(!best&&IRM_CLOUD.on){const w=worldAt(sx,sy);if(irmCloudD(w[0]-CLOUD.pos[0],w[1]-CLOUD.pos[1],2*Math.pow(2,nebLevel()))>=0.15)best=CLOUD;}   // 点在云的浓处:拖整片场
  return best;
}
let drag=null,pan=null;
cv.addEventListener('mousedown',function(e){
  if(e.button===2){pan={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};return;}
  if(e.button!==0)return;
  const o=pickAt(e.clientX,e.clientY),w=worldAt(e.clientX,e.clientY);
  drag={o:o,sx:e.clientX,sy:e.clientY,moved:false,ox:o?o.pos[0]-w[0]:0,oy:o?o.pos[1]-w[1]:0};
});
window.addEventListener('mousemove',function(e){
  if(pan){cam.x=pan.cx-(e.clientX-pan.sx)/cam.zoom;cam.y=pan.cy-(e.clientY-pan.sy)/cam.zoom;return;}
  if(!drag||!drag.o)return;
  if(!drag.moved&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<=4)return;
  drag.moved=true;const w=worldAt(e.clientX,e.clientY);drag.o.pos[0]=w[0]+drag.ox;drag.o.pos[1]=w[1]+drag.oy;
});
window.addEventListener('mouseup',function(e){
  if(e.button===2)pan=null;
  if(e.button===0&&drag){if(!drag.moved){sel=(drag.o&&drag.o.kind==='ship')?drag.o:null;syncUI();}drag=null;}
});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('wheel',function(e){
  e.preventDefault();const w0=worldAt(e.clientX,e.clientY);
  cam.zoom=Math.max(2e-6,Math.min(0.05,cam.zoom*Math.pow(1.0015,-e.deltaY)));
  const w1=worldAt(e.clientX,e.clientY);cam.x+=w0[0]-w1[0];cam.y+=w0[1]-w1[1];
},{passive:false});

/* ---- 左下角开关 ---- */
function syncUI(){
  document.getElementById('irBtn').classList.toggle('on',IRM.on);
  for(const x of document.querySelectorAll('#irMode [data-irm]'))x.classList.toggle('on',x.getAttribute('data-irm')===IRM.mode);
  document.getElementById('irMode').style.opacity=IRM.on?'1':'.45';
  for(const x of document.querySelectorAll('#irSun [data-sun]'))x.classList.toggle('on',x.getAttribute('data-sun')===IRM_SUN.mode);
  document.querySelector('#irEnv [data-env="cloud"]').classList.toggle('on',IRM_CLOUD.on);
  document.querySelector('#irEnv [data-env="planet"]').classList.toggle('on',IRM_PLANET.on);
  document.getElementById('rowSel').style.display=sel?'flex':'none';
  if(sel){document.getElementById('selName').textContent=sel.name;
    for(const x of document.querySelectorAll('#selFlame [data-fl]'))x.classList.toggle('on',+x.getAttribute('data-fl')===sel.flame);
    for(const x of document.querySelectorAll('#selEmit [data-em]'))x.classList.toggle('on',x.getAttribute('data-em')===sel.emitMode);}
  uiRect=document.getElementById('ui').getBoundingClientRect();
}
function onClick(id,fn){document.getElementById(id).addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;b.blur();fn(b);syncUI();});}
onClick('irBtn',function(){IRM.on=!IRM.on;});
onClick('irMode',function(b){IRM.mode=b.getAttribute('data-irm');});
onClick('irSun',function(b){irmSunSet(b.getAttribute('data-sun'));});
onClick('irEnv',function(b){const k=b.getAttribute('data-env');if(k==='cloud')IRM_CLOUD.on=!IRM_CLOUD.on;else{IRM_PLANET.on=!IRM_PLANET.on;irmPlanet=IRM_PLANET.on?PLANET:null;}});
onClick('selFlame',function(b){if(sel)sel.flame=+b.getAttribute('data-fl');});
onClick('selEmit',function(b){if(sel)sel.emitMode=b.getAttribute('data-em');});

/* 地址参数(截图用):?ir 开红外;mode=yi;sun=dir|pos;cloud=0;planet=0;cam=x,y,zoom;burn=i / rev=i 第 i 艘船主推 / 反推;sel=i;stress=N 撒 N 个在动的热源 */
{const Q=new URLSearchParams(location.search);
  if(Q.has('ir'))IRM.on=true;if(Q.get('mode')==='yi')IRM.mode='yi';
  if(Q.get('cloud')==='0')IRM_CLOUD.on=false;if(Q.get('planet')==='0'){IRM_PLANET.on=false;irmPlanet=null;}
  if(Q.has('cam')){const c=Q.get('cam').split(',').map(Number);if(c.length===3&&c.every(isFinite)){cam.x=c[0];cam.y=c[1];cam.zoom=c[2];}}
  if(Q.has('burn')&&ships[+Q.get('burn')])ships[+Q.get('burn')].flame=1;
  if(Q.has('rev')&&ships[+Q.get('rev')])ships[+Q.get('rev')].flame=-1;
  if(Q.has('sel')&&ships[+Q.get('sel')])sel=ships[+Q.get('sel')];
  if(Q.has('stress'))stressInit(+Q.get('stress')||0);
  irmSunSet(Q.get('sun')==='dir'||Q.get('sun')==='pos'?Q.get('sun'):'none');}
window.addEventListener('resize',function(){resize();syncUI();});resize();syncUI();requestAnimationFrame(frame);
</script>
