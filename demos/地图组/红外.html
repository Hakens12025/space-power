<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图组 · 红外</title>
<link rel="stylesheet" href="../../css/app.css?v=20260923">
<style>
/* 地图组 · 红外:左下角的开关。几何与"开"态照抄右下角 #tools 的工具钮(css/app.css),颜色一律走设计变量 */
#irDock{position:absolute;left:var(--gut);bottom:56px;z-index:var(--z-hud);display:flex;align-items:center;gap:6px}
#irMode,#irSun,#irEnv{display:inline-flex}
#irMode .hbtn,#irSun .hbtn,#irEnv .hbtn{border-radius:0;margin-left:-1px}
#irMode .hbtn:first-child,#irSun .hbtn:first-child,#irEnv .hbtn:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);margin-left:0}
#irMode .hbtn:last-child,#irSun .hbtn:last-child,#irEnv .hbtn:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
#irDock .hbtn.on{color:var(--acc);border-color:var(--acc);position:relative;z-index:1}
/* ENV2 顶栏「对局」「碎石带」两钮藏起来:它们会把 envIdx 切走,而本页的开关写的是「测试·红外」那份 world(E6) */
#btnMatch,#btnRocks{display:none}
#irSelftest,#irPerf{position:fixed;left:8px;top:60px;z-index:var(--z-transient);white-space:pre-wrap;padding:8px;background:var(--srf-panel);color:var(--txt);font:12px var(--ff-mono,monospace)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<!-- UI2:两个工具钮是图标钮(行内 SVG,颜色全走 css token),文字收进 title / aria-label。
     SN6 右下角工具钮。钮的行为走 render/85-settings 的事件委托。 -->
<div id="tools">
  <div class="seg" id="segTier" title="三级星图:星图自己的比例尺阶梯 —— 画面短边横跨 战术 2 / 舰队 15 / 战区 45 光秒"><button class="hbtn" data-tier="1">战术</button><button class="hbtn" data-tier="2">舰队</button><button class="hbtn" data-tier="3">战区</button></div><!-- SN6b 从顶栏搬到这儿(用户拍板"三按钮放在右下角,大小和形状参考态势感知V3")。id 未变 ⇒ render/85-settings 的委托与 80-viewtier 里写高亮的那行都不用改 -->
  <div class="seg" id="segTool"><button class="hbtn" data-tool="geom" title="缩圈:地图右上角弹出【定位几何】小窗——我方全体观测合起来,对方那艘船的误差椭圆现在有多大、离导弹门/主炮门还差多少。悬停敌方目标临时看;左键点敌方目标常驻;点我方舰看它正在打(或正在等)的那个目标" aria-label="缩圈"><svg class="tl-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="i-ship" d="M17.6 12.9 8 6.4 11 12.3 8.4 17.9Z"/><ellipse class="i-ell" cx="12" cy="12" rx="10.8" ry="5.4" transform="rotate(-13 12 12)"/><path class="i-los" d="M0 14.8 24 9.2"/></svg></button><button class="hbtn" data-tool="sig" title="信号视野:画出我方每艘舰的【被探测范围】——光学/红外恒有;开了雷达才有被听见的那一圈。半径直接读感知层的量程律,与判据同一个数" aria-label="信号视野"><svg class="tl-ico" viewBox="0 0 24 24" aria-hidden="true"><circle class="i-r3" cx="12" cy="12.6" r="11.4"/><circle class="i-r2" cx="12" cy="12.6" r="8.2"/><circle class="i-r1" cx="12" cy="12.6" r="5"/><path class="i-ship" d="M12 5.4 15.9 18 12 14.8 8.1 18Z"/></svg></button></div>
</div>
<!-- SN7 定位几何小窗:叠在地图右上角、紧贴右轨左侧(照 demos/sensors/态势感知V3.html 的 #pPhase)。自己的小 canvas,不进主画布;
     开关是右下角 #tools 的「缩圈」钮(render/85-settings 的委托)。 -->
<div id="geomPane" class="panel" hidden><canvas id="geomCv"></canvas><div class="gp-tag">定位几何<b>GEOMETRY</b></div><div class="gp-hint" id="geomHint"></div></div>
<!-- MT1 对局结果卡片:只在对局分出胜负时由 scenario/97-match 的 matchTick 显示。 -->
<div id="matchEnd" class="panel" hidden><div class="me-title" id="meTitle">胜利</div><div class="me-sub" id="meSub"></div><div class="me-stat" id="meStat"></div><div class="me-btns"><button class="btn" id="meAgain">再来一局</button><button class="btn" id="meRange">回靶场</button></div></div>
<div id="mapTag">战术层<b>TACTICAL</b></div><!-- SN6 当前层的读数,只在【换层那一刻】写(render/80-viewtier 的 vtFrame) -->

<!-- 地图组 · 红外:左下角的红外开关 + 两种投法(甲 位置 / 乙 方向)。逻辑在本页最后那段脚本里 -->
<div id="irDock"><button class="hbtn" id="irBtn" title="红外图(热像):整屏一层底红,有热源的地方与背景不平衡、颜色偏离底红 —— 越强偏得越多(暗红 → 橙 → 黄 → 近白)。色标固定:同样的热永远是同样的颜色。带一点传感器噪声:很弱的热会淹在颗粒里。点火、开火、开雷达的船会更偏">红外</button><div id="irMode"><button class="hbtn" data-irm="jia" title="甲 位置:热源在它所在的位置偏色。近处小而亮,远处大而淡(越远越糊)">甲 位置</button><button class="hbtn" data-irm="yi" title="乙 方向:我方每艘船朝热源的那一片扇区整体偏暖,沿着这个方向远近都一样(红外量不到距离);几艘船的扇区交叠处更偏">乙 方向</button></div><div id="irSun"><button class="hbtn" data-sun="none" title="没有太阳">无太阳</button><button class="hbtn" data-sun="dir" title="太阳·方向:太阳在无穷远的方位 150°(与碎石带那颗同方位),写进引擎,引擎的探测也照它致盲(禁区半角 30°;碎石带那颗是 10°,不受影响)。乙:朝太阳那片扇区刺眼;甲:看不到太阳本身,但禁区里的热源被晃掉">太阳·方向</button><button class="hbtn" data-sun="pos" title="太阳·位置:在地图上放一颗有位置的恒星,真太阳大小(半径 69.6 万公里),默认 690 万公里外(约帕克太阳探测器最近点),能拖。写进引擎,引擎的探测也照它致盲(禁区半角 30°)。甲:刺眼的亮斑加散射光晕;乙:朝它那片扇区刺眼">太阳·位置</button></div><div id="irEnv"><button class="hbtn" data-env="cloud" title="尘埃云(红外卷云):地图上的丝状暖色结构,有太阳时被晒热、更亮。衬在云里的目标背景热、对比度低,更难看清">尘埃云</button><button class="hbtn" data-env="planet" title="天体:一颗海王星大小的天体(能拖)。朝阳那半边亮;身后拖一条影子,影子里晒不到太阳、更冷,躲在里面也不被太阳晃;它挡在中间就看不见后面">天体</button></div></div>

<div id="hud" class="panel">
  <div class="logo">SPACE POWER<span> · 骨架</span></div>
  <div id="clock">00:00</div>
  <div id="rate">x1</div>
  <button class="hbtn" id="btnPause" title="暂停/继续(空格)">⏸</button>
  <button class="hbtn" id="btnSlow" title="减速(-)">−</button>
  <button class="hbtn" id="btnFast" title="加速(+)">+</button>
  <div class="spacer"></div>
  <button class="hbtn" id="btnMatch" title="进入对局">对局</button>
  <button class="hbtn" id="btnRocks" title="进入碎石带对局">碎石带</button><!-- ENV1 带环境的对局(太阳禁区 + 残骸场);入口逻辑在 scenario/97-match --><!-- MT1 对局入口(scenario/97-match);进了对局它变成「回靶场」 -->
  <button class="hbtn" id="btnTut" title="教程 · 指挥官手册(Esc 关闭)">教程</button><!-- RF5-D 排在 .spacer 之后 = 顶栏右端。SL1(2026-09-22 瘦身):原来跟在它后面被藏着的七个旧钮(录制/GM/互搏/靶场参数/场景菜单/回放/设置)已整套删除;GM 仍走 F8 -->
</div>

<!-- FM1 编队书签栏(左轨顶部,常驻)。这是编队的唯一可见入口。
     刻意不给 class="panel":.panel 带 overflow:hidden + 边框背景,会把一叠独立小条圈成一块面板。内容由 render/87-fmbar.js 填。 -->
<div id="fmBar"></div>
<!-- FM7 测试用「加船」小条:挂在左轨书签栏下方。靶场只有 3 艘蓝舰,凑不出两支编队,阵型没法手试。
     内容由 scenario/96-spawn.js 建。 -->
<div id="spawnBar"></div>
<!-- FM1 编队菜单(点书签展开)。.p-title / #fmActs 两个容器必须是【静态元素】(信息区 #selFm 已搬到右轨 #selPanel 里)——
     事件全部委托到它们身上,而 on() 遇元素不存在只会静默跳过,动态创建的容器挂不上委托。
     默认 display:none,由 updFmBar() 写回 'flex'(不是 '')。 -->
<div id="fmMenu" class="panel" style="display:none">
  <div class="p-title"><b id="fmTitle">编队</b><span class="hint" id="fmHint">—</span></div>
  <div id="fmActs"></div>
</div>

<!-- RF2 简化UI:选中舰实时信息面板(右轨)。SL1(2026-09-22 瘦身):旧舰队卡面板 / 事件面板 / 右轨底部的事件流面板已整套删除,右轨只剩这一块 -->
<div id="selPanel" class="panel">
  <div class="p-title"><b id="selTitle">未选中</b><span class="hint">左键点选 · 拖拽框选</span></div>
  <div id="selInfo"></div>
  <!-- FL1 编队信息区:原 #fmMenu 里的 #fmInfo,整块搬到右轨。理由是"左边只放操作、右边只放实时数据"。
       必须是【静态元素】:87-fmbar 的事件委托挂在它身上,而 on() 遇元素不存在只会静默跳过。
       显隐由 88-selpanel 的 updateSelPanel 独占(选中的恰好是一支编队才显示),87-fmbar 只管往里写内容。 -->
  <div id="selFm" style="display:none"></div>
  <div id="fcSec"><!-- RF5 火控计算机:序列/目标解算列表。#fcList 必须是静态元素——on() 遇元素不存在会静默跳过,动态创建挂不上委托 -->
    <div class="fc-hd">火控计算机<span class="fc-btn" id="fcPickBtn" title="把当前序列态那条设为唯一开火序列;再按一次回到轮询">选择</span></div><!-- RF8b 舰级"选择"钮:刻意【不进 #fcList】——那里每 20 帧重渲一次,且委托要求带 data-seq(舰级动作没有),上一版的大序列钮正是栽在这条上 -->
    <div id="fcList"></div>
  </div>
</div>

<!-- RANGE1 靶场参数面板:左上角,UI1 左轨车道统一定位。SL1:顶栏那个开关钮已删,面板逻辑(scenario/95-range)保留,css 里仍按 RF2 的老样子藏着 -->
<div id="trPanel" class="panel" style="display:none"><!-- UI1 原来这里写死 max-height:calc(100% - 316px),把旋钮区压成 8px;现由 --rail-top/--dock-b 派生 -->
  <div class="p-title"><b>🎯 靶场参数</b><span class="hint">逐靶可调</span></div>
  <div class="tr-tabs" id="trTabs"></div>
  <div class="tr-body" id="trBody"></div>
  <div class="tr-read" id="trRead"></div>
  <div class="tr-btns">
    <button class="ed-btn" id="trSyncBtn" title="打开后改任一旋钮同时作用于三个靶">同步全靶:关</button>
    <button class="ed-btn" id="trReset" title="伤害/命中/防御链读数全部归零并重新计时">归零统计</button>
    <button class="ed-btn danger" id="trClose">✕ 关闭</button>
  </div>
</div>

<!-- RF3 简化UI:底部操作栏三区 = 舰名区 | 规格读数列(标签上/数值下) | 开关组(88-selpanel 按 s.weapons 配装动态生成) -->
<div id="cmdBar" class="panel">
  <div class="cmd-ship"><b id="ciName">—</b><span id="ciCls">—</span></div>
  <div class="cmd-sep"></div>
  <div id="ciSpec"></div>
  <div class="cmd-sep"></div>
  <div class="cmd-btns"></div>
</div>
<div id="cmdTip"></div>
<!-- RF5-D 教程模态(顶栏 #btnTut 唤出)。内容由 render/85-tutorial.js 惰性写进 #tutBody(打开过一次才存在),
     所以常规画面下这里是三个空壳,零元素泄漏。SL1:旧设置面板的遮罩已删,这是顶栏唯一的模态。 -->
<div id="tutOverlay">
  <div id="tutPanel">
    <div class="tut-hd">
      <h2>指挥官手册</h2>
      <span class="tut-hd-hint">Esc / 点遮罩 关闭 · 打开期间模拟暂停</span>
      <button class="hbtn" id="tutCloseBtn" title="关闭教程(Esc)">✕</button>
    </div>
    <div class="tut-body" id="tutBody"></div>
  </div>
</div>

<!-- FM4 舰队编组控制页(编队菜单的「编组控制」钮唤出)。几何抄 #tutOverlay:外层 flex 居中 + 卡片定高 + 内层独立滚动。
     内容由 render/89-fmpage.js 的 fmPageRender() 写进 #fpBody,
     常规画面下这里是三个空壳。委托挂在 #fmPage / #fpClose 两个静态元素上,所以内容随便重渲都挂得住。 -->
<div id="fmPage">
  <div id="fmPagePanel">
    <div class="fp-hd">
      <h2>舰队编组控制</h2>
      <span class="fp-hd-hint" id="fpHint">—</span>
      <button class="hbtn" id="fpClose" title="关闭(Esc)">✕</button>
    </div>
    <div class="fp-body" id="fpBody"></div>
  </div>
</div>

<div id="xhTip"></div><!-- RF5 悬停敌舰信息卡:跟随光标,内容按 litBlue 接触等级分档(command/74-targeting 写 innerHTML)。刻意不给 class="panel":.panel 带 z-index:var(--z-panel) 与 overflow:hidden,会把层级压回面板档还裁掉内容,几何一律自带(抄 #cmdTip) -->

<!-- RF1: 目录=系统。编号十位是系统层(0core/1ships/2sensors/3physics/4formation/5weapons/6bots/7command/8render/9scenario)。
     硬约束仅两条:core/00 定义 on() 必须最先(85/95/96/97 顶层调用它);core/99 顶层执行 init() 必须最后(且 init 调 loadRangeCfg,
     故 scenario/95 必须在它之前)。其余跨文件引用全在运行期解析,层序排列只为可读性。 -->
<script src="../../js/core/00-config.js?v=20260923"></script>
<script src="../../js/core/01-state.js?v=20260923"></script>
<script src="../../js/ships/10-hull-geometry.js?v=20260923"></script>
<script src="../../js/ships/11-classes.js?v=20260923"></script>
<script src="../../js/world/12-env.js?v=20260923"></script><!-- ENV1 环境系统:太阳禁区 + 残骸场 + 石头(TK4c)。必须在 sensors/ 之前:23-cov 加载期的梯子反解会读 optLum → envOptK -->
<script src="../../js/world/13-dust.js?v=20260923"></script><!-- ENV2 世界层的尘埃云:噪声与背景亮度(envDustOne / envCloudDensity / envBg)。与 12-env 同属世界层,排在 sensors/ 之前;顶层只有声明,运行期才读 ENV -->
<script src="../../js/sensors/20-signature.js?v=20260923"></script>
<script src="../../js/sensors/21-detect.js?v=20260923"></script>
<script src="../../js/sensors/22-percep.js?v=20260923"></script><!-- SN4 感知纯函数层:零顶层执行(只声明模块私有的 Float64Array 缓冲与三个纯字面量常量,不读 SENS/sReq/ships 任何东西)、不调 on()、不是 core/99,所以两条加载顺序硬约束都不涉及;跨文件引用(SENS 在 20-signature、sReq 在 00-config)全部运行期解析,与 formation/39-fmcaps 同口径 —— 排在 21-detect 之后只为目录编号好读,换到别处也不会错 -->
<script src="../../js/sensors/23-cov.js?v=20260923"></script><!-- SN6 误差椭圆感知内核:同样零顶层执行(只声明;ladApply 不在加载期跑) -->
<script src="../../js/sensors/24-track.js?v=20260923"></script><!-- TK1 航迹表(每方一张 WeakMap):顶层只建 TRK 与 TRK_FWD、只调同文件的函数;ships/11 的 makeShip 虽然排在它前面,但只在运行期调 trkAdopt(init 与判据里),所以不构成加载顺序约束 -->
<script src="../../js/sensors/25-optpair.js?v=20260924"></script><!-- ENV2 成对光学模型(晒热 / 杂散光 / 云背景):顶层只有声明,22-percep 的精算步与弹丸路径在运行期调 -->
<script src="../../js/physics/30-motion.js?v=20260923"></script>
<script src="../../js/physics/31-step-ships.js?v=20260923"></script>
<script src="../../js/physics/32-route-refine.js?v=20260923"></script>
<script src="../../js/formation/39-fmcaps.js?v=20260923"></script><!-- FM4 编队能力模型层:9 维能力(读配装实例字段)/四套站位模板/五条带半径/插槽扩容/匈牙利最优指派。纯函数,零顶层执行;排在 40 之前只为可读性,跨文件引用全在运行期解析 -->
<script src="../../js/formation/40-slots.js?v=20260923"></script>
<script src="../../js/formation/41-follow.js?v=20260923"></script>
<script src="../../js/formation/42-formation.js?v=20260923"></script>
<script src="../../js/formation/43-step.js?v=20260923"></script>
<script src="../../js/formation/44-orders.js?v=20260923"></script><!-- FM1 编队重做:40几何(纯函数)/41通用跟随层/42编队实体(生命周期)/43每tick结算/44命令层。顶层只有 const/let/function,零顶层执行,跨文件引用全在运行期解析 -->
<script src="../../js/weapons/50-missile-spec.js?v=20260923"></script>
<script src="../../js/weapons/51-defs.js?v=20260923"></script>
<script src="../../js/weapons/51-ciws.js?v=20260923"></script>
<script src="../../js/weapons/52-fire.js?v=20260923"></script>
<script src="../../js/weapons/53-nets.js?v=20260923"></script>
<script src="../../js/weapons/54-missiles.js?v=20260923"></script>
<script src="../../js/weapons/55-damage.js?v=20260923"></script>
<script src="../../js/weapons/56-step-projectiles.js?v=20260923"></script>
<script src="../../js/weapons/57-step-weapons.js?v=20260923"></script>
<script src="../../js/weapons/58-firecontrol.js?v=20260923"></script><!-- RF5 火控计算机引擎:序列数据模型+stepFireControl/Post。位置只为目录编号可读性(编号 58 > 57,归位到 weapons 块末尾),跨文件引用全在运行期解析:本文件顶层只有 const/let/function 声明,零顶层执行 -->
<script src="../../js/core/05-sim.js?v=20260923"></script>
<script src="../../js/core/06-timecomp.js?v=20260923"></script><!-- TC1 接触降速:frame() 每帧调 tcStep;依赖全部在运行期解析 -->
<script src="../../js/bots/60-doctrine.js?v=20260923"></script>
<script src="../../js/bots/61-enemy.js?v=20260923"></script>
<script src="../../js/command/70-input.js?v=20260923"></script>

   用户:「面向太阳和背对太阳我觉得红外识别是不一致的」—— 有太阳时两头都跟太阳的几何走(见 irmLumK / irmContrast 两节):
     目标这一头按相位角变热(背对太阳看看到晒热的面);观测这一头面向太阳看时背景被杂散光抬亮、甲里的山又矮又宽 */
/* ENV2 演示页特权两条:① 甲图按真值位置画发现线以下的信号;② 热源不含弹丸(审查一第 19 条)。其余物理一律调引擎,开关与拖动只改「测试·红外」那份 world */
const IRM={on:false,mode:'jia',
  CELL:5,                  /* 底图一格 = 多少屏幕像素 */
  V0:0.02,VMAX:SENS.GLARE.EDGE,       /* 固定色标:t = ln(1 + v/V0) / ln(1 + VMAX/V0);v = 0 是纯底红,v = 1000 顶到近白 */
  TAIL_K:4,                // ENV2 甲的尾巴长几个山宽(视图的示意,不是物理)
  POS_P:3,                 // ENV2 位置型恒星光晕的距离律次数(视图自己的数)
  CULL:0.0003,             /* 甲:每座山贴到低于它为止 —— 必须低到色标上连一格都显不出(t 舍入到 0 要 v < 0.00043)。
                              第一版取 0.002,色标在那里已有一格偏色,很弱的山被截出一圈看得见的台阶;按行列分开贴时范围是方的,于是出现淡淡的方块 */
  SIG_MIN:0.7,             /* 甲:山的最小宽度(格) */
  BINS:1440,               /* 乙:360° 全景条分多少格(0.25°) */
  SNR_MIN:0.0003,          /* 乙:信噪比低于它的热源不进全景条(同上,低到色标上显不出,热源越过它时不会"冒出来") */
  NOISE:0.005,NOISE_MS:200 /* 传感器噪声:每格加一个标准差 = 0.005(场的单位,1 = 发现线)的高斯颗粒,每 0.2 秒换一次。
                              0.01 截图看是满屏明显的颗粒、0.004 要凑近才看得出,取中间;对数色标在零附近放大弱信号,所以这个数看着小 */
};
/* 色带:t = 0 是底红,往上偏暖;往下(只有噪声会把它压到负的)比底红略暗。RGBA,A 按 0~255(整屏都铺,底色本身带透明度,星空与网格隐约可见) */
const IRM_T0=-0.1;
const IRM_RAMP=[[IRM_T0,[40,6,6,140]],[0,[70,12,12,150]],[0.25,[150,30,20,170]],[0.5,[220,80,30,190]],[0.75,[255,170,60,210]],[1,[255,245,210,230]]];
const IRM_LUT=(function(){const L=new Uint8ClampedArray(256*4);for(let k=0;k<256;k++){const t=IRM_T0+k/255*(1-IRM_T0);let a=0;while(a<IRM_RAMP.length-2&&t>IRM_RAMP[a+1][0])a++;
  const p=IRM_RAMP[a],q=IRM_RAMP[a+1],u=Math.max(0,Math.min(1,(t-p[0])/(q[0]-p[0])));for(let c=0;c<4;c++)L[k*4+c]=Math.round(p[1][c]+(q[1][c]-p[1][c])*u);}return L;})();
function irmT(v){ /* 两头对称的对数色标:t = sign(v) x ln(1 + |v|/V0) / ln(1 + VMAX/V0),钳在 [T0, 1] */
  if(!(v!==0)||!isFinite(v))return 0;
  const t=Math.sign(v)*Math.log(1+Math.abs(v)/IRM.V0)/Math.log(1+IRM.VMAX/IRM.V0);return t>1?1:(t<IRM_T0?IRM_T0:t);}
function irmIdx(v){return Math.round((irmT(v)-IRM_T0)/(1-IRM_T0)*255);}
let irmRef=null;
function irmRefGet(){ /* 刻度的参照:一艘熄火静默的 DD,在引擎给它的发现距离上的模糊宽度 */
  if(irmRef)return irmRef;
  const t={kind:'ship',size:shipStats('DD',2).size,flame:0,sideFlame:0,emitMode:'silent',fireHot:0,pos:null};
  const R=visRangeOf(t);irmRef={R:R,sig:R*covTheta('opt',null,t,R)};return irmRef;
}
function irmObservers(){const D=detectorsOf('blue');return D.dets.concat(D.bcons);}   // ENV2 观测方 = 引擎的蓝方传感器网络(舰 + 开机信标,审查一第 19 条)
function irmSources(){return ships.filter(s=>s.side!=='blue'&&!s.dead).concat((typeof rocks!=='undefined'?rocks:[]).filter(r=>!r.dead));}
/* 甲的一座山:峰高(按参照归一)与宽度(km)。峰高 = 体积 / 面积 ∝ 信噪比 / 宽度² */
function irmHill(t,obs){
  let best=null;
  for(const o of obs){
    if(senseOptBlocked(o,t))continue;   // ENV2 禁区 / 遮挡 / 自己尾焰致盲三道门走引擎
    const q=senseOptPair(o,t);   // ENV2 甲读打折后的 snrEff / blurEff(逆光、云背景都在引擎里)
    if(!best||q.snrEff>best.snr)best={snr:q.snrEff,blur:q.blurEff,o:o};
  }
  if(!best)return null;
  const ref=irmRefGet(),k=ref.sig/best.blur;
  return {peak:best.snr*k*k,sig:best.blur,o:best.o};
}
/* ---- 宽的山往底红收(用户:「宽的山往底红收」)----
   业内对应:VSUP(value-suppressing uncertainty palette,Correll、Moritz、Heer,CHI 2018):不确定度越大,色标越往一个中性色收拢,
   玩家就不会把"又大又糊"读成"又大又热"。这里的中性色就是底红,不确定度就是山的宽度(位置有多糊)。
   u = 山宽 / 参照宽度(一艘熄火冷驱逐舰恰在发现距离上的那座山);在色标坐标 t 上收:t_画 = t x (1 - w),w = u² / (1 + u²) ——
     很窄的山(近处、看得清)几乎不动;宽度等于参照时 t 减半;宽 3 倍时只剩一成。收的是颜色,不是物理:irmHill 给的峰高、体积不变。
   换成场值:v_画 = V0 x ((1 + v / V0)^(1 - w) - 1)(对数色标的反函数)。只收甲的山;恒星的亮斑、噪声、乙都不收 */
function irmShowPeak(h){
  const u=h.sig/irmRefGet().sig,w=u*u/(1+u*u);
  return IRM.V0*(Math.pow(1+h.peak/IRM.V0,1-w)-1);
}
/* ---- 场:低分辨率底图上的格点 i,j 落在屏幕 (i*CELL, j*CELL) ---- */
let irmF=null,irmGW=0,irmGH=0,irmProf=null;
let irmNzSeed=20260923;
function irmNzRnd(){let t=(irmNzSeed=(irmNzSeed+0x6D2B79F5)>>>0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function irmGrid(){
  const C=IRM.CELL,gw=Math.ceil(W/C)+2,gh=Math.ceil(H/C)+2;
  if(!irmF||irmF.length!==gw*gh)irmF=new Float32Array(gw*gh);else irmF.fill(0);
  irmGW=gw;irmGH=gh;
}
function irmSplatAniso(cx,cy,pk,sa,sc,ux,uy){ /* 各向异性高斯(格为单位):沿 (ux,uy) 宽 sa、垂直方向宽 sc。尾巴与"拉长的山"用 */
  if(!(pk>=IRM.CULL))return;
  const gw=irmGW,gh=irmGH,r=Math.max(sa,sc)*Math.sqrt(2*Math.log(pk/IRM.CULL));
  const i0=Math.max(0,Math.floor(cx-r)),i1=Math.min(gw-1,Math.ceil(cx+r)),j0=Math.max(0,Math.floor(cy-r)),j1=Math.min(gh-1,Math.ceil(cy+r));
  const ea=-0.5/(sa*sa),ec=-0.5/(sc*sc);
  for(let j=j0;j<=j1;j++){const dy=j-cy,row=j*gw;for(let i=i0;i<=i1;i++){const dx=i-cx,a=dx*ux+dy*uy,c=dy*ux-dx*uy;irmF[row+i]+=pk*Math.exp(a*a*ea+c*c*ec);}}

function irmTail(t,h){ /* 甲里的尾巴:尾焰那份热占总热的比例、尾巴的方向;没点火给 null */
  const pl=sensePlume(t);if(!pl||!h.o)return null;
  const p=senseOptParts(h.o,t),tot=p.self+p.plume+p.solar;   // ENV2 份额 = 尾焰热 / 总热,不乘视角(拍板 A1);几何留在页里
  return tot>0?{share:Math.min(1,p.plume/tot),ux:pl[0],uy:pl[1]}:null;

/* ---- 近处看得出舰形 —— 用户选了「2 近处看得出舰形」----
   业内对应:Johnson 准则(Johnson 1958):目标横跨多少个分辨单元(线对)决定能看出什么 ——
     约 1 个:发现(一个点);约 1.4:看出朝向;约 4:认出类型;约 6.4:确认(看得到细节)。
   N = 4 x 体型 x L_REF / 山宽:锚在引擎自己的光学认出门上(23-cov:横向误差收进 体型 x L_REF 就算认出)——
     引擎说"认出了"的那个距离上 N 恰好 = 4。山宽用红外图自己的(含尾焰视角、相位、逆光),所以逆光的船要贴得更近才认得出。
   画法:N < 1 圆团;1 ~ 4 圆团沿船身方向拉长(面积不变,长宽比从 1 渐到 AR,石头到 AR_ROCK)—— 看得出它朝哪;
     N 过 3 起舰形淡入、到 4 全显:按真舰种的舰体几何画一个热轮廓(比山顶再亮一点);山让给它(FADE = 1:整座让出),
       换成一圈贴着舰形的小光晕(宽 = 舰标半径、峰 = 原峰 x HALO)。"分辨得开"的意思就是模糊比目标还小 ——
       第一版山只让出七成,舰标大小的轮廓被一大团光盖住,截图里只剩中间一个小亮条;
     N 过 6.4 画出舰体上的构件(炮塔、舰桥压暗)。点着火的船喷口处一个近白的热点。石头画成不规则的块。
   舰形按舰标的比例放大画(真实船体比地图上一个像素还小,和引擎的舰标同一个系数 hullZoomF);拉远到舰标换记号的那一档就不画。
   只有甲画;乙没有位置。AR / AR_ROCK / FADE 是暂定的数 */
const IRM_RES={AR:3,AR_ROCK:1.5,FADE:1,HALO:0.5,DETAIL:6.4};
let irmSil=[],irmSilDrawn=[];
const irmNBig=new Set();   // ENV2 3b 上次出场里 N > 1 的源:它们的朝向进内容签名(S2)
function irmFieldJia(){ /* 甲:每座山按行、列两个一维高斯相乘贴进底图(可分离,每格一次乘加) */
  irmGrid();irmSil=[];irmNBig.clear();const C=IRM.CELL,gw=irmGW,gh=irmGH,obs=irmObservers();if(!obs.length)return 0;
  let n=0;
  for(const t of irmSources()){
    const h=irmHill(t,obs);if(!h)continue;
    const p=toScreen(t.pos[0],t.pos[1]),cx=p[0]/C,cy=p[1]/C;
    /* 尾巴:尾焰那份热从山里分出来,摊成一条沿喷口方向、长 TAIL_K 个山宽的长条(沿向宽 TAIL_K/2 个山宽、横向一个山宽,中心在船后半条尾巴处) */
    const tl=irmTail(t,h);let hs=h;
    if(tl&&tl.share>0){
      const s0=Math.max(IRM.SIG_MIN,h.sig*cam.zoom/C),sa=s0*IRM.TAIL_K/2,pkT=irmShowPeak({peak:h.peak*tl.share*s0/sa,sig:h.sig*Math.sqrt(IRM.TAIL_K/2)});
      irmSplatAniso(cx+tl.ux*sa,cy+tl.uy*sa,pkT,sa,s0,tl.ux,tl.uy);
      hs={peak:h.peak*(1-tl.share),sig:h.sig,o:h.o};   // ENV2 M10:尾焰那份从山里分出去改在副本上做,产品只读
    }
    const pk0=irmShowPeak(hs);if(!(pk0>=IRM.CULL))continue;   /* 贴的是收过的峰(宽的山往底红收) */
    /* 分辨得开多少(Johnson):舰形淡入的那一段山让出一部分;1 ~ 4 之间沿船身拉长 */
    const N=covResN(t,h.sig),a=Math.max(0,Math.min(1,N-3));if(N>1)irmNBig.add(t);if(a>0)irmSil.push({t:t,N:N,a:a,v:pk0});
    const pk=pk0*(1-IRM_RES.FADE*a);
    if(a>0&&!shipMarkMode()){const ri=(t.kind==='rock'?hullSize('UNK',2)*0.78*Math.sqrt(t.size/0.7):hullSize(t.cls,t.tier||2)*0.78)*hullZoomF()/C;
      irmSplatAniso(cx,cy,pk0*IRM_RES.HALO*a,Math.max(IRM.SIG_MIN,ri),Math.max(IRM.SIG_MIN,ri),1,0);}   /* 贴着舰形的小光晕 */
    if(!(pk>=IRM.CULL)){n++;continue;}
    if(N>1&&t.facing){
      const ar=t.kind==='rock'?IRM_RES.AR_ROCK:IRM_RES.AR,rr=1+(ar-1)*Math.min(1,(N-1)/3),s0=Math.max(IRM.SIG_MIN,h.sig*cam.zoom/C),fl=Math.hypot(t.facing[0],t.facing[1])||1;
      irmSplatAniso(cx,cy,pk,s0*Math.sqrt(rr),s0/Math.sqrt(rr),t.facing[0]/fl,t.facing[1]/fl);n++;continue;
    }
    const s=Math.max(IRM.SIG_MIN,h.sig*cam.zoom/C),r=s*Math.sqrt(2*Math.log(pk/IRM.CULL));
    const i0=Math.max(0,Math.floor(cx-r)),i1=Math.min(gw-1,Math.ceil(cx+r)),j0=Math.max(0,Math.floor(cy-r)),j1=Math.min(gh-1,Math.ceil(cy+r));
    if(i0>i1||j0>j1)continue;
    const e=-0.5/(s*s),ex=new Float32Array(i1-i0+1);
    for(let i=i0;i<=i1;i++){const dx=i-cx;ex[i-i0]=Math.exp(dx*dx*e);}
    for(let j=j0;j<=j1;j++){const dy=j-cy,fy=pk*Math.exp(dy*dy*e),row=j*gw;for(let i=i0;i<=i1;i++)irmF[row+i]+=fy*ex[i-i0];}

}
/* 乙:每艘我方船一条 360° 全景条。条上的第 b 格 = 朝方向 b 收到的热:每个热源贡献一个高斯峰(高 = 信噪比,宽 = 引擎角误差) */
function irmProfiles(){
  const obs=irmObservers(),src=irmSources(),B=IRM.BINS,k=B/(2*Math.PI),out=[];
  for(const o of obs){
    const P=new Float32Array(B);
    for(const t of src){
      if(senseBaffled(o,t.pos))continue;   // ENV2 门只用自己尾焰致盲与天体遮挡:乙刻意不看禁区锥,太阳由杂散光画出来
      if(envOccluded(o.pos,t.pos))continue;
      const q=senseOptPair(o,t);if(!(q.snr>=IRM.SNR_MIN))continue;   // ENV2 乙读不打折的 snr / ang
      const c=(q.brg<0?q.brg+2*Math.PI:q.brg)*k,s=Math.max(0.5,q.ang*k),r=Math.min(B/2,Math.ceil(s*Math.sqrt(2*Math.log(q.snr/IRM.SNR_MIN*50)))),e=-0.5/(s*s);
      for(let b=Math.floor(c-r);b<=Math.ceil(c+r);b++){const db=b-c;P[((b%B)+B)%B]+=q.snr*Math.exp(db*db*e);}
    }
    if(envHasLight())for(let b=0;b<B;b++)P[b]+=senseGlareDir(o,b/k);   // ENV2 杂散光每格调引擎(方向按这艘船看光源取;躲在影子里为 0)
    /* 自己点着火:顺着喷口方向、半角 BAF 以内整段刺眼(与甲里"看不见"同一个扇区);边缘 ±1° 软过渡 —— 一刀切在 5 像素的格子上画出来是锯齿 */
    const pl=senseBafDir(o);   // ENV2 致盲方向与半角读引擎(主推瞎船尾、反推瞎船头)
    if(pl){const pb=Math.atan2(pl[1],pl[0]),D2R=Math.PI/180;
      for(let b=0;b<B;b++){let d=b/k-pb;d=Math.abs(Math.atan2(Math.sin(d),Math.cos(d)))/D2R;const w=Math.max(0,Math.min(1,(SENS.BAF_DEG+1-d)/2));if(w>0)P[b]+=IRM.VMAX*w;}}
    out.push({o:o,P:P});
  }
  return out;
}
function irmYiAt(prof,sx,sy){ /* 屏幕点 (sx,sy) 的乙值:各艘船的全景条在"这艘船看这一点的方向"上的读数之和(相邻两格线性插值) */
  const B=IRM.BINS,k=B/(2*Math.PI);let v=0;
  for(const pr of prof){
    const a=toScreen(pr.o.pos[0],pr.o.pos[1]);let th=Math.atan2(sy-a[1],sx-a[0]);if(th<0)th+=2*Math.PI;
    const f=th*k,b0=Math.floor(f)%B,b1=(b0+1)%B,u=f-Math.floor(f);v+=pr.P[b0]*(1-u)+pr.P[b1]*u;
  }
  return v;
}
function irmFieldYi(){
  irmGrid();const C=IRM.CELL,gw=irmGW,gh=irmGH;irmProf=irmProfiles();if(!irmProf.length)return 0;
  for(let j=0;j<gh;j++)for(let i=0;i<gw;i++)irmF[j*gw+i]=irmYiAt(irmProf,i*C,j*C);
  return irmProf.length;
}
/* ---- 尘埃云(业内叫红外卷云 infrared cirrus)—— 用户选了「4 尘埃云」----
   依据:红外天文卫星 IRAS(1983)发现的"红外卷云"—— 星际尘埃被晒热后发的丝状红外辐射;内太阳系的红外背景主要是晒热的黄道尘埃。
   形状:世界坐标里的分形噪声(固定种子,地图的一部分,不随镜头变)。大尺度两层决定哪里有云(约四成面积),
     脊状分形(ridged fBm,1 - |2n - 1| 的平方逐层叠加)拉出丝 —— 这是做丝状结构的标准手法。
   亮度:V x 浓度,有太阳时晒热、没太阳时只有 DARK 那么多(星际尘埃本身很冷)。V、DARK 是暂定的数。
   两个作用:①画出来(甲乙都画 —— 云是地形,和残骸场一样算已知的地图);
            ②衬在云里的目标背景热、对比度低:与逆光同一条背景受限律,甲里的山变矮变宽(irmContrast)。
   ②按固定的物理尺度算(细到 MIN_KM),不随缩放变;①只画屏幕上分得出的那几层(细到两个粗格),拉远拉近不会闪。
   性能:云按 2 x 2 格一个粗格算、双线性铺回;镜头和太阳不变时直接用上一帧的结果。左下角「尘埃云」开关,默认开 */
let irmCloudCache=null;
function irmCloudAdd(){ /* 把云铺进这一帧的场里(甲乙都铺) */
  const CL=ENV.clouds;if(!CL.length)return;
  const gw=irmGW,gh=irmGH,C=IRM.CELL,cw=Math.ceil(gw/2)+1,ch=Math.ceil(gh/2)+1,n=cw*ch,lens='|'+[cam.x,cam.y,cam.zoom,gw,gh].join('|');
  let sig='';for(const c of CL)sig+=[c.x,c.y,c.r,c.seed,c.l0,c.v,c.dark].join(',')+';';
  let K=irmCloudCache;
  if(!K||K.dKey!==sig+lens){   // ENV2 浓度层:键 = 云签名 + 镜头 + 网格尺寸,存每个粗格 envBgParts 的两个和(换光照不重算浓度)
    const G0=new Float32Array(n),G1=new Float32Array(n),minL=4*C/cam.zoom,q2=[0,0];
    for(let j=0;j<ch;j++)for(let i=0;i<cw;i++){const q=j*cw+i;envBgParts(worldAt(i*2*C,j*2*C),'opt',minL,q2);G0[q]=q2[0];G1[q]=q2[1];}
    K=irmCloudCache={dKey:sig+lens,lKey:'',G0:G0,G1:G1,G:new Float32Array(n),cw:cw};
  }
  if(K.lKey!==ENV.rev+lens){   // ENV2 光照层:键 = ENV.rev + 镜头;有光且不在影子里取和0,否则取和1
    const lit=envHasLight();
    for(let j=0;j<ch;j++)for(let i=0;i<cw;i++){const q=j*cw+i;K.G[q]=(lit&&!envInShadow(worldAt(i*2*C,j*2*C)))?K.G0[q]:K.G1[q];}
    K.lKey=ENV.rev+lens;
  }
  const G=K.G;
  for(let j=0;j<gh;j++){const j0=j>>1,fy=(j&1)*0.5,row=j*gw;for(let i=0;i<gw;i++){const i0=i>>1,fx=(i&1)*0.5,q=j0*cw+i0;
    const v=G[q]*(1-fx)*(1-fy)+G[q+1]*fx*(1-fy)+G[q+cw]*(1-fx)*fy+G[q+cw+1]*fx*fy;irmF[row+i]+=v;}}
}
/* ---- 大天体和它的影子 —— 用户选了「5 大天体和它的影子」----
   默认一颗海王星大小(半径 R)的天体,放在我方舰队方位 BRG、距离 D 处,能拖;只在红外图里(引擎不知道它)。
   画面(甲乙都画,地形):朝阳那半边亮 —— 太阳在平面里,俯视时明暗交界线过圆心,越往朝阳的边缘越亮(朗伯);背阴那半边 NIGHT。
     天体挡住它后面的云与热(画在云上面、盖住)。没太阳时整个是背阴那一档。
   影子(本影):方向型太阳 = 顺着太阳方向往后一条等宽的柱;位置型 = 真几何的锥,长 R x 距离 / (太阳半径 - R)。
   影子的三个作用:①影子里的目标晒不到,相位那一项归零(更冷);②影子里的尘埃云只剩 DARK 那点热 —— 影子在云上显成一条暗带,
     没有云的地方影子本身看不见(真空不发光);③躲在影子里的我方船看不到太阳:不刺眼、不致盲、没有杂散光。
   遮挡:天体挡在视线中间就看不见后面的东西(甲乙都算)。左下角「天体」开关,默认开。R / D / NIGHT 是暂定的数 */
function irmBodyAdd(){ /* 把天体画进这一帧的场里(盖住后面的东西) */
  const gw=irmGW,gh=irmGH,C=IRM.CELL,edge=1;
  for(const b of ENV.bodies){   // ENV2 天体读 ENV.bodies:背阴面值读 b.heat,光源方向逐天体取
    const ps=toScreen(b.x,b.y),rc=b.r*cam.zoom/C,u=envSunDirAt([b.x,b.y]);
    const i0=Math.max(0,Math.floor(ps[0]/C-rc-edge)),i1=Math.min(gw-1,Math.ceil(ps[0]/C+rc+edge)),j0=Math.max(0,Math.floor(ps[1]/C-rc-edge)),j1=Math.min(gh-1,Math.ceil(ps[1]/C+rc+edge));
    for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
      const dxc=i-ps[0]/C,dyc=j-ps[1]/C,rr=Math.hypot(dxc,dyc),w=Math.max(0,Math.min(1,(rc-rr)/edge+0.5));if(w<=0)continue;   /* 边缘一格软过渡 */
      let v=b.heat;if(u&&rc>0){const c=(dxc*u[0]+dyc*u[1])/rc;if(c>0)v=Math.max(v,IRM.VMAX*c);}
      const q=j*gw+i;irmF[q]=irmF[q]*(1-w)+v*w;
    }
  }
}
function irmStarAdd(){ // ENV2 甲:位置型恒星的亮斑 + 光晕逐格;乙直接返回(杂散光由 irmProfiles 按观测船画)
  if(IRM.mode==='yi'||!ENV.stars.length)return;
  const S=ENV.stars[0],gw=irmGW,gh=irmGH,C=IRM.CELL,p=toScreen(S.x,S.y),kz=1/(cam.zoom);
  for(let j=0;j<gh;j++){const dy=(j*C-p[1])*kz,row=j*gw;for(let i=0;i<gw;i++){const dx=(i*C-p[0])*kz;irmF[row+i]+=irmHalo(Math.hypot(dx,dy));}}
}
function irmFieldAdd(){ // ENV2 残骸场内一层均匀背景 BG_G0·(1/OPT_K² - 1) = 15:与引擎的亮度 x OPT_K 在背景受限律下等价(审查一第 18 条)
  const F=ENV.fields;if(!F.length)return;
  const bg=SENS.BG_G0*(1/(ENV_CFG.OPT_K*ENV_CFG.OPT_K)-1),gw=irmGW,gh=irmGH,C=IRM.CELL;
  for(const f of F){const p=toScreen(f.x,f.y),rc=f.r*cam.zoom/C,cx=p[0]/C,cy=p[1]/C;
    const i0=Math.max(0,Math.floor(cx-rc-1)),i1=Math.min(gw-1,Math.ceil(cx+rc+1)),j0=Math.max(0,Math.floor(cy-rc-1)),j1=Math.min(gh-1,Math.ceil(cy+rc+1));
    for(let j=j0;j<=j1;j++){const dy=j-cy,row=j*gw;for(let i=i0;i<=i1;i++){const dx=i-cx,w=Math.max(0,Math.min(1,rc-Math.sqrt(dx*dx+dy*dy)+0.5));if(w>0)irmF[row+i]+=bg*w;}}}   // ENV2 边缘一格软过渡(同天体圆盘)
}
ENV_VIEWS.ir={order:['star','field','cloud','body'],slot:'grid',kinds:{  // ENV2 光晕与场底先铺、云再叠、天体最后盖住

  sun:null}};    // ENV2 不画:方向型太阳没有位置;乙的杂散光在 irmProfiles 里
/* ---- ENV2 3b 新管线(perf 第 1~2 步):内容签名整帧缓存 + 门槛表上色 + 两池噪声 ---- */
const IRV={sig:[],cur:[],nbig:new Set(),sil:[],F:null,gw:0,gh:0,C:0,wh:'',cc:null,cv:null,img:null,u32:null,ep:NaN,

IRV.u1=new Uint32Array(IRV.f1.buffer);
function irvSig(a){ // ENV2 §2.2 内容签名:整帧画面依赖的一组数,逐项和上一帧比、不量化;配置对象运行期逐键枚举(以后加的键自动进来)

  const obs=irmObservers(),src=irmSources();a.push(obs.length,src.length);
  for(const o of obs){const f=o.flame>0?1:(o.flame<0?-1:0),fc=f!==0&&!!o.facing;a.push(o.pos[0],o.pos[1],o.pos[2]||0,f,!!o.dead,fc);if(fc)a.push(o.facing[0],o.facing[1]);}   // ENV2 观测船点着火时尾焰盲区要朝向

    a.push(t.pos[0],t.pos[1],t.pos[2]||0,f,!!t.sideFlame,t.emitMode,firePowerOf(t)>0,t.size,t.cls,t.tier,t.kind,!!t.dead,t.heatK,fc);if(fc)a.push(t.facing[0],t.facing[1]);}

}
function irvSigNe(a,b){if(a.length!==b.length)return true;for(let i=0;i<a.length;i++){const x=a[i],y=b[i];if(x!==y&&(x===x||y===y))return true;}return false;}   // ENV2 NaN 对 NaN 算相同
function irvColInit(){ // ENV2 algo ①:TH[k] = 使 irmIdx >= k 的最小 v(对 irmIdx 本身二分到相邻双精度);初猜表按 float32 高 16 位,指数全 1 的桶记 256(当场调 irmIdx)
