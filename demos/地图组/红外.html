<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图组 · 红外</title>
<link rel="stylesheet" href="../../css/app.css?v=20260923">
<style>
/* 地图组 · 红外:左下角的开关。几何与"开"态照抄右下角 #tools 的工具钮(css/app.css),颜色一律走设计变量 */
#irDock{position:absolute;left:var(--gut);bottom:56px;z-index:var(--z-hud);display:flex;align-items:center;gap:6px}
#irMode,#irSun,#irGlare,#irEnv{display:inline-flex}
#irMode .hbtn,#irSun .hbtn,#irGlare .hbtn,#irEnv .hbtn{border-radius:0;margin-left:-1px}
#irMode .hbtn:first-child,#irSun .hbtn:first-child,#irGlare .hbtn:first-child,#irEnv .hbtn:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);margin-left:0}
#irMode .hbtn:last-child,#irSun .hbtn:last-child,#irGlare .hbtn:last-child,#irEnv .hbtn:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
#irDock .hbtn.on{color:var(--acc);border-color:var(--acc);position:relative;z-index:1}
#irSelftest{position:fixed;left:8px;top:60px;z-index:var(--z-transient);white-space:pre-wrap;padding:8px;background:var(--srf-panel);color:var(--txt);font:12px var(--ff-mono,monospace)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<!-- UI2:两个工具钮是图标钮(行内 SVG,颜色全走 css token),文字收进 title / aria-label。
     SN6 右下角工具钮。钮的行为走 render/85-settings 的事件委托。 -->
<div id="tools">
  <div class="seg" id="segTier" title="三级星图:星图自己的比例尺阶梯 —— 画面短边横跨 战术 2 / 舰队 15 / 战区 45 光秒"><button class="hbtn" data-tier="1">战术</button><button class="hbtn" data-tier="2">舰队</button><button class="hbtn" data-tier="3">战区</button></div><!-- SN6b 从顶栏搬到这儿(用户拍板"三按钮放在右下角,大小和形状参考态势感知V3")。id 未变 ⇒ render/85-settings 的委托与 80-viewtier 里写高亮的那行都不用改 -->
  <div class="seg" id="segTool"><button class="hbtn" data-tool="geom" title="缩圈:地图右上角弹出【定位几何】小窗——我方全体观测合起来,对方那艘船的误差椭圆现在有多大、离导弹门/主炮门还差多少。悬停敌方目标临时看;左键点敌方目标常驻;点我方舰看它正在打(或正在等)的那个目标" aria-label="缩圈"><svg class="tl-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="i-ship" d="M17.6 12.9 8 6.4 11 12.3 8.4 17.9Z"/><ellipse class="i-ell" cx="12" cy="12" rx="10.8" ry="5.4" transform="rotate(-13 12 12)"/><path class="i-los" d="M0 14.8 24 9.2"/></svg></button><button class="hbtn" data-tool="sig" title="信号视野:画出我方每艘舰的【被探测范围】——光学/红外恒有;开了雷达才有被听见的那一圈。半径直接读感知层的量程律,与判据同一个数" aria-label="信号视野"><svg class="tl-ico" viewBox="0 0 24 24" aria-hidden="true"><circle class="i-r3" cx="12" cy="12.6" r="11.4"/><circle class="i-r2" cx="12" cy="12.6" r="8.2"/><circle class="i-r1" cx="12" cy="12.6" r="5"/><path class="i-ship" d="M12 5.4 15.9 18 12 14.8 8.1 18Z"/></svg></button></div>
</div>
<!-- SN7 定位几何小窗:叠在地图右上角、紧贴右轨左侧(照 demos/sensors/态势感知V3.html 的 #pPhase)。自己的小 canvas,不进主画布;
     开关是右下角 #tools 的「缩圈」钮(render/85-settings 的委托)。 -->
<div id="geomPane" class="panel" hidden><canvas id="geomCv"></canvas><div class="gp-tag">定位几何<b>GEOMETRY</b></div><div class="gp-hint" id="geomHint"></div></div>
<!-- MT1 对局结果卡片:只在对局分出胜负时由 scenario/97-match 的 matchTick 显示。 -->
<div id="matchEnd" class="panel" hidden><div class="me-title" id="meTitle">胜利</div><div class="me-sub" id="meSub"></div><div class="me-stat" id="meStat"></div><div class="me-btns"><button class="btn" id="meAgain">再来一局</button><button class="btn" id="meRange">回靶场</button></div></div>
<div id="mapTag">战术层<b>TACTICAL</b></div><!-- SN6 当前层的读数,只在【换层那一刻】写(render/80-viewtier 的 vtFrame) -->

<!-- 地图组 · 红外:左下角的红外开关 + 两种投法(甲 位置 / 乙 方向)。逻辑在本页最后那段脚本里 -->
<div id="irDock"><button class="hbtn" id="irBtn" title="红外图(热像):整屏一层底红,有热源的地方与背景不平衡、颜色偏离底红 —— 越强偏得越多(暗红 → 橙 → 黄 → 近白)。色标固定:同样的热永远是同样的颜色。带一点传感器噪声:很弱的热会淹在颗粒里。点火、开火、开雷达的船会更偏">红外</button><div id="irMode"><button class="hbtn" data-irm="jia" title="甲 位置:热源在它所在的位置偏色。近处小而亮,远处大而淡(越远越糊)">甲 位置</button><button class="hbtn" data-irm="yi" title="乙 方向:我方每艘船朝热源的那一片扇区整体偏暖,沿着这个方向远近都一样(红外量不到距离);几艘船的扇区交叠处更偏">乙 方向</button></div><div id="irSun"><button class="hbtn" data-sun="none" title="没有太阳">无太阳</button><button class="hbtn" data-sun="dir" title="太阳·方向:太阳在无穷远的方位 150°(与碎石带那颗同方位),写进引擎,引擎的探测也照它致盲(禁区半角 30°;碎石带那颗是 10°,不受影响)。乙:朝太阳那片扇区刺眼;甲:看不到太阳本身,但禁区里的热源被晃掉">太阳·方向</button><button class="hbtn" data-sun="pos" title="太阳·位置:在地图上放一颗有位置的恒星,真太阳大小(半径 69.6 万公里),默认 690 万公里外(约帕克太阳探测器最近点),能拖。只在红外图里,引擎不知道它。甲:刺眼的亮斑加散射光晕;乙:朝它那片扇区刺眼">太阳·位置</button></div><div id="irGlare"><button class="hbtn" data-gl="p4" title="杂散光·四次方:禁区外按角度的四次方衰减(偏开 90° 还有发现线的十几倍);恒星的光晕按距离的三次方淡出">光·四次方</button><button class="hbtn" data-gl="mid" title="杂散光·中(默认):介于四次方与陡之间,偏四次方 —— 偏开 45° / 60° / 90° 分别约是发现线的 157 / 37 / 3.8 倍">光·中</button><button class="hbtn" data-gl="steep" title="杂散光·陡(按真实光学):禁区边缘外每多偏 10° 降到十分之一;恒星的光晕每远一个太阳半径降到十分之一">光·陡</button></div><div id="irEnv"><button class="hbtn" data-env="cloud" title="尘埃云(红外卷云):地图上的丝状暖色结构,有太阳时被晒热、更亮。衬在云里的目标背景热、对比度低,更难看清">尘埃云</button><button class="hbtn" data-env="planet" title="天体:一颗海王星大小的天体(能拖)。朝阳那半边亮;身后拖一条影子,影子里晒不到太阳、更冷,躲在里面也不被太阳晃;它挡在中间就看不见后面">天体</button></div></div>

<div id="hud" class="panel">
  <div class="logo">SPACE POWER<span> · 骨架</span></div>
  <div id="clock">00:00</div>
  <div id="rate">x1</div>
  <button class="hbtn" id="btnPause" title="暂停/继续(空格)">⏸</button>
  <button class="hbtn" id="btnSlow" title="减速(-)">−</button>
  <button class="hbtn" id="btnFast" title="加速(+)">+</button>
  <div class="spacer"></div>
  <button class="hbtn" id="btnMatch" title="进入对局">对局</button>
  <button class="hbtn" id="btnRocks" title="进入碎石带对局">碎石带</button><!-- ENV1 带环境的对局(太阳禁区 + 残骸场);入口逻辑在 scenario/97-match --><!-- MT1 对局入口(scenario/97-match);进了对局它变成「回靶场」 -->
  <button class="hbtn" id="btnTut" title="教程 · 指挥官手册(Esc 关闭)">教程</button><!-- RF5-D 排在 .spacer 之后 = 顶栏右端。SL1(2026-09-22 瘦身):原来跟在它后面被藏着的七个旧钮(录制/GM/互搏/靶场参数/场景菜单/回放/设置)已整套删除;GM 仍走 F8 -->
</div>

<!-- FM1 编队书签栏(左轨顶部,常驻)。这是编队的唯一可见入口。
     刻意不给 class="panel":.panel 带 overflow:hidden + 边框背景,会把一叠独立小条圈成一块面板。内容由 render/87-fmbar.js 填。 -->
<div id="fmBar"></div>
<!-- FM7 测试用「加船」小条:挂在左轨书签栏下方。靶场只有 3 艘蓝舰,凑不出两支编队,阵型没法手试。
     内容由 scenario/96-spawn.js 建。 -->
<div id="spawnBar"></div>
<!-- FM1 编队菜单(点书签展开)。.p-title / #fmActs 两个容器必须是【静态元素】(信息区 #selFm 已搬到右轨 #selPanel 里)——
     事件全部委托到它们身上,而 on() 遇元素不存在只会静默跳过,动态创建的容器挂不上委托。
     默认 display:none,由 updFmBar() 写回 'flex'(不是 '')。 -->
<div id="fmMenu" class="panel" style="display:none">
  <div class="p-title"><b id="fmTitle">编队</b><span class="hint" id="fmHint">—</span></div>
  <div id="fmActs"></div>
</div>

<!-- RF2 简化UI:选中舰实时信息面板(右轨)。SL1(2026-09-22 瘦身):旧舰队卡面板 / 事件面板 / 右轨底部的事件流面板已整套删除,右轨只剩这一块 -->
<div id="selPanel" class="panel">
  <div class="p-title"><b id="selTitle">未选中</b><span class="hint">左键点选 · 拖拽框选</span></div>
  <div id="selInfo"></div>
  <!-- FL1 编队信息区:原 #fmMenu 里的 #fmInfo,整块搬到右轨。理由是"左边只放操作、右边只放实时数据"。
       必须是【静态元素】:87-fmbar 的事件委托挂在它身上,而 on() 遇元素不存在只会静默跳过。
       显隐由 88-selpanel 的 updateSelPanel 独占(选中的恰好是一支编队才显示),87-fmbar 只管往里写内容。 -->
  <div id="selFm" style="display:none"></div>
  <div id="fcSec"><!-- RF5 火控计算机:序列/目标解算列表。#fcList 必须是静态元素——on() 遇元素不存在会静默跳过,动态创建挂不上委托 -->
    <div class="fc-hd">火控计算机<span class="fc-btn" id="fcPickBtn" title="把当前序列态那条设为唯一开火序列;再按一次回到轮询">选择</span></div><!-- RF8b 舰级"选择"钮:刻意【不进 #fcList】——那里每 20 帧重渲一次,且委托要求带 data-seq(舰级动作没有),上一版的大序列钮正是栽在这条上 -->
    <div id="fcList"></div>
  </div>
</div>

<!-- RANGE1 靶场参数面板:左上角,UI1 左轨车道统一定位。SL1:顶栏那个开关钮已删,面板逻辑(scenario/95-range)保留,css 里仍按 RF2 的老样子藏着 -->
<div id="trPanel" class="panel" style="display:none"><!-- UI1 原来这里写死 max-height:calc(100% - 316px),把旋钮区压成 8px;现由 --rail-top/--dock-b 派生 -->
  <div class="p-title"><b>🎯 靶场参数</b><span class="hint">逐靶可调</span></div>
  <div class="tr-tabs" id="trTabs"></div>
  <div class="tr-body" id="trBody"></div>
  <div class="tr-read" id="trRead"></div>
  <div class="tr-btns">
    <button class="ed-btn" id="trSyncBtn" title="打开后改任一旋钮同时作用于三个靶">同步全靶:关</button>
    <button class="ed-btn" id="trReset" title="伤害/命中/防御链读数全部归零并重新计时">归零统计</button>
    <button class="ed-btn danger" id="trClose">✕ 关闭</button>
  </div>
</div>

<!-- RF3 简化UI:底部操作栏三区 = 舰名区 | 规格读数列(标签上/数值下) | 开关组(88-selpanel 按 s.weapons 配装动态生成) -->
<div id="cmdBar" class="panel">
  <div class="cmd-ship"><b id="ciName">—</b><span id="ciCls">—</span></div>
  <div class="cmd-sep"></div>
  <div id="ciSpec"></div>
  <div class="cmd-sep"></div>
  <div class="cmd-btns"></div>
</div>
<div id="cmdTip"></div>
<!-- RF5-D 教程模态(顶栏 #btnTut 唤出)。内容由 render/85-tutorial.js 惰性写进 #tutBody(打开过一次才存在),
     所以常规画面下这里是三个空壳,零元素泄漏。SL1:旧设置面板的遮罩已删,这是顶栏唯一的模态。 -->
<div id="tutOverlay">
  <div id="tutPanel">
    <div class="tut-hd">
      <h2>指挥官手册</h2>
      <span class="tut-hd-hint">Esc / 点遮罩 关闭 · 打开期间模拟暂停</span>
      <button class="hbtn" id="tutCloseBtn" title="关闭教程(Esc)">✕</button>
    </div>
    <div class="tut-body" id="tutBody"></div>
  </div>
</div>

<!-- FM4 舰队编组控制页(编队菜单的「编组控制」钮唤出)。几何抄 #tutOverlay:外层 flex 居中 + 卡片定高 + 内层独立滚动。
     内容由 render/89-fmpage.js 的 fmPageRender() 写进 #fpBody,
     常规画面下这里是三个空壳。委托挂在 #fmPage / #fpClose 两个静态元素上,所以内容随便重渲都挂得住。 -->
<div id="fmPage">
  <div id="fmPagePanel">
    <div class="fp-hd">
      <h2>舰队编组控制</h2>
      <span class="fp-hd-hint" id="fpHint">—</span>
      <button class="hbtn" id="fpClose" title="关闭(Esc)">✕</button>
    </div>
    <div class="fp-body" id="fpBody"></div>
  </div>
</div>

<div id="xhTip"></div><!-- RF5 悬停敌舰信息卡:跟随光标,内容按 litBlue 接触等级分档(command/74-targeting 写 innerHTML)。刻意不给 class="panel":.panel 带 z-index:var(--z-panel) 与 overflow:hidden,会把层级压回面板档还裁掉内容,几何一律自带(抄 #cmdTip) -->

     故 scenario/95 必须在它之前)。其余跨文件引用全在运行期解析,层序排列只为可读性。 -->
<script src="../../js/core/00-config.js?v=20260923"></script>
<script src="../../js/core/01-state.js?v=20260923"></script>
<script src="../../js/ships/10-hull-geometry.js?v=20260923"></script>
<script src="../../js/ships/11-classes.js?v=20260923"></script>

<script src="../../js/bots/60-doctrine.js?v=20260923"></script>
<script src="../../js/bots/61-enemy.js?v=20260923"></script>

<!-- ================= 地图组 · 红外(demos/地图组/红外.html)=================
     这一页是仓库根 index.html 的一份拷贝(2026-09-23 生成):DOM 与脚本一样,路径改成 ../../,再在最后加一段红外图脚本。
     引擎的脚本一个字没改,舰船 / 鼠标键盘 / 加船小条都是引擎自己的。⚠ 主页面以后改了 DOM,这里不会跟着变 —— 要重新拷一份。 -->
<script>
"use strict";
/* ================= 地图组 · 红外(2026-09-23)=================
   用户:「左下角做一个专门的红外雷达按钮,能看到观测范围内的热源分布,越近的分辨率越高,没有一个截断式的边界」
         「里面可以加入舰船,操作方式和主引擎一致」「热区这个设计不要了」
         「能不能做一套类似于热力图的东西,开红外之后,有一个底层的红色,但是能感知到的地方,比如舰船,
           在这个方位就会出现一种热量不平衡,从而出现颜色偏差」「甲乙都试试,"引擎判为发现"的那条线不画,先固定」
   画法 = 热像:整屏一层底红(没有东西时的背景热),有热源的地方与背景"不平衡",颜色偏离底红 —— 越强偏得越多(暗红 → 橙 → 黄 → 近白)。
   业内对应:热成像的温差对比显示(ΔT)+ 伪彩色调色板(类似 ironbow);在均匀背景上找偏离叫异常检测(RX 检测器,Reed & Xiaoli 1990)。
   完整形态里还有传感器噪声底(NETD)与自动增益(AGC),这一版都没有:色标固定(用户拍板"先固定"),同样的热永远是同样的颜色。
   两种投法(用户:"甲乙都试试"):
     甲 位置:每个热源在它所在的位置堆一座山(体积 = 收到的热量,宽度 = 距离 x 引擎角误差,体积守恒 ⇒ 越远越矮越宽),全部叠成一张场
     乙 方向:每艘我方船先做一条 360° 的红外全景(方向上的热分布:朝热源的方向有一个峰,高 = 收到的热量,宽 = 引擎角误差),
            再投到地图上 —— 朝热源那一片扇区整体偏暖,沿着这个方向远近都一样(红外量不到距离);几艘船的扇区交叠处叠加。
            用全景条来做,计算量不随热源个数增长
   场的单位:1 = 一艘熄火静默的驱逐舰恰在引擎发现距离上的读数(甲是峰高,乙是信噪比)。那条线不画(用户拍板),只决定色标的刻度。
   这一页只加一层画面,引擎一个字不改:页面原样加载引擎的全部脚本;红外图挂在引擎接触层(drawContacts)之后画、舰标之下;
   热区不画(把引擎的 heatBuild 换成恒返回 0,主游戏里热区还在)。观测者 = 我方全部存活的船;热源 = 不是我方的一切(红舰、石头、小行星)。
   旧的接触模型(1/2/3 级、误差椭圆、缩圈)也不上这一页:非我方的东西普通视角下只在红外图上出现,F8 看真值(见下面那一节,主游戏里都还在)。
   用户:「现在请加入一点点本地噪声,小行星,太阳。然后这里的舰船啥的我可以直接的拖动,蓝方红方的都可以」(太阳怎么做等用户选,这一版没有)
     · 噪声 = 传感器噪声底(业内叫 NETD,噪声等效温差):加在【场值】上而不是颜色上 —— 很弱的热淹在颗粒里,强的不受影响;每 0.2 秒换一次颗粒,
       用本页自己的种子随机流(不碰全局 Math.random:引擎的交战从全局流取数)。色标两头对称:噪声往下时比底红略暗
     · 小行星 = 引擎自己的石头对象(makeRock,kind 'rock'),体型 1~3(碎石是 0.35~1.1),每一局在我方舰队周围撒 10 颗(固定种子)
     · 拖动:左键按在一个东西上(蓝舰、红舰、石头 / 小行星,按真实位置判,12 像素内最近的)再拖超过 4 像素 ⇒ 搬到鼠标下、速度清零;
       只点不拖时什么都不拦,引擎照常选中。没被发现的红舰地图上看不见但照样抓得住(F8 打开引擎的上帝视角能看见)
   用户:「(太阳)都试试」—— 左下角一个三档开关:无太阳 / 太阳·方向 / 太阳·位置
     · 方向型 = 写进引擎自己的太阳(ENV.sun,方位 150° 与碎石带那颗相同;禁区半角 30°,碎石带是 10°——用户:「方向型加宽」):引擎的探测照它致盲,屏幕边上的日标是引擎画的。
       乙:每艘船朝太阳那一片扇区刺眼 —— 禁区边缘恰好到色标顶,往外按角度的四次方衰减(杂散光);甲:看不到太阳本身(它没有位置),
       但一个热源若对某艘我方船落在禁区里,那艘船就看不见它;全被晃瞎就画不出来
     · 位置型 = 只存在于红外图里的一颗恒星(引擎不知道它),默认在我方舰队 690 万公里外、方位 150°,能拖。
       甲:一团刺眼的亮斑 + 散射光晕(真太阳半径 69.6 万公里内饱和,往外按距离三次方淡出——用户:「位置型放大」);乙:每艘船朝它那一片扇区刺眼(同一条杂散光律)
   用户:「面向太阳和背对太阳我觉得红外识别是不一致的」—— 有太阳时两头都跟太阳的几何走(见 irmLumK / irmContrast 两节):
     目标这一头按相位角变热(背对太阳看看到晒热的面);观测这一头面向太阳看时背景被杂散光抬亮、甲里的山又矮又宽 */
const IRM={on:false,mode:'jia',
  CELL:5,                  /* 底图一格 = 多少屏幕像素 */
  V0:0.02,VMAX:1000,       /* 固定色标:t = ln(1 + v/V0) / ln(1 + VMAX/V0);v = 0 是纯底红,v = 1000 顶到近白 */
  CULL:0.0003,             /* 甲:每座山贴到低于它为止 —— 必须低到色标上连一格都显不出(t 舍入到 0 要 v < 0.00043)。
                              第一版取 0.002,色标在那里已有一格偏色,很弱的山被截出一圈看得见的台阶;按行列分开贴时范围是方的,于是出现淡淡的方块 */
  SIG_MIN:0.7,             /* 甲:山的最小宽度(格) */
  BINS:1440,               /* 乙:360° 全景条分多少格(0.25°) */
  SNR_MIN:0.0003,          /* 乙:信噪比低于它的热源不进全景条(同上,低到色标上显不出,热源越过它时不会"冒出来") */
  NOISE:0.005,NOISE_MS:200 /* 传感器噪声:每格加一个标准差 = 0.005(场的单位,1 = 发现线)的高斯颗粒,每 0.2 秒换一次。
                              0.01 截图看是满屏明显的颗粒、0.004 要凑近才看得出,取中间;对数色标在零附近放大弱信号,所以这个数看着小 */
};
/* 色带:t = 0 是底红,往上偏暖;往下(只有噪声会把它压到负的)比底红略暗。RGBA,A 按 0~255(整屏都铺,底色本身带透明度,星空与网格隐约可见) */
const IRM_T0=-0.1;
const IRM_RAMP=[[IRM_T0,[40,6,6,140]],[0,[70,12,12,150]],[0.25,[150,30,20,170]],[0.5,[220,80,30,190]],[0.75,[255,170,60,210]],[1,[255,245,210,230]]];
const IRM_LUT=(function(){const L=new Uint8ClampedArray(256*4);for(let k=0;k<256;k++){const t=IRM_T0+k/255*(1-IRM_T0);let a=0;while(a<IRM_RAMP.length-2&&t>IRM_RAMP[a+1][0])a++;
  const p=IRM_RAMP[a],q=IRM_RAMP[a+1],u=Math.max(0,Math.min(1,(t-p[0])/(q[0]-p[0])));for(let c=0;c<4;c++)L[k*4+c]=Math.round(p[1][c]+(q[1][c]-p[1][c])*u);}return L;})();
function irmT(v){ /* 两头对称的对数色标:t = sign(v) x ln(1 + |v|/V0) / ln(1 + VMAX/V0),钳在 [T0, 1] */
  if(!(v!==0)||!isFinite(v))return 0;
  const t=Math.sign(v)*Math.log(1+Math.abs(v)/IRM.V0)/Math.log(1+IRM.VMAX/IRM.V0);return t>1?1:(t<IRM_T0?IRM_T0:t);}
function irmIdx(v){return Math.round((irmT(v)-IRM_T0)/(1-IRM_T0)*255);}
let irmRef=null;
function irmRefGet(){ /* 刻度的参照:一艘熄火静默的 DD,在引擎给它的发现距离上的模糊宽度 */
  if(irmRef)return irmRef;
  const t={kind:'ship',size:shipStats('DD',2).size,flame:0,sideFlame:0,emitMode:'silent',fireHot:0,pos:null};
  const R=visRangeOf(t);irmRef={R:R,sig:R*covTheta('opt',null,t,R)};return irmRef;
}
function irmObservers(){return ships.filter(s=>s.side==='blue'&&!s.dead);}
function irmSources(){return ships.filter(s=>s.side!=='blue'&&!s.dead).concat((typeof rocks!=='undefined'?rocks:[]).filter(r=>!r.dead));}
/* ---- 目标有多热:自身的热 + 太阳晒的热 x 相位函数 ----
   用户:「面向太阳和背对太阳我觉得红外识别是不一致的,现在感觉没有区别?」→ 拍板「A + B 都做」。这里是 A(目标这一头),B 在 irmContrast。
   业内对应:相位角 α = 太阳-目标-观测者的夹角(行星测光的标准量);亮度随 α 的曲线叫相位曲线。
     相位函数取朗伯球 Φ(α) = (sin α + (π - α) cos α) / π:背对太阳看(太阳在观测者身后,α = 0)看到整个晒热的面,Φ = 1;
     面向太阳看(α = 180°)看到的是背阴面,Φ = 0;侧着看 Φ = 1/π。热红外的标准模型是 NEATM(Harris 1998),热集中在朝阳面,形状与此相近
   自身的热:船照引擎那套(体型 x (1 + 引擎档 + 发射档 + 开火档),一个字不改);
            石头 = 同体型熄火冷船的 DARK 倍(用户:「石头比同体型的船冷一点」「没太阳时也有一点热」)
   晒的热 = SOLAR x 体型 x Φ(α):SOLAR = 1 ⇒ 熄火的冷船被晒的那面亮一倍;开着主推的船本来就是 4 倍,只多亮 25%。
     石头与船晒的一样多,于是同一个角度下石头始终比同体型的船冷。SOLAR 是暂定的数。
     方向型:太阳方向处处一样;位置型:每个目标按自己看恒星的方向。不看离恒星多远(与先前石头的系数同一个口径)
   残骸场里的目标衬在被照亮的碎石前(envOptK),晒的热也跟着乘,与引擎的光学亮度同一个口径。
   引擎里的亮度不变(主游戏不受影响),这里只改红外图:按"亮度乘 k"整套改 —— 收到的热 x k,角误差 / √k
   (引擎的光学角误差与亮度的平方根成反比,见 23-cov 的 visAccOf),于是它在红外图上与一件亮度 k 倍的东西完全一样 */
const IRM_ROCK={DARK:0.5};
const IRM_SOLAR={S:1,G0:1};
function irmSunDirAt(p){ /* 从 p 指向太阳的单位向量(平面);没有太阳给 null */
  if(IRM_SUN.mode==='dir'){const a=IRM_SUN.BRG*Math.PI/180;return [Math.cos(a),Math.sin(a)];}
  if(IRM_SUN.mode==='pos'&&irmStar){const dx=irmStar.pos[0]-p[0],dy=irmStar.pos[1]-p[1],l=Math.hypot(dx,dy)||1;return [dx/l,dy/l];}
  return null;
}
function irmPhase(o,t){ /* 朗伯球相位函数 Φ(α);没有太阳、或者目标在天体的影子里,给 0 */
  const u=irmSunDirAt(t.pos);if(!u||irmInShadow(t.pos))return 0;
  const dx=o.pos[0]-t.pos[0],dy=o.pos[1]-t.pos[1],l=Math.hypot(dx,dy)||1,c=Math.max(-1,Math.min(1,(dx*u[0]+dy*u[1])/l)),a=Math.acos(c);
  return (Math.sin(a)+(Math.PI-a)*c)/Math.PI;
}
/* ---- 引擎尾焰(业内叫羽流 plume)与自己的尾焰致盲后方(声呐里叫艉部盲区 baffles)----
   用户选了「1 引擎尾焰」「8 尾焰致盲后方」。
   尾焰的热 = 体型 x 引擎档(引擎那套:主推 3、反推 8;侧推没有固定朝向,不算尾焰)。喷口方向:主推朝船尾,反推朝船头。
   视角(业内叫 aspect):从喷口正后方看整条尾焰都在,1;侧看 (1 + NOSE) / 2;正对船头看被船体挡住,只剩 NOSE。
     依据:预警卫星靠火箭尾焰发现导弹发射;红外导引头分"只能追尾"与"全向"两种,说的就是这件事。NOSE 是暂定的数。
   引擎里引擎档不分视角(主游戏不变);这里只改红外图:船体那部分照旧,尾焰那部分乘视角。
   甲里还画一条尾巴:从船往喷口方向拖出去,长 TAIL_K 个山宽 —— 真实的尾焰比地图上一个像素还小,这是示意(和舰标放大画同一个道理);
     尾焰那份热从船身那座山里分出来,放进这条尾巴(体积守恒:总热不变,只是摊开)。乙没有位置,只有亮度随视角变。
   致盲后方:自己点着火时,顺着自己喷口方向看出去、半角 BAF 以内的扇区被自己的尾焰晃瞎 —— 甲里那艘船看不见扇区里的东西,
     乙里那艘船的全景条在扇区里整段刺眼。主推瞎后方,反推(刹车)瞎前方。潜艇要转一下"清盲区"(Crazy Ivan),这里一样。BAF 是暂定的数 */
const IRM_PLUME={NOSE:0.1,TAIL_K:4,BAF:30};
function irmPlumeOf(s){ /* 尾焰:喷口方向(单位向量)与热;没点主推 / 反推给 null */
  if(!s||s.kind==='rock'||!s.flame||!s.facing)return null;
  const e=engPowerOf(s);if(!(e>0))return null;
  const k=s.flame>0?-1:1,l=Math.hypot(s.facing[0],s.facing[1])||1;
  return {ux:k*s.facing[0]/l,uy:k*s.facing[1]/l,lum:s.size*e*envOptK(s.pos)};
}

/* 乙:每艘我方船一条 360° 全景条。条上的第 b 格 = 朝方向 b 收到的热:每个热源贡献一个高斯峰(高 = 信噪比,宽 = 引擎角误差) */

  if(typeof makeRock!=='function'||typeof envRng!=='function')return 0;
  const bl=ships.filter(s=>s.side==='blue'&&!s.dead);if(!bl.length)return 0;
  let cx=0,cy=0;for(const s of bl){cx+=s.pos[0]/bl.length;cy+=s.pos[1]/bl.length;}
  const r=envRng(IRM_AST.SEED);let n=0,guard=0;
  while(n<IRM_AST.N&&guard++<200){
    const x=cx+(r()*2-1)*IRM_AST.R,y=cy+(r()*2-1)*IRM_AST.R,sz=IRM_AST.SMIN+r()*(IRM_AST.SMAX-IRM_AST.SMIN),fa=r()*2*Math.PI;
    if(bl.some(s=>Math.hypot(s.pos[0]-x,s.pos[1]-y)<IRM_AST.CLEAR))continue;   /* 不压在我方船身上 */
    const k=makeRock([x,y,0],sz,[Math.cos(fa),Math.sin(fa),0]);k.name='小行星';k.asteroid=true;rocks.push(k);n++;

let irmDrag=null;

  if(!best&&irmPlanet){const p=toScreen(irmPlanet.pos[0],irmPlanet.pos[1]);if(Math.hypot(p[0]-sx,p[1]-sy)<Math.max(12,IRM_PLANET.R*cam.zoom))best=irmPlanet;}   /* 天体:按在圆盘上就抓得住 */

/* 左下角的开关 */

  document.getElementById('irMode').style.opacity=IRM.on?'1':'.45';
  for(const x of document.querySelectorAll('#irSun [data-sun]'))x.classList.toggle('on',x.getAttribute('data-sun')===IRM_SUN.mode);
  for(const x of document.querySelectorAll('#irGlare [data-gl]'))x.classList.toggle('on',x.getAttribute('data-gl')===IRM_SUN.FALL);
  document.getElementById('irGlare').style.opacity=IRM_SUN.mode!=='none'?'1':'.45';

  const pe=document.querySelector('#irEnv [data-env="planet"]');if(pe)pe.classList.toggle('on',IRM_PLANET.on);
