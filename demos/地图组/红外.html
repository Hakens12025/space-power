<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图组 · 红外</title>
<link rel="stylesheet" href="../../css/app.css?v=20260923">
<style>
/* 地图组 · 红外:左下角的开关。几何与"开"态照抄右下角 #tools 的工具钮(css/app.css),颜色一律走设计变量 */
#irDock{position:absolute;left:var(--gut);bottom:56px;z-index:var(--z-hud);display:flex;align-items:center;gap:6px}
#irDock .hbtn.on{color:var(--acc);border-color:var(--acc)}
#irSelftest{position:fixed;left:8px;top:60px;z-index:var(--z-transient);white-space:pre-wrap;padding:8px;background:var(--srf-panel);color:var(--txt);font:12px var(--ff-mono,monospace)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<!-- UI2:两个工具钮是图标钮(行内 SVG,颜色全走 css token),文字收进 title / aria-label。
     SN6 右下角工具钮。钮的行为走 render/85-settings 的事件委托。 -->
<div id="tools">
  <div class="seg" id="segTier" title="三级星图:星图自己的比例尺阶梯 —— 画面短边横跨 战术 2 / 舰队 15 / 战区 45 光秒"><button class="hbtn" data-tier="1">战术</button><button class="hbtn" data-tier="2">舰队</button><button class="hbtn" data-tier="3">战区</button></div><!-- SN6b 从顶栏搬到这儿(用户拍板"三按钮放在右下角,大小和形状参考态势感知V3")。id 未变 ⇒ render/85-settings 的委托与 80-viewtier 里写高亮的那行都不用改 -->
  <div class="seg" id="segTool"><button class="hbtn" data-tool="geom" title="缩圈:地图右上角弹出【定位几何】小窗——我方全体观测合起来,对方那艘船的误差椭圆现在有多大、离导弹门/主炮门还差多少。悬停敌方目标临时看;左键点敌方目标常驻;点我方舰看它正在打(或正在等)的那个目标" aria-label="缩圈"><svg class="tl-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="i-ship" d="M17.6 12.9 8 6.4 11 12.3 8.4 17.9Z"/><ellipse class="i-ell" cx="12" cy="12" rx="10.8" ry="5.4" transform="rotate(-13 12 12)"/><path class="i-los" d="M0 14.8 24 9.2"/></svg></button><button class="hbtn" data-tool="sig" title="信号视野:画出我方每艘舰的【被探测范围】——光学/红外恒有;开了雷达才有被听见的那一圈。半径直接读感知层的量程律,与判据同一个数" aria-label="信号视野"><svg class="tl-ico" viewBox="0 0 24 24" aria-hidden="true"><circle class="i-r3" cx="12" cy="12.6" r="11.4"/><circle class="i-r2" cx="12" cy="12.6" r="8.2"/><circle class="i-r1" cx="12" cy="12.6" r="5"/><path class="i-ship" d="M12 5.4 15.9 18 12 14.8 8.1 18Z"/></svg></button></div>
</div>
<!-- SN7 定位几何小窗:叠在地图右上角、紧贴右轨左侧(照 demos/sensors/态势感知V3.html 的 #pPhase)。自己的小 canvas,不进主画布;
     开关是右下角 #tools 的「缩圈」钮(render/85-settings 的委托)。 -->
<div id="geomPane" class="panel" hidden><canvas id="geomCv"></canvas><div class="gp-tag">定位几何<b>GEOMETRY</b></div><div class="gp-hint" id="geomHint"></div></div>
<!-- MT1 对局结果卡片:只在对局分出胜负时由 scenario/97-match 的 matchTick 显示。 -->
<div id="matchEnd" class="panel" hidden><div class="me-title" id="meTitle">胜利</div><div class="me-sub" id="meSub"></div><div class="me-stat" id="meStat"></div><div class="me-btns"><button class="btn" id="meAgain">再来一局</button><button class="btn" id="meRange">回靶场</button></div></div>
<div id="mapTag">战术层<b>TACTICAL</b></div><!-- SN6 当前层的读数,只在【换层那一刻】写(render/80-viewtier 的 vtFrame) -->

<!-- 地图组 · 红外:左下角的红外开关。逻辑在本页最后那段脚本里 -->
<div id="irDock"><button class="hbtn" id="irBtn" title="红外图(热的地形):我方全部舰船看到的热源汇成一张场。每个热源是一座山 —— 近处高而尖、远处矮而宽;分 5 档,由暗到亮是海平面的 1 / 3 / 10 / 30 / 100 倍,档与档之间画等高线。海平面 = 一艘熄火静默的驱逐舰恰好在引擎的发现距离上的峰高:山露出海平面,引擎就判它被发现了。点火、开火、开雷达的船山会变高">红外</button></div>

<div id="hud" class="panel">
  <div class="logo">SPACE POWER<span> · 骨架</span></div>
  <div id="clock">00:00</div>
  <div id="rate">x1</div>
  <button class="hbtn" id="btnPause" title="暂停/继续(空格)">⏸</button>
  <button class="hbtn" id="btnSlow" title="减速(-)">−</button>
  <button class="hbtn" id="btnFast" title="加速(+)">+</button>
  <div class="spacer"></div>
  <button class="hbtn" id="btnMatch" title="进入对局">对局</button>
  <button class="hbtn" id="btnRocks" title="进入碎石带对局">碎石带</button><!-- ENV1 带环境的对局(太阳禁区 + 残骸场);入口逻辑在 scenario/97-match --><!-- MT1 对局入口(scenario/97-match);进了对局它变成「回靶场」 -->
  <button class="hbtn" id="btnTut" title="教程 · 指挥官手册(Esc 关闭)">教程</button><!-- RF5-D 排在 .spacer 之后 = 顶栏右端。SL1(2026-09-22 瘦身):原来跟在它后面被藏着的七个旧钮(录制/GM/互搏/靶场参数/场景菜单/回放/设置)已整套删除;GM 仍走 F8 -->
</div>

<!-- FM1 编队书签栏(左轨顶部,常驻)。这是编队的唯一可见入口。
     刻意不给 class="panel":.panel 带 overflow:hidden + 边框背景,会把一叠独立小条圈成一块面板。内容由 render/87-fmbar.js 填。 -->
<div id="fmBar"></div>
<!-- FM7 测试用「加船」小条:挂在左轨书签栏下方。靶场只有 3 艘蓝舰,凑不出两支编队,阵型没法手试。
     内容由 scenario/96-spawn.js 建。 -->
<div id="spawnBar"></div>
<!-- FM1 编队菜单(点书签展开)。.p-title / #fmActs 两个容器必须是【静态元素】(信息区 #selFm 已搬到右轨 #selPanel 里)——
     事件全部委托到它们身上,而 on() 遇元素不存在只会静默跳过,动态创建的容器挂不上委托。
     默认 display:none,由 updFmBar() 写回 'flex'(不是 '')。 -->
<div id="fmMenu" class="panel" style="display:none">
  <div class="p-title"><b id="fmTitle">编队</b><span class="hint" id="fmHint">—</span></div>
  <div id="fmActs"></div>
</div>

<!-- RF2 简化UI:选中舰实时信息面板(右轨)。SL1(2026-09-22 瘦身):旧舰队卡面板 / 事件面板 / 右轨底部的事件流面板已整套删除,右轨只剩这一块 -->
<div id="selPanel" class="panel">
  <div class="p-title"><b id="selTitle">未选中</b><span class="hint">左键点选 · 拖拽框选</span></div>
  <div id="selInfo"></div>
  <!-- FL1 编队信息区:原 #fmMenu 里的 #fmInfo,整块搬到右轨。理由是"左边只放操作、右边只放实时数据"。
       必须是【静态元素】:87-fmbar 的事件委托挂在它身上,而 on() 遇元素不存在只会静默跳过。
       显隐由 88-selpanel 的 updateSelPanel 独占(选中的恰好是一支编队才显示),87-fmbar 只管往里写内容。 -->
  <div id="selFm" style="display:none"></div>
  <div id="fcSec"><!-- RF5 火控计算机:序列/目标解算列表。#fcList 必须是静态元素——on() 遇元素不存在会静默跳过,动态创建挂不上委托 -->
    <div class="fc-hd">火控计算机<span class="fc-btn" id="fcPickBtn" title="把当前序列态那条设为唯一开火序列;再按一次回到轮询">选择</span></div><!-- RF8b 舰级"选择"钮:刻意【不进 #fcList】——那里每 20 帧重渲一次,且委托要求带 data-seq(舰级动作没有),上一版的大序列钮正是栽在这条上 -->
    <div id="fcList"></div>
  </div>
</div>

<!-- RANGE1 靶场参数面板:左上角,UI1 左轨车道统一定位。SL1:顶栏那个开关钮已删,面板逻辑(scenario/95-range)保留,css 里仍按 RF2 的老样子藏着 -->
<div id="trPanel" class="panel" style="display:none"><!-- UI1 原来这里写死 max-height:calc(100% - 316px),把旋钮区压成 8px;现由 --rail-top/--dock-b 派生 -->
  <div class="p-title"><b>🎯 靶场参数</b><span class="hint">逐靶可调</span></div>
  <div class="tr-tabs" id="trTabs"></div>
  <div class="tr-body" id="trBody"></div>
  <div class="tr-read" id="trRead"></div>
  <div class="tr-btns">
    <button class="ed-btn" id="trSyncBtn" title="打开后改任一旋钮同时作用于三个靶">同步全靶:关</button>
    <button class="ed-btn" id="trReset" title="伤害/命中/防御链读数全部归零并重新计时">归零统计</button>
    <button class="ed-btn danger" id="trClose">✕ 关闭</button>
  </div>
</div>

<!-- RF3 简化UI:底部操作栏三区 = 舰名区 | 规格读数列(标签上/数值下) | 开关组(88-selpanel 按 s.weapons 配装动态生成) -->
<div id="cmdBar" class="panel">
  <div class="cmd-ship"><b id="ciName">—</b><span id="ciCls">—</span></div>
  <div class="cmd-sep"></div>
  <div id="ciSpec"></div>
  <div class="cmd-sep"></div>
  <div class="cmd-btns"></div>
</div>
<div id="cmdTip"></div>
<!-- RF5-D 教程模态(顶栏 #btnTut 唤出)。内容由 render/85-tutorial.js 惰性写进 #tutBody(打开过一次才存在),
     所以常规画面下这里是三个空壳,零元素泄漏。SL1:旧设置面板的遮罩已删,这是顶栏唯一的模态。 -->
<div id="tutOverlay">
  <div id="tutPanel">
    <div class="tut-hd">
      <h2>指挥官手册</h2>
      <span class="tut-hd-hint">Esc / 点遮罩 关闭 · 打开期间模拟暂停</span>
      <button class="hbtn" id="tutCloseBtn" title="关闭教程(Esc)">✕</button>
    </div>
    <div class="tut-body" id="tutBody"></div>
  </div>
</div>

<!-- FM4 舰队编组控制页(编队菜单的「编组控制」钮唤出)。几何抄 #tutOverlay:外层 flex 居中 + 卡片定高 + 内层独立滚动。
     内容由 render/89-fmpage.js 的 fmPageRender() 写进 #fpBody,
     常规画面下这里是三个空壳。委托挂在 #fmPage / #fpClose 两个静态元素上,所以内容随便重渲都挂得住。 -->
<div id="fmPage">
  <div id="fmPagePanel">
    <div class="fp-hd">
      <h2>舰队编组控制</h2>
      <span class="fp-hd-hint" id="fpHint">—</span>
      <button class="hbtn" id="fpClose" title="关闭(Esc)">✕</button>
    </div>
    <div class="fp-body" id="fpBody"></div>
  </div>
</div>

<div id="xhTip"></div><!-- RF5 悬停敌舰信息卡:跟随光标,内容按 litBlue 接触等级分档(command/74-targeting 写 innerHTML)。刻意不给 class="panel":.panel 带 z-index:var(--z-panel) 与 overflow:hidden,会把层级压回面板档还裁掉内容,几何一律自带(抄 #cmdTip) -->

<script src="../../js/render/88-selpanel.js?v=20260923"></script>
<script src="../../js/render/89-radial.js?v=20260923"></script>
<script src="../../js/render/89-fmpage.js?v=20260923"></script><!-- FM4 舰队编组控制页。与 89-radial 共用编号 89(先例:render/85-settings 与 85-tutorial)。顶层有 on(...) 委托挂载与两条 window 监听,故必须晚于 core/00;其余跨文件引用全在运行期解析 --><!-- RF5 Phase C 目标轮盘的几何与渲染:半径/角度/容量常量与 drawRadial/radialHit/radialInBand/radPages 全在这一份。必须晚于 88-selpanel(扇区射程读数走它的 KIND_INFO);顶层只有 const/let/function,零顶层执行 -->
<script src="../../js/scenario/90-envs.js?v=20260923"></script>

<!-- ================= 地图组 · 红外(demos/地图组/红外.html)=================
     这一页是仓库根 index.html 的一份拷贝(2026-09-23 生成):DOM 与脚本一样,路径改成 ../../,再在最后加一段红外图脚本。
     引擎的脚本一个字没改,舰船 / 鼠标键盘 / 加船小条都是引擎自己的。⚠ 主页面以后改了 DOM,这里不会跟着变 —— 要重新拷一份。 -->
<script>
"use strict";
/* ================= 地图组 · 红外(2026-09-23)=================
   用户:「左下角做一个专门的红外雷达按钮,能看到观测范围内的热源分布,越近的分辨率越高,没有一个截断式的边界」
         「里面可以加入舰船,操作方式和主引擎一致」「热区这个设计不要了」
         「真实位置画法,究竟在什么位置红外团才会消失?方法 B 假设有巨量的舰船-杂物-恒星,怎么办?
           我想要的是一种类似综合起来的方法,类似等高线图」「替换 AB」
   画法 = 热的地形:不一个物体画一个团、也不一对观测画一道光,而是把所有热源汇成一张场,分档加等高线画出来。
   业内对应:天文的等照度线(isophote,一档一档的等亮度线);Elfes / Moravec 的证据栅格(1985~1989,读数累加进同一张栅格);
   目标多到没法逐个关联时的概率假设密度 PHD(Mahler 2003)。这里只取"画场、不画物体"的画法,不做滤波。
     · 每个热源堆一座山(二维高斯):体积 = 收到的热量(引擎的信噪比 SNR),宽度 = 分辨率(距离 x 引擎的角误差 covTheta('opt'))。
       体积守恒,所以摊得越开峰越低 —— 远处的船又矮又宽,很快沉下去;近处又高又尖。宽度取看得最清楚的那一艘我方船
     · 所有山叠成一张场,分 5 档(海平面的 1 / 3 / 10 / 30 / 100 倍),档与档之间画一条等高线
     · 海平面 = 一艘熄火静默的 DD 恰好在引擎的发现距离上的峰高 ⇒ 地图与引擎的红外判据是同一个数:
       一座山露出海平面,引擎就判它被发现了。它沉下去的位置就是"消失的地方",但地图上没有任何画出来的边界
     · 离得比分辨率还近的几个热源自然并成一座山(分不开,就该画成一座);几百个热源也只是往同一张底图里贴几百次
   这一页只加一层画面,引擎一个字不改:页面原样加载引擎的全部脚本;红外图挂在引擎接触层(drawContacts)之后画、舰标之下;
   热区不画(把引擎的 heatBuild 换成恒返回 0,主游戏里热区还在)。观测者 = 我方全部存活的船;热源 = 不是我方的一切(红舰、石头)。 */
const IRM={on:false,
  CELL:5,                     /* 底图一格 = 多少屏幕像素 */
  LEVELS:[1,3,10,30,100],     /* 分档:相对海平面的倍数 */
  CULL:0.02,                  /* 每座山贴到比海平面低 2% 为止(不截在 3 个 sigma:近处的高峰在 3 sigma 处仍远高于海平面,截了就是一道硬边) */
  SIG_MIN:0.7                 /* 山的最小宽度(格):再窄就只落在一格里 */
};
const IRM_FILL=[[120,30,20,70],[190,60,25,100],[240,110,40,130],[255,170,70,160],[255,230,160,190]];   /* 5 档的底色(RGBA,A 按 0~255) */
const IRM_LINE=['rgba(255,110,60,.55)','rgba(255,140,70,.65)','rgba(255,175,90,.75)','rgba(255,210,130,.85)','rgba(255,240,200,.95)'];
let irmRef=null;
function irmRefGet(){ /* 海平面的参照:一艘熄火静默的 DD,在引擎给它的发现距离上的模糊宽度 */
  if(irmRef)return irmRef;
  const t={kind:'ship',size:shipStats('DD',2).size,flame:0,sideFlame:0,emitMode:'silent',fireHot:0,pos:null};
  const R=visRangeOf(t);irmRef={R:R,sig:R*covTheta('opt',null,t,R)};return irmRef;
}
function irmObservers(){return ships.filter(s=>s.side==='blue'&&!s.dead);}
function irmSources(){return ships.filter(s=>s.side!=='blue'&&!s.dead).concat((typeof rocks!=='undefined'?rocks:[]).filter(r=>!r.dead));}
/* 一对观测:o 看 t。全部读引擎的判据 */
function irmPair(o,t){
  const dx=t.pos[0]-o.pos[0],dy=t.pos[1]-o.pos[1],dz=(t.pos[2]||0)-(o.pos[2]||0);
  const d=Math.max(1,Math.hypot(dx,dy,dz)),R=visRangeOf(t),snr=(R/d)*(R/d);
  return {d:d,snr:snr,blur:d*covTheta('opt',o,t,d)};
}
/* 一座山:峰高(相对海平面)与宽度(km)。峰高 = 体积 / 面积 ∝ SNR / 宽度²,按参照归一 */
function irmHill(t,obs){
  let best=null;for(const o of obs){const q=irmPair(o,t);if(!best||q.snr>best.snr)best=q;}
  if(!best)return null;
  const ref=irmRefGet(),k=ref.sig/best.blur;
  return {peak:best.snr*k*k,sig:best.blur};
}
/* 场:低分辨率底图上的格点 i,j 落在屏幕 (i*CELL, j*CELL) */
let irmF=null,irmGW=0,irmGH=0,irmCv=null,irmImg=null;
function irmField(){
  const C=IRM.CELL,gw=Math.ceil(W/C)+2,gh=Math.ceil(H/C)+2;
  if(!irmF||irmF.length!==gw*gh)irmF=new Float32Array(gw*gh);else irmF.fill(0);
  irmGW=gw;irmGH=gh;
  const obs=irmObservers();if(!obs.length)return 0;
  let n=0;
  for(const t of irmSources()){
    const h=irmHill(t,obs);if(!h||!(h.peak>=IRM.CULL))continue;
    const p=toScreen(t.pos[0],t.pos[1]),cx=p[0]/C,cy=p[1]/C;
    const s=Math.max(IRM.SIG_MIN,h.sig*cam.zoom/C),r=s*Math.sqrt(2*Math.log(h.peak/IRM.CULL));
    const i0=Math.max(0,Math.floor(cx-r)),i1=Math.min(gw-1,Math.ceil(cx+r)),j0=Math.max(0,Math.floor(cy-r)),j1=Math.min(gh-1,Math.ceil(cy+r));
    if(i0>i1||j0>j1)continue;
    const e=-0.5/(s*s);
    for(let j=j0;j<=j1;j++){const dy=j-cy,dy2=dy*dy,row=j*gw;for(let i=i0;i<=i1;i++){const dx=i-cx;irmF[row+i]+=h.peak*Math.exp((dx*dx+dy2)*e);}}
    n++;
  }
  return n;
}
/* 等高线:marching squares,每一档一条路径,端点在格边上线性插值 */
function irmContour(L){
  const F=irmF,gw=irmGW,gh=irmGH,C=IRM.CELL,path=new Path2D();let segs=0;
  const lerp=function(a,b){return (L-a)/(b-a);};
  for(let j=0;j<gh-1;j++){
    for(let i=0;i<gw-1;i++){
      const a=F[j*gw+i],b=F[j*gw+i+1],c=F[(j+1)*gw+i+1],d=F[(j+1)*gw+i];
      const idx=(a>=L?8:0)|(b>=L?4:0)|(c>=L?2:0)|(d>=L?1:0);
      if(idx===0||idx===15)continue;
      const x=i*C,y=j*C;
      const T=[x+lerp(a,b)*C,y],R=[x+C,y+lerp(b,c)*C],B=[x+lerp(d,c)*C,y+C],Lf=[x,y+lerp(a,d)*C];
      const seg=function(p,q){path.moveTo(p[0],p[1]);path.lineTo(q[0],q[1]);segs++;};
      switch(idx){
        case 1:case 14:seg(Lf,B);break; case 2:case 13:seg(B,R);break; case 3:case 12:seg(Lf,R);break;
        case 4:case 11:seg(T,R);break; case 6:case 9:seg(T,B);break; case 7:case 8:seg(Lf,T);break;
        case 5:seg(Lf,T);seg(B,R);break; case 10:seg(T,R);seg(Lf,B);break;
      }
    }
  }
  return segs?path:null;
}
function drawIrMap(){
  const n=irmField();if(!n)return;
  const gw=irmGW,gh=irmGH,C=IRM.CELL,Lv=IRM.LEVELS,F=irmF;
  if(!irmCv||irmCv.width!==gw||irmCv.height!==gh){irmCv=document.createElement('canvas');irmCv.width=gw;irmCv.height=gh;irmImg=irmCv.getContext('2d').createImageData(gw,gh);}
  const D=irmImg.data;
  for(let q=0;q<gw*gh;q++){
    const v=F[q];let b=0;while(b<Lv.length&&v>=Lv[b])b++;
    const o=q*4;if(b===0){D[o+3]=0;continue;}
    const c=IRM_FILL[b-1];D[o]=c[0];D[o+1]=c[1];D[o+2]=c[2];D[o+3]=c[3];
  }
  irmCv.getContext('2d').putImageData(irmImg,0,0);
  ctx.save();ctx.imageSmoothingEnabled=true;
  ctx.drawImage(irmCv,-C/2,-C/2,gw*C,gh*C);   /* 格点 i 落在屏幕 i*CELL,底图的第 i 个像素就铺在它周围一格 */
  ctx.lineWidth=1;
  for(let k=0;k<Lv.length;k++){const p=irmContour(Lv[k]);if(!p)continue;ctx.strokeStyle=IRM_LINE[k];ctx.stroke(p);}
  ctx.restore();
}
/* 热区不要:引擎的接触层每帧先调 heatBuild 生成热区、有东西才画。这里换成恒返回 0 */
heatBuild=function(){return 0;};
/* 挂进引擎的接触层之后(舰标之下)。引擎文件不改:render() 按名字调 drawContacts,运行期换成先画原来的、再画红外图 */
const irmOrigDrawContacts=drawContacts;
drawContacts=function(){irmOrigDrawContacts();if(IRM.on)drawIrMap();};

/* 左下角的开关 */
function irmSync(){const b=document.getElementById('irBtn');if(b)b.classList.toggle('on',IRM.on);}
on('irBtn','click',function(e){e.currentTarget.blur();IRM.on=!IRM.on;irmSync();});
irmSync();

/* ================= 自检(?selftest) ================= */
function irmSelftest(){
  const out=[];let ok=true;const T=(n,c,d)=>{out.push((c?'✓ ':'✗ ')+n+(d?'  '+d:''));if(!c)ok=false;};
  const shipsBak=ships.slice(),seq0=shipSeq,camBak={x:cam.x,y:cam.y,zoom:cam.zoom},onBak=IRM.on,rocksBak=(typeof rocks!=='undefined')?rocks:null;
  try{
    const B=makeShip('CA','红外测蓝',[0,0,0],[1,0,0],[0,0,0],'blue',2),R=makeShip('DD','红外测红',[0,0,0],[-1,0,0],[0,0,0],'red',2);
    ships.length=0;ships.push(B,R);R.flame=0;R.sideFlame=0;R.fireHot=0;setEmit(R,'silent');if(rocksBak)rocks=[];
    const Rv=visRangeOf(R),pk=function(k){R.pos=[Rv*k,0,0];return irmHill(R,[B]);};
    /* ① 海平面对上引擎:熄火静默的 DD 在引擎的发现距离上峰高恰为 1;近一点露出、远一点沉下;峰高随距离连续下降 */
    const h1=pk(1).peak,h09=pk(0.9).peak,h11=pk(1.1).peak,h0999=pk(0.999).peak,h1001=pk(1.001).peak,h05=pk(0.5).peak;
    T('① 海平面 = 引擎的发现距离:恰在那里沉到海平面',Math.abs(h1-1)<1e-9&&h09>1&&h11<1&&Math.abs(h0999-h1001)<0.02&&h05>h09,
      '0.5 倍 '+h05.toFixed(1)+' · 0.9 倍 '+h09.toFixed(2)+' · 1 倍 '+h1.toFixed(3)+' · 1.1 倍 '+h11.toFixed(2)+'(发现距离 '+Math.round(Rv/1000)+'k)');
    /* ①b 体积守恒:山的体积(峰高 x 宽度²)正比于收到的热量(信噪比),摊得越开峰越低 —— 不守恒的话远处的船不会沉,只会变成一片越来越大的淡雾(A 画法的毛病) */
    const vol=function(k){const h=pk(k);R.pos=[Rv*k,0,0];return h.peak*h.sig*h.sig/irmPair(B,R).snr;},v05=vol(0.5),v1=vol(1),v2=vol(2);
    T('①b 体积守恒:峰高 x 宽度² / 信噪比 是常数',Math.abs(v05/v1-1)<1e-9&&Math.abs(v2/v1-1)<1e-9);
    /* ② 越近越清楚:宽度随距离变大 */
    const s1=pk(1).sig,s05=pk(0.5).sig,s025=pk(0.25).sig;
    T('② 越近越清楚',s025<s05&&s05<=s1/2+1e-9,'1/4 倍 '+Math.round(s025)+' km · 1/2 倍 '+Math.round(s05)+' km · 1 倍 '+Math.round(s1)+' km');
    /* ③ 与舰船的反应:同一个距离上,点火 / 开火 / 开雷达都让山变高;点火让沉下去的船重新露出来 */
    R.pos=[Rv*1.5,0,0];const c0=irmHill(R,[B]).peak;
    R.flame=1;const cF=irmHill(R,[B]).peak;R.flame=0;R.fireHot=5;const cX=irmHill(R,[B]).peak;R.fireHot=0;
    setEmit(R,'paint');const cP=irmHill(R,[B]).peak;setEmit(R,'silent');
    T('③ 点火 / 开火 / 开雷达都让山变高;1.5 倍远处点火能露出海平面',cF>c0&&cX>c0&&cP>c0&&c0<1&&cF>1,
      '熄火静默 '+c0.toFixed(3)+' · 点火 '+cF.toFixed(2)+' · 开火 '+cX.toFixed(2)+' · 开雷达 '+cP.toFixed(3));
    /* ④ 热源集合 */
    const K=(typeof makeRock==='function')?makeRock([Rv*0.5,Rv*0.2,0],0.8,[1,0,0]):null;if(K)rocks=[K];
    const S=irmSources();
    T('④ 热源不含我方的船、含红舰与石头',S.indexOf(B)<0&&S.indexOf(R)>=0&&(!K||S.indexOf(K)>=0),S.length+' 个热源');
    if(K)rocks=[];
    /* ⑤ 挂接:打开时接触层之后多画一张底图 + 等高线;关着一笔不多 */
    cam.x=Rv*0.3;cam.y=0;cam.zoom=Math.min(W,H)/(Rv*1.2);R.pos=[Rv*0.4,0,0];
    const orig={drawImage:ctx.drawImage,stroke:ctx.stroke};let ci=0,cs=0;
    const capture=function(fn){ci=0;cs=0;ctx.drawImage=function(){ci++;return orig.drawImage.apply(ctx,arguments);};ctx.stroke=function(){cs++;return orig.stroke.apply(ctx,arguments);};
      try{fn();}finally{ctx.drawImage=orig.drawImage;ctx.stroke=orig.stroke;}return {i:ci,s:cs};};
    IRM.on=false;const off=capture(function(){drawContacts();});
    IRM.on=true;const onC=capture(function(){drawContacts();});
    T('⑤ 挂接:关着不画;打开多一张底图、若干条等高线',off.i===0&&off.s===0&&onC.i===1&&onC.s>=1,'关 '+off.i+' 图 '+off.s+' 线 · 开 '+onC.i+' 图 '+onC.s+' 线');
    /* ⑥ 热区不画 */
    const tkR=trkOf('blue',R);const covBak=tkR.cov,litBak=tkR.lit;tkR.cov=newCov();tkR.lit=1;tkR.cov.fix=false;
    const st6=contactState(R,'blue');IRM.on=false;const off6=capture(function(){drawContacts();});tkR.cov=covBak;tkR.lit=litBak;
    T('⑥ 热区不画:只有热区的接触在,接触层也不画',st6==='heat'&&off6.i===0&&heatBuild()===0,'显示态 '+st6);
    /* ⑦ 分不开的并成一座山:两块石头隔 0.3 个宽度 ⇒ 连线上只有一个峰;隔 5 个宽度 ⇒ 两个峰 */
    const peaksAlong=function(sepK){
      ships.length=0;ships.push(B);B.pos=[0,0,0];
      const base=[Rv*0.35,0,0],A0=makeRock(base.slice(),0.8,[1,0,0]);rocks=[A0];
      const sg=irmHill(A0,[B]).sig,A1=makeRock([base[0],base[1]+sg*sepK,0],0.8,[1,0,0]);rocks=[A0,A1];
      cam.x=base[0];cam.y=base[1]+sg*sepK/2;cam.zoom=(IRM.CELL*8)/sg;   /* 让一个宽度 = 8 格 */
      irmField();
      const p0=toScreen(A0.pos[0],A0.pos[1]),p1=toScreen(A1.pos[0],A1.pos[1]),i=Math.round(p0[0]/IRM.CELL);
      const ja=Math.round(p0[1]/IRM.CELL),jb=Math.round(p1[1]/IRM.CELL),v=[];
      for(let j=Math.min(ja,jb)-2;j<=Math.max(ja,jb)+2;j++)v.push(irmF[j*irmGW+i]);
      let m=0;for(let q=1;q<v.length-1;q++)if(v[q]>v[q-1]&&v[q]>=v[q+1])m++;
      return m;
    };
    const m03=peaksAlong(0.3),m5=peaksAlong(5);
    T('⑦ 分不开的并成一座山、分得开的两座',m03===1&&m5===2,'隔 0.3 个宽度 '+m03+' 个峰 · 隔 5 个宽度 '+m5+' 个峰');
    /* ⑨ 不截断:一座很高的山在 4 个宽度之外仍按高斯衰减(4096 x e^-8 ≈ 1.4,还在海平面之上);截在 3 个宽度处的话这里是 0,地图上就是一道硬边 */
    ships.length=0;ships.push(B);B.pos=[0,0,0];R.pos=[0,0,0];const Kt=makeRock([0,0,0],0.8,[1,0,0]);rocks=[Kt];
    let kk=0.5;Kt.pos=[Rv*kk,0,0];while(irmHill(Kt,[B]).peak<4096&&kk>0.001){kk*=0.97;Kt.pos=[Rv*kk,0,0];}   /* 从 0.5 倍往近处找,找到峰高刚过 4096 的位置(第一版从原点起步,一次没找就停在观测船身上) */
    const hT=irmHill(Kt,[B]);cam.x=Kt.pos[0];cam.y=0;cam.zoom=(IRM.CELL*6)/hT.sig;irmField();
    const pc=toScreen(Kt.pos[0],Kt.pos[1]),ic=Math.round(pc[0]/IRM.CELL),jc=Math.round(pc[1]/IRM.CELL),sgc=hT.sig*cam.zoom/IRM.CELL;
    const i4=Math.round(ic+4*sgc),v4=irmF[jc*irmGW+i4],want=hT.peak*Math.exp(-0.5*Math.pow((i4-pc[0]/IRM.CELL)/sgc,2));
    T('⑨ 不截断:高山在 4 个宽度外仍按高斯衰减',v4>1&&Math.abs(v4/want-1)<0.05,'峰高 '+Math.round(hT.peak)+' · 4 个宽度处 '+v4.toFixed(2)+'(应为 '+want.toFixed(2)+')');
    rocks=[];
    /* ⑧ 海量热源:300 块石头撒满一片,算一帧场的时间、没有 NaN */
    ships.length=0;ships.push(B);B.pos=[0,0,0];const many=[];
    let sd=12345;const rnd=function(){sd=(sd*16807)%2147483647;return sd/2147483647;};
    for(let q=0;q<300;q++)many.push(makeRock([rnd()*Rv*1.5-Rv*0.2,rnd()*Rv*1.2-Rv*0.6,0],0.3+rnd()*0.8,[1,0,0]));
    rocks=many;cam.x=Rv*0.5;cam.y=0;cam.zoom=Math.min(W,H)/(Rv*1.6);
    const t0=performance.now();const nh=irmField();const pth=[];for(const L of IRM.LEVELS)pth.push(irmContour(L));const dt=performance.now()-t0;
    let nan=0;for(let q=0;q<irmF.length;q++)if(!isFinite(irmF[q]))nan++;
    T('⑧ 300 个热源:一帧的场 + 等高线算得完、没有 NaN',nh>0&&nan===0&&dt<60,nh+' 座山露在屏上 · '+dt.toFixed(1)+' ms');
  }catch(e){T('自检抛异常',false,String(e&&e.stack||e));}
  finally{
    ships.length=0;shipsBak.forEach(x=>ships.push(x));shipSeq=seq0;cam.x=camBak.x;cam.y=camBak.y;cam.zoom=camBak.zoom;IRM.on=onBak;if(rocksBak)rocks=rocksBak;irmSync();
  }
  const pre=document.createElement('pre');pre.id='irSelftest';pre.textContent=out.join('\n');document.body.appendChild(pre);
  document.title=ok?'SELFTEST:PASS':'SELFTEST:FAIL';
}
function irmUitest(){
  const out=[];let ok=true;const T=(n,c,d)=>{out.push((c?'✓ ':'✗ ')+n+(d?'  '+d:''));if(!c)ok=false;};
  try{
    IRM.on=false;irmSync();
    document.getElementById('irBtn').click();T('U1 点「红外」:打开、按钮亮',IRM.on===true&&document.getElementById('irBtn').classList.contains('on'));
    document.getElementById('irBtn').click();T('U2 再点:关掉',IRM.on===false&&!document.getElementById('irBtn').classList.contains('on'));
  }catch(e){T('交互自检抛异常',false,String(e&&e.stack||e));}
  const pre=document.createElement('pre');pre.id='irSelftest';pre.textContent=out.join('\n');document.body.appendChild(pre);
  document.title=ok?'UITEST:PASS':'UITEST:FAIL';
}
{const Qs=new URLSearchParams(location.search);
  if(Qs.has('ir'))IRM.on=true;irmSync();   /* 调试参数(截图用):?ir 打开红外图 */
  if(Qs.has('selftest'))irmSelftest();if(Qs.has('uitest'))irmUitest();}
</script>
