<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>雷达效果</title>
<style>
html,body{margin:0;height:100%;background:#070a0e;overflow:hidden;font:12px "Microsoft YaHei",sans-serif;color:#cfd8e0}

#fleet .ttl{color:#8fa0b0;margin-bottom:2px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hint">左键拖船 · 点船选中 · 拖选中船旁的小圆点定雷达朝向 · 悬停雷达 / 扇区按钮预览自己的暴露 · 悬停区域 / 回波看读数 · 右键拖动平移 · 滚轮缩放 · 加船:点 +蓝 / +红 再点地图,右键取消<br>
淡色底 = 我方雷达看得见的范围 · 点 = 雷达回波(暖色在接近、冷色在远离,旧的变暗) · 青色区域 = 听到的敌方雷达在哪(轮廓 = 一定在里面、边是软的;里面越亮越可能)· 越小越亮 · 菱形 = 红外看见(青边 = 顺着区域盯到的)</div>
<div id="perf"></div>
<div id="fleet"></div>
<div id="ui">
  <div id="read"></div>
  <div class="row" id="rowSel"><span class="lab" id="selName"></span>
    <span class="lab">雷达</span><span id="selRad"><button data-rm="off">关</button><button data-rm="blink">亮一下</button><button data-rm="on">常开</button></span>
    <span class="lab">扇区</span><span id="selW"><button data-w="360">360°</button><button data-w="120">120°</button><button data-w="60">60°</button><button data-w="30">30°</button></span>
    <span class="lab">引擎</span><span id="selFl"><button data-fl="0">熄火</button><button data-fl="1">点火</button></span></div>
  <div class="row"><span class="lab">视角</span><span id="view"><button data-v="blue">蓝方</button><button data-v="red">红方</button><button data-v="god">上帝</button></span>
    <span class="lab">时间</span><span id="speed"><button data-sp="0">暂停</button><button data-sp="1">×1</button><button data-sp="10">×10</button><button data-sp="50">×50</button></span>
    <span class="lab"></span><button id="reset">重来</button></div>
  <div class="row"><span class="lab">加船</span><span id="add"><button data-add="blue">+蓝</button><button data-add="red">+红</button></span></div>
</div>
<script>
"use strict";
/* 雷达效果独立演示页(2026-09-25):不加载引擎,数值与公式归本页。
   A 雷达看身形不看热 · B 扇区(手电是锥)· C 暴露随驻留收敛 · D 被听见 = 被指了方向
   画法只按位置、不按方向:我方雷达覆盖并成一片淡底;听到的敌方雷达并成全队共用的一张估计,画在它大概在的地方(几百艘船也不会铺满光锥) */

/* ---- 数值(起点取 H1 那一组,抄完归本页)---- */
const DEG=Math.PI/180;
const RAD={R0:1600000,   // 360° 扇区对一艘驱逐舰的雷达发现距离(km)
  HEAR:3200000,          // 主瓣扫过时被听见的距离
  SIDE:100000,           // 旁瓣被听见的距离:比主瓣低 30 dB,3200000/√1000
  T:4};                  // 扫完一次扇区的秒数,与扇区宽度无关,所以扇区越窄驻留越长
const IRD={COLD:240000,HOT:480000};                  // 红外看见一艘驱逐舰:熄火 / 点火
const ESM={S0:20,SMIN:1,NR:4,CUE_MAX:3,FADE:90};     // 第一次听到的半宽(度)、最窄半宽、第几次起有距离带、引导增益上限、隔多少秒算新一轮
function radarRange(w){return RAD.R0*Math.pow(360/w,0.25);}      // 搜索雷达方程:距离按(驻留 / 搜索角)的四次方根涨
function esmHalf(n){return Math.max(ESM.SMIN,ESM.S0/Math.sqrt(n));}  // 测向误差按听到次数的平方根缩小
function esmBandK(n){return 1+3/Math.sqrt(n);}                     // 距离带 [d/K, d·K]
function cueGain(half){return Math.min(ESM.CUE_MAX,Math.pow(180/half,0.25));}  // 只盯 2·half 度:驻留长 360/(2·half) 倍,距离按四次方根涨
function irRange(s){return s.flame?IRD.HOT:IRD.COLD;}

/* ---- 小工具 ---- */
function norm(a){a%=2*Math.PI;return a<0?a+2*Math.PI:a;}
function inArc(b,a0,a1){return norm(b-a0)<=a1-a0+1e-12;}
function hash01(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}h^=h>>>13;h=Math.imul(h,1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function pairU(a,b,k){return hash01(a.name+'|'+b.name+'|'+k)*2-1;}   // 每一对固定的偏差方向:误差可以大,但不许抖
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),a|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function fmtWan(km){return km>=1e4?(km/1e4).toFixed(km<1e5?1:0)+' 万 km':km.toFixed(0)+' km';}
function sideCol(side){return side==='blue'?'111,180,255':'255,107,90';}

/* ---- 场景;?fleet=N 每方再撒 N 艘(看几百艘时画面挤不挤)---- */
const FLEET=Math.max(0,Math.min(500,Math.floor(+new URLSearchParams(location.search).get('fleet')||0)));
function mkShip(side,name,x,y,vx,vy){return {side:side,name:name,pos:[x,y],vel:[vx,vy],flame:0,rm:'off',w:360,dir:side==='blue'?0:Math.PI,ph:0,swept:new Set()};}
let ships=[],clock=0,ESMREV=0;
const S={view:'blue',speed:10,sel:null,hover:null,mx:null,my:null,place:null};   // place:正在放新船的那一方
const RET={blue:new Map(),red:new Map()};   // 雷达回波:目标 → {pos, vr, d, t}(扫到那一刻的快照)
const TRK={blue:new Map(),red:new Map()};   // 听到的敌方雷达:'听者|辐射源' → {L, E, n, t, org, brg, half, band}
const PING=new Map();                       // 船 → 最近一次被扫到的真实时刻(告警闪一下)
function scene(){
  ships=[mkShip('blue','蓝1',0,0,0,0),mkShip('blue','蓝2',-150000,450000,0,0),mkShip('blue','蓝3',-150000,-450000,0,0),
    mkShip('red','红1',3000000,-100000,-400,0),mkShip('red','红2',2900000,500000,-400,0),mkShip('red','红3',3150000,-650000,-400,0)];
  ships[3].rm='on';   // 开局:红1 常开全向雷达,蓝方全部静默
  const r=rng(7);
  for(let i=0;i<FLEET;i++){ships.push(mkShip('blue','蓝'+(4+i),-600000+r()*800000,(r()*2-1)*1000000,0,0));
    const s=mkShip('red','红'+(4+i),2700000+r()*700000,(r()*2-1)*1000000,-400,0);if(i%5===0){s.rm='on';s.ph=r();}ships.push(s);}
  clock=0;ESMREV++;IRC.t=-1e9;PLY.key='';PLY.t=-1e9;for(const m of [RET.blue,RET.red,TRK.blue,TRK.red,PING])m.clear();
  S.sel=ships.find(s=>S.view==='god'||s.side===S.view);
  buildFleet();
}
function addShip(side,x,y){ /* 新船:静止、熄火、雷达关;名字接着这一方最大的编号 */
  let k=0;for(const s of ships)if(s.side===side)k=Math.max(k,+s.name.slice(1)||0);
  const s=mkShip(side,(side==='blue'?'蓝':'红')+(k+1),x,y,0,0);ships.push(s);
  if(S.view==='god'||S.view===side)S.sel=s;
  buildFleet();return s;
}
function setRm(s,m){if(m!=='off'&&(m==='blink'||s.rm==='off')){s.ph=0;s.swept.clear();}s.rm=m;}   // 从关到开、或亮一下:从扇区起点扫
/* 右上角雷达总控:每方"全部"一行 + 每艘一行,任何视角都能开关(不用选中、不用开上帝) */
const RM_BTNS='<button data-rm="off">关</button><button data-rm="blink">亮一下</button><button data-rm="on">常开</button>';
function buildFleet(){
  let h='<div class="ttl">雷达总控</div>';
  for(const side of ['blue','red'])h+='<div class="row" data-side="'+side+'"><span class="nm" style="color:rgb('+sideCol(side)+')">'+(side==='blue'?'蓝方全部':'红方全部')+'</span>'+RM_BTNS+'</div>';
  if(ships.length<=24)ships.forEach(function(s,i){h+='<div class="row" data-i="'+i+'"><span class="nm" style="color:rgba('+sideCol(s.side)+',.85)">'+s.name+'</span>'+RM_BTNS+'</div>';});
  else h+='<div class="ttl">船太多,只给全部</div>';
  document.getElementById('fleet').innerHTML=h;
}
function syncFleet(){
  for(const r of document.querySelectorAll('#fleet .row')){
    const i=r.getAttribute('data-i'),side=r.getAttribute('data-side'),L=i!==null?[ships[+i]]:ships.filter(s=>s.side===side);
    for(const b of r.querySelectorAll('button')){const m=b.getAttribute('data-rm');b.classList.toggle('on',L.length>0&&L.every(s=>s.rm===m));}}
}
function enemyTag(E){const k=ships.filter(s=>s.side===E.side).indexOf(E);return '辐射源'+(k<6?'甲乙丙丁戊己'[k]:(k+1)+'号');}   // 电子情报分得清是哪一部,不知道是哪艘船

/* ---- 雷达:扫描、回波、被听见 ---- */
function radOn(s){return s.rm!=='off';}
function beamAt(s,ph){return s.w>=360?s.dir+ph*2*Math.PI:s.dir+(ph-0.5)*s.w*DEG;}
function hear(L,E,d){ /* L 听到 E 的雷达一次 */
  const T=TRK[L.side],key=L.name+'|'+E.name;let k=T.get(key);
  if(!k||clock-k.t>ESM.FADE){k={L:L,E:E,n:0};T.set(key,k);}   // 隔太久算新一轮:对方可能早挪了
  k.n++;k.t=clock;k.org=[L.pos[0],L.pos[1]];k.half=esmHalf(k.n);
  k.brg=Math.atan2(E.pos[1]-L.pos[1],E.pos[0]-L.pos[0])+pairU(L,E,'b')*k.half*DEG*0.6;
  if(k.n>=ESM.NR){const K=esmBandK(k.n),c=d*Math.pow(K,pairU(L,E,'r')*0.5);k.band=[c/K,c*K];}else k.band=null;
  ESMREV++;PING.set(L,performance.now());
}
function scanArc(E,a0,a1){ /* 这一小步波束从 a0 扫到 a1 */
  for(const T of ships){if(T.side===E.side)continue;
    const dx=T.pos[0]-E.pos[0],dy=T.pos[1]-E.pos[1],d=Math.hypot(dx,dy);
    if(!inArc(Math.atan2(dy,dx),a0,a1))continue;
    E.swept.add(T);
    if(d<=radarRange(E.w))RET[E.side].set(T,{pos:[T.pos[0],T.pos[1]],vr:((T.vel[0]-E.vel[0])*dx+(T.vel[1]-E.vel[1])*dy)/d,d:d,t:clock});
    if(d<=RAD.HEAR)hear(T,E,d);
  }
}
function sweepDone(E){ /* 扫完一次:主瓣没扫到、但在旁瓣距离里的,听到一次旁瓣 */
  for(const T of ships){if(T.side===E.side||E.swept.has(T))continue;const d=Math.hypot(T.pos[0]-E.pos[0],T.pos[1]-E.pos[1]);if(d<=RAD.SIDE)hear(T,E,d);}
  E.swept.clear();
}
function sweep(E,h){
  let p0=E.ph,rest=h/RAD.T;   // 每一轮要么在本次扫描里走完剩下的,要么扫到头、rest 至少减 1-p0:不会因为浮点加不上去而空转
  while(rest>0&&radOn(E)){
    if(p0+rest<1){scanArc(E,beamAt(E,p0),beamAt(E,p0+rest));p0+=rest;break;}
    scanArc(E,beamAt(E,p0),beamAt(E,1));rest-=1-p0;p0=0;sweepDone(E);if(E.rm==='blink'){E.rm='off';syncUI();}}
  E.ph=p0;
}
function sub(h){clock+=h;for(const s of ships){s.pos[0]+=s.vel[0]*h;s.pos[1]+=s.vel[1]*h;}for(const s of ships)if(radOn(s))sweep(s,h);}
function step(dt){const n=Math.ceil(dt/(RAD.T/8));for(let i=0;i<n;i++)sub(dt/n);}   // 大步切成不超过八分之一次扫描的小步

/* ---- 听到的辐射源:我方全舰一体,每部敌方雷达只有一张估计。
   每艘听者给一份高斯(横向 = 方位误差 x 距离,纵向 = 距离带;还没有距离带时纵向铺满 0 ~ 320 万),按信息形式相加 ---- */
function estOne(E,a){
  let use=a.filter(k=>clock-k.t<=ESM.FADE);const fresh=use.length>0;if(!fresh)use=a;
  let m=null,C=null;
  for(let it=0;it<3;it++){let A=0,B=0,Cc=0,u=0,v=0;
    for(const k of use){const ux=Math.cos(k.brg),uy=Math.sin(k.brg),nx=-uy,ny=ux;
      const rc=k.band?Math.sqrt(k.band[0]*k.band[1]):RAD.HEAR/2,sr=k.band?(k.band[1]-k.band[0])/4:RAD.HEAR/(2*Math.sqrt(3));
      const px=k.org[0]+ux*rc,py=k.org[1]+uy*rc,r=m?Math.max(1e4,Math.hypot(m[0]-k.org[0],m[1]-k.org[1])):rc,sc=r*k.half*DEG/2,wc=1/(sc*sc),wr=1/(sr*sr);
      const a00=wc*nx*nx+wr*ux*ux,a01=wc*nx*ny+wr*ux*uy,a11=wc*ny*ny+wr*uy*uy;
      A+=a00;B+=a01;Cc+=a11;u+=a00*px+a01*py;v+=a01*px+a11*py;}
    const det=A*Cc-B*B;if(!(det>0))return null;
    m=[(Cc*u-B*v)/det,(A*v-B*u)/det];C=[Cc/det,-B/det,A/det];}
  let n=0,t=-1e9;for(const k of use){n+=k.n;t=Math.max(t,k.t);}
  return {E:E,m:m,C:C,n:n,L:use.length,fresh:fresh,age:clock-t};
}
const EST={key:'',list:[]};
function ests(side){ /* 这一方对全部敌方辐射源的估计;听到新的一次或时间走了才重算 */
  const key=side+'|'+ESMREV+'|'+clock;if(EST.key===key)return EST.list;
  const by=new Map();for(const k of TRK[side].values()){let a=by.get(k.E);if(!a)by.set(k.E,a=[]);a.push(k);}
  const L=[];for(const [E,a] of by){const e=estOne(E,a);if(e)L.push(e);}
  EST.key=key;EST.list=L;return L;
}
function estQ(e,p){const C=e.C,det=C[0]*C[2]-C[1]*C[1],dx=p[0]-e.m[0],dy=p[1]-e.m[1];return (dx*dx*C[2]-2*dx*dy*C[1]+dy*dy*C[0])/det;}
function estFade(e){return !e.fresh?0.3:(e.age<RAD.T*1.5?1:Math.max(0.3,1-(e.age-RAD.T*1.5)/ESM.FADE));}

/* ---- 目标区域的轮廓(集员估计 / 航海的"戴帽三角"):每艘听者给一块"方位 ± 半宽、距离带"围成的凸多边形,
   全部求交集 = 对方一定在里面。内弧取弦、外弧放大 1/cos,两处都只会把区域放大,不会把真值切出去 ---- */
function lobPoly(k){ /* 一艘听者的那一块,逆时针 */
  const h=k.half*DEG,b0=k.band?k.band[0]:0,M=8,b1=Math.min(k.band?k.band[1]:RAD.HEAR,RAD.HEAR)/Math.cos(h/M),o=k.org,P=[];   // 远边封在 320 万:再远主瓣也听不见
  const at=(r,a)=>[o[0]+Math.cos(a)*r,o[1]+Math.sin(a)*r];
  if(b0>0)P.push(at(b0,k.brg+h),at(b0,k.brg-h));else P.push([o[0],o[1]]);
  for(let i=0;i<=M;i++)P.push(at(b1,k.brg-h+2*h*i/M));
  return P;
}
function clipPoly(P,Q){ /* 凸多边形 P ∩ Q(都逆时针):Sutherland–Hodgman */
  let out=P;
  for(let i=0;i<Q.length&&out.length;i++){const a=Q[i],b=Q[(i+1)%Q.length],inp=out,ex=b[0]-a[0],ey=b[1]-a[1];out=[];
    for(let j=0;j<inp.length;j++){const p=inp[j],q=inp[(j+1)%inp.length],sp=ex*(p[1]-a[1])-ey*(p[0]-a[0]),sq=ex*(q[1]-a[1])-ey*(q[0]-a[0]);
      if(sp>=0)out.push(p);
      if((sp>=0)!==(sq>=0)){const t=sp/(sp-sq);out.push([p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t]);}}}
  return out;
}
function polyArea(P){let s=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];s+=p[0]*q[1]-q[0]*p[1];}return Math.abs(s)/2;}
function polyIn(P,p){for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];if((b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0])<0)return false;}return true;}
function polyHalf(P,O){ /* 从 O 看这块多边形张开多宽(半角,度);O 在里面 = 180 */
  if(polyIn(P,O.pos))return 180;
  let cx=0,cy=0;for(const p of P){cx+=p[0]/P.length;cy+=p[1]/P.length;}
  const a0=Math.atan2(cy-O.pos[1],cx-O.pos[0]);let lo=0,hi=0;
  for(const p of P){const d=norm(Math.atan2(p[1]-O.pos[1],p[0]-O.pos[0])-a0+Math.PI)-Math.PI;lo=Math.min(lo,d);hi=Math.max(hi,d);}
  return Math.max(ESM.SMIN,(hi-lo)/2/DEG);
}
const PLY={key:'',pre:'',t:-1e9,list:[]};
function polys(side){ /* 这一方对全部敌方辐射源的多边形;听到新的一次最多每 100 ms 重算一次 */
  const now=performance.now(),pre=side,key=pre+'|'+ESMREV+'|'+Math.floor(clock);
  if(PLY.key===key||(PLY.pre===pre&&now-PLY.t<100))return PLY.list;
  const by=new Map();for(const k of TRK[side].values()){let a=by.get(k.E);if(!a)by.set(k.E,a=[]);a.push(k);}
  const L=[];
  for(const [E,a] of by){let use=a.filter(k=>clock-k.t<=ESM.FADE);const fresh=use.length>0;if(!fresh)use=a;
    let P=lobPoly(use[0]);for(let i=1;i<use.length&&P.length>=3;i++)P=clipPoly(P,lobPoly(use[i]));
    if(P.length<3)continue;   // 交集是空的(对方在两次被听到之间挪太远):这一轮不画轮廓
    let n=0,t=-1e9;for(const k of use){n+=k.n;t=Math.max(t,k.t);}
    L.push({E:E,poly:P,area:polyArea(P),n:n,L:use.length,fresh:fresh,age:clock-t});}
  PLY.key=key;PLY.pre=pre;PLY.t=now;PLY.list=L;return L;
}

/* ---- 红外:能不能看见;落在光斑里的,顺着光斑盯着看(D)---- */
function cueHalf(e,O){ /* 从 O 看这一团有多宽(半角,度) */
  const dx=e.m[0]-O.pos[0],dy=e.m[1]-O.pos[1],D=Math.hypot(dx,dy)||1,nx=-dy/D,ny=dx/D,C=e.C;
  return Math.max(ESM.SMIN,Math.atan2(2*Math.sqrt(nx*nx*C[0]+2*nx*ny*C[1]+ny*ny*C[2]),D)/DEG);
}
function cueTable(side){ /* 每一团 x 每艘我方船的引导增益:与目标无关,先算好 */
  const L=polys(side).filter(z=>z.fresh),own=ships.filter(s=>s.side===side);   // 引导按多边形:知道它一定在哪一块,就盯那一块
  return {L:L,own:own,g:L.map(z=>own.map(O=>cueGain(polyHalf(z.poly,O))))};
}
function irSeesT(tab,T){ /* 返回 null 或 {cued:只有盯着看才看得见} */
  const inL=[];for(let i=0;i<tab.L.length;i++)if(polyIn(tab.L[i].poly,T.pos))inL.push(i);   // T 落在哪几块多边形里
  const R=irRange(T);let seen=false;
  for(let j=0;j<tab.own.length;j++){const O=tab.own[j],d=Math.hypot(T.pos[0]-O.pos[0],T.pos[1]-O.pos[1]);
    if(d<=R)return {cued:false};
    let g=1;for(const i of inL)g=Math.max(g,tab.g[i][j]);if(d<=R*g)seen=true;}
  return seen?{cued:true}:null;
}
function irSees(side,T){return irSeesT(cueTable(side),T);}
const IRC={t:-1e9,side:'',m:new Map()};
function irView(side){ /* 红外判定最多每 100 ms 重算一次:几百艘时每帧全算要几毫秒 */
  const now=performance.now();
  if(IRC.side!==side||now-IRC.t>=100){IRC.side=side;IRC.t=now;IRC.m.clear();const tab=cueTable(side);for(const T of ships)if(T.side!==side){const r=irSeesT(tab,T);if(r)IRC.m.set(T,r);}}
  return IRC.m;
}

/* ---- 镜头 ---- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
const cam={x:1500000,y:-50000,zoom:0.00025};let camFit=false;
function toScreen(x,y){return [(x-cam.x)*cam.zoom+W/2,(y-cam.y)*cam.zoom+H/2];}
function worldAt(sx,sy){return [(sx-W/2)/cam.zoom+cam.x,(sy-H/2)/cam.zoom+cam.y];}
function resize(){W=innerWidth;H=innerHeight;DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  if(!camFit){camFit=true;cam.zoom=Math.min(W/4600000,H/2600000);}}

/* ---- 画 ---- */
function label(t,x,y,c,mono){ctx.fillStyle=c;ctx.font=mono?'11px Consolas,monospace':'11px "Microsoft YaHei",sans-serif';ctx.fillText(t,x,y);}
function drawGrid(){
  const minPx=90,raw=minPx/cam.zoom,e=Math.pow(10,Math.floor(Math.log10(raw))),st=raw/e<2?2*e:(raw/e<5?5*e:10*e);
  const w0=worldAt(0,0),w1=worldAt(W,H);ctx.strokeStyle='#111a22';ctx.lineWidth=1;ctx.beginPath();
  for(let x=Math.ceil(w0[0]/st)*st;x<=w1[0];x+=st){const s=Math.round(toScreen(x,0)[0])+0.5;ctx.moveTo(s,0);ctx.lineTo(s,H);}
  for(let y=Math.ceil(w0[1]/st)*st;y<=w1[1];y+=st){const s=Math.round(toScreen(0,y)[1])+0.5;ctx.moveTo(0,s);ctx.lineTo(W,s);}
  ctx.stroke();label('格 '+fmtWan(st),W-120,H-10,'#3a4a5a',true);
}
function sectorPath(X,p,R,dir,w){X.beginPath();if(w>=360)X.arc(p[0],p[1],R,0,2*Math.PI);else{X.moveTo(p[0],p[1]);X.arc(p[0],p[1],R,dir-w*DEG/2,dir+w*DEG/2);X.closePath();}}
const COV={cv:null,cx:null};
function drawCoverage(side){ /* 一方全部开着的雷达看得见的范围:在离屏画布上并成一片,再按固定透明度贴上来(重叠不叠加、不画各自轮廓) */
  if(!COV.cv||COV.cv.width!==W||COV.cv.height!==H){COV.cv=document.createElement('canvas');COV.cv.width=W;COV.cv.height=H;COV.cx=COV.cv.getContext('2d');}
  const X=COV.cx;let any=false;X.clearRect(0,0,W,H);X.fillStyle='rgb('+sideCol(side)+')';
  for(const s of ships){if(s.side!==side||!radOn(s))continue;any=true;sectorPath(X,toScreen(s.pos[0],s.pos[1]),radarRange(s.w)*cam.zoom,s.dir,s.w);X.fill();}
  if(!any)return;
  ctx.globalAlpha=0.06;ctx.drawImage(COV.cv,0,0,W,H);ctx.globalAlpha=1;
}
function drawRadar(E){ /* 只给选中的那艘画:扇区轮廓 + 扫描线 + 余辉(定朝向用) */
  const c=sideCol(E.side),p=toScreen(E.pos[0],E.pos[1]),R=radarRange(E.w)*cam.zoom;
  sectorPath(ctx,p,R,E.dir,E.w);ctx.setLineDash([4,5]);ctx.strokeStyle='rgba('+c+',0.35)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
  const a=beamAt(E,E.ph),span=E.w>=360?2*Math.PI:E.w*DEG,tr=E.w>=360?span*0.12:Math.min(span*E.ph,span*0.12),N=8;
  for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.arc(p[0],p[1],R,a-tr*(i+1)/N,a-tr*i/N);ctx.closePath();ctx.fillStyle='rgba('+c+','+(0.16*(1-i/N)).toFixed(3)+')';ctx.fill();}
  ctx.strokeStyle='rgba('+c+',0.85)';ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+Math.cos(a)*R,p[1]+Math.sin(a)*R);ctx.stroke();
}
/* 射频图:多边形与高斯光斑融合 —— 外形取多边形(一定在里面),里面的浓淡取高斯(最可能在哪)。
   场值 = 峰高 x 罩 x (底 + (1-底) x 高斯):峰高 = (2 万 km)² / √det(协方差),越糊越暗;罩在多边形里是 1,
   出了边按离边的距离(各边外法向距离取大)在 SOFT 宽里平滑降到 0 —— 外形有棱角、边是软的;全部叠成一张场,对数色标 */
const RF={CELL:6,V0:1e-3,VMAX:1,SREF:20000,FLOOR:0.3,SOFT:0.15,SOFT_PX:8,key:'',rev:-1,clk:-1,t:0,cv:null,cx:null,img:null,F:null,gw:0,gh:0};
const RF_RAMP=[[0,[40,120,130,0]],[0.12,[40,130,140,70]],[0.4,[70,200,200,140]],[0.7,[150,240,230,190]],[1,[240,255,250,235]]];
const RF_LUT=(function(){const L=new Uint8ClampedArray(256*4);for(let k=0;k<256;k++){const t=k/255;let a=0;while(a<RF_RAMP.length-2&&t>RF_RAMP[a+1][0])a++;
  const p=RF_RAMP[a],q=RF_RAMP[a+1],u=Math.max(0,Math.min(1,(t-p[0])/(q[0]-p[0])));for(let c=0;c<4;c++)L[k*4+c]=Math.round(p[1][c]+(q[1][c]-p[1][c])*u);}return L;})();
function rfT(v){return Math.min(1,Math.log(1+v/RF.V0)/Math.log(1+RF.VMAX/RF.V0));}
function rfBuild(side){
  const CL=RF.CELL,gw=Math.ceil(W/CL)+2,gh=Math.ceil(H/CL)+2;
  if(RF.gw!==gw||RF.gh!==gh){RF.cv=document.createElement('canvas');RF.cv.width=gw;RF.cv.height=gh;RF.cx=RF.cv.getContext('2d');RF.img=RF.cx.createImageData(gw,gh);RF.F=new Float32Array(gw*gh);RF.gw=gw;RF.gh=gh;}
  const F=RF.F,s2=Math.pow(CL/cam.zoom/2,2),cut=RF.V0*0.02;F.fill(0);   // 比一格还小的光斑按一格宽画,峰高不变
  const zs=new Map();for(const z of polys(side))zs.set(z.E,z);
  for(const e of ests(side)){
    const det0=e.C[0]*e.C[2]-e.C[1]*e.C[1];if(!(det0>0))continue;
    const amp=RF.SREF*RF.SREF/Math.sqrt(det0)*estFade(e);if(!(amp>cut))continue;
    const c0=e.C[0]+s2,c1=e.C[1],c2=e.C[2]+s2,det=c0*c2-c1*c1,i00=c2/det,i01=-c1/det,i11=c0/det,z=zs.get(e.E);
    let bx0,by0,bx1,by1,ed=null,w=0,fl=0;
    if(z){w=Math.max(RF.SOFT*Math.sqrt(z.area),RF.SOFT_PX/cam.zoom);fl=RF.FLOOR;ed=[];bx0=by0=1e18;bx1=by1=-1e18;   // 范围 = 多边形外框再放出软边
      const P=z.poly;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],ex=b[0]-a[0],ey=b[1]-a[1],l=Math.hypot(ex,ey);if(l>0)ed.push(a[0],a[1],ey/l,-ex/l);
        bx0=Math.min(bx0,a[0]);by0=Math.min(by0,a[1]);bx1=Math.max(bx1,a[0]);by1=Math.max(by1,a[1]);}
      bx0-=w;by0-=w;bx1+=w;by1+=w;}
    else{const Q=2*Math.log(amp/cut),hx=Math.sqrt(Q*c0),hy=Math.sqrt(Q*c2);bx0=e.m[0]-hx;bx1=e.m[0]+hx;by0=e.m[1]-hy;by1=e.m[1]+hy;}   // 交集为空:只画高斯
    const i0=Math.max(0,Math.floor(((bx0-cam.x)*cam.zoom+W/2)/CL)),i1=Math.min(gw-1,Math.ceil(((bx1-cam.x)*cam.zoom+W/2)/CL));
    const j0=Math.max(0,Math.floor(((by0-cam.y)*cam.zoom+H/2)/CL)),j1=Math.min(gh-1,Math.ceil(((by1-cam.y)*cam.zoom+H/2)/CL));
    for(let j=j0;j<=j1;j++){const y=(j*CL-H/2)/cam.zoom+cam.y,dy=y-e.m[1],r=j*gw;
      for(let i=i0;i<=i1;i++){const x=(i*CL-W/2)/cam.zoom+cam.x,dx=x-e.m[0];let k=1;
        if(ed){let d=-1e18;for(let q=0;q<ed.length;q+=4){const v=(x-ed[q])*ed[q+2]+(y-ed[q+1])*ed[q+3];if(v>d)d=v;}
          if(d>=w)continue;if(d>0){const u=1-d/w;k=u*u*(3-2*u);}}
        const v=amp*k*(fl+(1-fl)*Math.exp(-0.5*(dx*dx*i00+2*dx*dy*i01+dy*dy*i11)));if(v>cut)F[r+i]+=v;}}
  }
  const D=RF.img.data;
  for(let q=0,n=gw*gh;q<n;q++){const k=F[q]>0?Math.round(rfT(F[q])*255)*4:0,o=q*4;D[o]=RF_LUT[k];D[o+1]=RF_LUT[k+1];D[o+2]=RF_LUT[k+2];D[o+3]=RF_LUT[k+3];}
  RF.cx.putImageData(RF.img,0,0);
}
function drawRf(side){ /* 镜头变了当帧重算;听到新的一次或时间走了,最多每 150 ms 重算一次 */
  const key=[cam.x,cam.y,cam.zoom,W,H,side].join('|'),now=performance.now();
  if(key!==RF.key||((RF.rev!==ESMREV||RF.clk!==clock)&&now-RF.t>=150)){RF.key=key;RF.rev=ESMREV;RF.clk=clock;RF.t=now;rfBuild(side);}
  if(!RF.cv)return;
  ctx.imageSmoothingEnabled=true;ctx.drawImage(RF.cv,-RF.CELL/2,-RF.CELL/2,RF.gw*RF.CELL,RF.gh*RF.CELL);
}
function drawPolys(side){ /* 每部听到的敌方雷达一块多边形:越小越亮(√面积 100 万 km 最淡,1 万 km 最亮) */
  for(const z of polys(side)){const s=Math.sqrt(z.area),u=Math.max(0,Math.min(1,Math.log(1e6/s)/Math.log(100))),f=estFade(z);
    ctx.beginPath();for(let i=0;i<z.poly.length;i++){const p=toScreen(z.poly[i][0],z.poly[i][1]);if(i)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1]);}ctx.closePath();
    ctx.fillStyle='rgba(84,224,208,'+((0.05+0.3*u)*f).toFixed(3)+')';ctx.fill();
    ctx.strokeStyle='rgba(84,224,208,'+((0.35+0.5*u)*f).toFixed(3)+')';ctx.lineWidth=1;ctx.stroke();}
}
function dopCol(vr,a){ /* 负 = 在接近:暖;正 = 在远离:冷 */
  const t=Math.max(-1,Math.min(1,vr/600)),b=[232,238,244],e=t<0?[255,120,50]:[80,170,255],u=Math.abs(t);
  return 'rgba('+Math.round(b[0]+(e[0]-b[0])*u)+','+Math.round(b[1]+(e[1]-b[1])*u)+','+Math.round(b[2]+(e[2]-b[2])*u)+','+a.toFixed(2)+')';
}
function retAlpha(r){const age=clock-r.t;return age<RAD.T*1.5?1-0.5*age/(RAD.T*1.5):0.35;}
function drawReturns(side){
  for(const r of RET[side].values()){const p=toScreen(r.pos[0],r.pos[1]);
    if(clock-r.t<RAD.T*0.3){ctx.fillStyle=dopCol(r.vr,0.25);ctx.beginPath();ctx.arc(p[0],p[1],9,0,2*Math.PI);ctx.fill();}
    ctx.fillStyle=dopCol(r.vr,retAlpha(r));ctx.beginPath();ctx.arc(p[0],p[1],3.5,0,2*Math.PI);ctx.fill();}
}
function drawShip(s){
  const p=toScreen(s.pos[0],s.pos[1]),c=sideCol(s.side),v=Math.hypot(s.vel[0],s.vel[1]),a=v>0?Math.atan2(s.vel[1],s.vel[0]):s.dir;
  ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(a);ctx.fillStyle='rgb('+c+')';ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-5,4);ctx.lineTo(-5,-4);ctx.closePath();ctx.fill();
  if(s.flame){ctx.strokeStyle='#ffb040';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-12,0);ctx.stroke();ctx.lineWidth=1;}
  ctx.restore();
  if(radOn(s)){ctx.setLineDash([2,3]);ctx.strokeStyle='rgba('+c+',0.8)';ctx.beginPath();ctx.arc(p[0],p[1],10,0,2*Math.PI);ctx.stroke();ctx.setLineDash([]);}
  if(ships.length<=24)label(s.name,p[0]+10,p[1]-9,'rgba('+c+',0.8)');
  const t=PING.get(s);if(t!==undefined){const u=(performance.now()-t)/700;   // 被敌方雷达扫到:船身上闪一圈
    if(u<1){ctx.strokeStyle='rgba(255,200,80,'+(1-u).toFixed(2)+')';ctx.beginPath();ctx.arc(p[0],p[1],8+18*u,0,2*Math.PI);ctx.stroke();}}
}
function drawIrContact(T,cued){
  const p=toScreen(T.pos[0],T.pos[1]);ctx.strokeStyle=cued?'#54e0d0':'#ffb040';ctx.fillStyle='rgba('+sideCol(T.side)+',0.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(p[0],p[1]-7);ctx.lineTo(p[0]+7,p[1]);ctx.lineTo(p[0],p[1]+7);ctx.lineTo(p[0]-7,p[1]);ctx.closePath();ctx.fill();ctx.stroke();ctx.lineWidth=1;
}
function drawExposure(E,w){ /* 悬停预览(只有选中的那艘、只在悬停时):主瓣锥(被听见)、旁瓣小圈、看得见的弧 */
  const p=toScreen(E.pos[0],E.pos[1]),R=RAD.HEAR*cam.zoom,r=Math.max(2,RAD.SIDE*cam.zoom),Rd=radarRange(w)*cam.zoom;
  sectorPath(ctx,p,R,E.dir,w);ctx.fillStyle='rgba(255,200,80,0.07)';ctx.fill();ctx.setLineDash([6,4]);ctx.strokeStyle='rgba(255,200,80,0.6)';ctx.stroke();
  ctx.beginPath();ctx.arc(p[0],p[1],r,0,2*Math.PI);ctx.stroke();
  ctx.strokeStyle='rgba(232,238,244,0.55)';ctx.beginPath();if(w>=360)ctx.arc(p[0],p[1],Rd,0,2*Math.PI);else ctx.arc(p[0],p[1],Rd,E.dir-w*DEG/2,E.dir+w*DEG/2);ctx.stroke();ctx.setLineDash([]);
  const a=w>=360?-Math.PI/4:E.dir;
  label('主瓣扫到的人在 '+fmtWan(RAD.HEAR)+' 外就听见你',p[0]+Math.cos(a)*R+6,p[1]+Math.sin(a)*R,'#ffc850');
  label('你看得见 '+fmtWan(radarRange(w)),p[0]+Math.cos(a)*Rd+6,p[1]+Math.sin(a)*Rd-12,'#dfe6ec');
  label('旁瓣 '+fmtWan(RAD.SIDE),p[0]+r+4,p[1]+r+12,'#ffc850');
}
function drawHover(side){ /* 读数只在悬停时出:先找 12 像素内的回波点,再找鼠标落在哪一块多边形里 */
  if(S.mx===null)return;
  let br=null,bd=12;
  for(const r of RET[side].values()){const p=toScreen(r.pos[0],r.pos[1]),d=Math.hypot(p[0]-S.mx,p[1]-S.my);if(d<bd){bd=d;br=r;}}
  if(br){const p=toScreen(br.pos[0],br.pos[1]),age=clock-br.t,vr=Math.round(Math.abs(br.vr)),mv=vr<20?'不动':(br.vr<0?'接近 ':'远离 ')+vr+' km/s';
    label(age<RAD.T*1.5?'回波 · '+fmtWan(br.d)+' · '+mv:'旧回波 · '+age.toFixed(0)+' s 前 · 当时 '+mv,p[0]+10,p[1]+14,dopCol(br.vr,1),true);return;}
  const w=worldAt(S.mx,S.my);let bz=null;
  for(const z of polys(side))if(polyIn(z.poly,w)&&(!bz||z.area<bz.area))bz=z;
  if(bz)label(enemyTag(bz.E)+' · '+bz.L+' 艘听到 '+bz.n+' 次 · 区域约 '+fmtWan(Math.sqrt(bz.area))+' 见方'+(bz.fresh?'':' · '+bz.age.toFixed(0)+' s 前'),S.mx+14,S.my-10,'#9ff0e8',true);
}
function handlePos(){const s=S.sel;if(!s||s.w>=360)return null;const p=toScreen(s.pos[0],s.pos[1]);return [p[0]+Math.cos(s.dir)*70,p[1]+Math.sin(s.dir)*70];}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#070a0e';ctx.fillRect(0,0,W,H);drawGrid();
  const v=S.view;
  if(v==='god'){drawCoverage('blue');drawCoverage('red');for(const s of ships)drawShip(s);}
  else{
    drawCoverage(v);drawRf(v);drawReturns(v);
    for(const [T,r] of irView(v))drawIrContact(T,r.cued);
    for(const s of ships)if(s.side===v)drawShip(s);
  }
  const s=S.sel;
  if(s){const p=toScreen(s.pos[0],s.pos[1]);ctx.strokeStyle='#e8eef4';ctx.beginPath();ctx.arc(p[0],p[1],16,0,2*Math.PI);ctx.stroke();
    if(radOn(s))drawRadar(s);
    if(S.hover)drawExposure(s,S.hover.w||s.w);
    const hp=handlePos();if(hp){ctx.strokeStyle='rgba(232,238,244,0.5)';ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(hp[0],hp[1]);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#e8eef4';ctx.beginPath();ctx.arc(hp[0],hp[1],5,0,2*Math.PI);ctx.fill();}}
  if(v!=='god')drawHover(v);
}

/* ---- 读数 ---- */
function readout(){
  const s=S.sel;if(!s)return '';
  const pad=t=>(t+'          ').slice(0,10);
  return s.name+' · 雷达 '+{off:'关',blink:'亮一下',on:'常开'}[s.rm]+' · 扇区 '+s.w+'°\n'+
    '雷达看得见  '+pad(fmtWan(radarRange(s.w)))+'对驱逐舰\n'+
    '主瓣被听见  '+pad(fmtWan(RAD.HEAR))+'旁瓣 '+fmtWan(RAD.SIDE)+'\n'+
    '红外被看见  '+pad(fmtWan(irRange(s)))+(s.flame?'点火':'熄火')+';被顺着光斑盯着看时最远 '+fmtWan(irRange(s)*ESM.CUE_MAX);
}

/* ---- 主循环 ---- */
const PERF={n:0,sum:0,shown:0};let lastT=0;
function frame(now){
  const t0=performance.now(),dt=lastT?Math.min(0.1,(now-lastT)/1000):0;lastT=now;
  if((window.devicePixelRatio||1)!==DPR)resize();
  if(S.speed>0)step(dt*S.speed);
  draw();
  PERF.n++;PERF.sum+=performance.now()-t0;
  if(t0-PERF.shown>250){document.getElementById('perf').textContent='模拟 '+clock.toFixed(0)+' s · 帧 '+(PERF.sum/PERF.n).toFixed(2)+' ms';
    document.getElementById('read').textContent=readout();PERF.n=0;PERF.sum=0;PERF.shown=t0;}
  requestAnimationFrame(frame);
}

/* ---- 交互:左键拖船 / 拖朝向点;只点不拖 = 选中;右键拖平移;滚轮缩放 ---- */
function pickAt(sx,sy){let best=null,bd=12;
  for(const o of ships){if(S.view!=='god'&&o.side!==S.view)continue;const p=toScreen(o.pos[0],o.pos[1]),d=Math.hypot(p[0]-sx,p[1]-sy);if(d<bd){bd=d;best=o;}}
  return best;}
let drag=null,pan=null;
cv.addEventListener('mousedown',function(e){
  if(S.place){if(e.button===0){const w=worldAt(e.clientX,e.clientY);addShip(S.place,w[0],w[1]);}S.place=null;cv.style.cursor='';syncUI();return;}   // 放新船:左键放下,右键取消
  if(e.button===2){pan={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};return;}
  if(e.button!==0)return;
  const hp=handlePos();if(hp&&Math.hypot(hp[0]-e.clientX,hp[1]-e.clientY)<9){drag={aim:true};return;}
  const o=pickAt(e.clientX,e.clientY),w=worldAt(e.clientX,e.clientY);
  drag={o:o,sx:e.clientX,sy:e.clientY,moved:false,ox:o?o.pos[0]-w[0]:0,oy:o?o.pos[1]-w[1]:0};
});
window.addEventListener('mousemove',function(e){
  S.mx=e.clientX;S.my=e.clientY;
  if(pan){cam.x=pan.cx-(e.clientX-pan.sx)/cam.zoom;cam.y=pan.cy-(e.clientY-pan.sy)/cam.zoom;return;}
  if(!drag)return;
  if(drag.aim){const p=toScreen(S.sel.pos[0],S.sel.pos[1]);S.sel.dir=Math.atan2(e.clientY-p[1],e.clientX-p[0]);return;}
  if(!drag.o)return;
  if(!drag.moved&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<=4)return;
  drag.moved=true;const w=worldAt(e.clientX,e.clientY);drag.o.pos[0]=w[0]+drag.ox;drag.o.pos[1]=w[1]+drag.oy;
});
window.addEventListener('mouseup',function(e){
  if(e.button===2)pan=null;
  if(e.button===0&&drag){if(!drag.aim&&!drag.moved){S.sel=drag.o;syncUI();}drag=null;}
});
cv.addEventListener('mouseleave',function(){S.mx=S.my=null;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('wheel',function(e){
  e.preventDefault();const w0=worldAt(e.clientX,e.clientY);
  cam.zoom=Math.max(2e-6,Math.min(0.05,cam.zoom*Math.pow(1.0015,-e.deltaY)));
  const w1=worldAt(e.clientX,e.clientY);cam.x+=w0[0]-w1[0];cam.y+=w0[1]-w1[1];
},{passive:false});

/* ---- 左下角开关 ---- */
function mark(sel,attr,val){for(const x of document.querySelectorAll(sel))x.classList.toggle('on',x.getAttribute(attr)===String(val));}
function syncUI(){
  const s=S.sel;document.getElementById('rowSel').style.display=s?'flex':'none';
  if(s){document.getElementById('selName').textContent=s.name;mark('#selRad [data-rm]','data-rm',s.rm);mark('#selW [data-w]','data-w',s.w);mark('#selFl [data-fl]','data-fl',s.flame);}
  mark('#view [data-v]','data-v',S.view);mark('#speed [data-sp]','data-sp',S.speed);mark('#add [data-add]','data-add',S.place);
  syncFleet();
  document.getElementById('read').textContent=readout();
}
function onClick(id,fn){document.getElementById(id).addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;b.blur();fn(b);syncUI();});}
onClick('selRad',function(b){if(S.sel)setRm(S.sel,b.getAttribute('data-rm'));});
onClick('fleet',function(b){const r=b.closest('.row'),m=b.getAttribute('data-rm');if(!r||!m)return;const i=r.getAttribute('data-i');
  for(const s of i!==null?[ships[+i]]:ships.filter(s=>s.side===r.getAttribute('data-side')))setRm(s,m);});
onClick('selW',function(b){const s=S.sel;if(!s)return;s.w=+b.getAttribute('data-w');s.ph=0;s.swept.clear();});
onClick('selFl',function(b){if(S.sel)S.sel.flame=+b.getAttribute('data-fl');});
onClick('view',function(b){S.view=b.getAttribute('data-v');if(S.sel&&S.view!=='god'&&S.sel.side!==S.view)S.sel=ships.find(s=>s.side===S.view);});
onClick('speed',function(b){S.speed=+b.getAttribute('data-sp');});
onClick('reset',function(){scene();});
onClick('add',function(b){const s=b.getAttribute('data-add');S.place=S.place===s?null:s;cv.style.cursor=S.place?'crosshair':'';});
for(const id of ['selRad','selW']){const el=document.getElementById(id);
  el.addEventListener('mouseover',function(e){const b=e.target.closest('button');if(b)S.hover={w:b.hasAttribute('data-w')?+b.getAttribute('data-w'):null};});
  el.addEventListener('mouseout',function(){S.hover=null;});}

window.addEventListener('resize',function(){resize();syncUI();});
scene();resize();syncUI();requestAnimationFrame(frame);
</script>
</body></html>
