/* ---------- 画法 ---------- */
function path(g,P){g.beginPath();g.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)g.lineTo(P[i][0],P[i][1]);g.closePath();}
function bb(P){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const q of P){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}return {x0,x1,y0,y1};}
function area(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}
function rnd(s){return ()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function partBox(p){
  if(p.p)return bb(p.p);
  if(p.t==='cyl')return {x0:p.x0,x1:p.x1,y0:p.y-Math.max(p.r,p.r1),y1:p.y+Math.max(p.r,p.r1)};
  if(p.t==='tur'){const k=p.k;return {x0:p.x-3*k,x1:p.x+8*k,y0:p.d>0?p.y-3*k:p.y,y1:p.d>0?p.y:p.y+3*k};}
  if(p.t==='eng')return {x0:p.x-5*p.r/1.5,x1:p.x,y0:p.y-p.r*1.4,y1:p.y+p.r*1.4};
  if(p.t==='mast'){let b={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9};for(const l of p.ls){const q=bb(l);b={x0:Math.min(b.x0,q.x0),x1:Math.max(b.x1,q.x1),y0:Math.min(b.y0,q.y0),y1:Math.max(b.y1,q.y1)};}return b;}
  if(p.t==='truss'||p.t==='hatch'||p.t==='rl')return {x0:p.x0,x1:p.x1,y0:Math.min(p.y0,p.y1),y1:Math.max(p.y0,p.y1)};
  if(p.t==='fin')return {x0:p.x0,x1:p.x1,y0:Math.min(p.y0,p.y1),y1:Math.max(p.y0,p.y1)};
  if(p.t==='ssm')return {x0:p.x,x1:p.x+3+p.h*0.55,y0:p.y-p.h,y1:p.y};
  return null;}
function cutOuter(P,c){ // 外侧(离龙骨最远)的角切倒角:装甲块不再是方砖
  const m=Math.max(...P.map(q=>Math.abs(q[1]))),xf=Math.max(...P.filter(q=>Math.abs(q[1])>=m-0.01).map(q=>q[0])),out=[]; // 只切朝前的外角(前缘斜面)
  for(let i=0;i<P.length;i++){const p=P[i];if(Math.abs(p[1])<m-0.01||p[0]<xf-0.01){out.push(p);continue;}
    const a=P[(i-1+P.length)%P.length],n=P[(i+1)%P.length],la=Math.hypot(a[0]-p[0],a[1]-p[1]),ln=Math.hypot(n[0]-p[0],n[1]-p[1]),ta=Math.min(c/la,0.4),tn=Math.min(c/ln,0.4);
    out.push([p[0]+(a[0]-p[0])*ta,p[1]+(a[1]-p[1])*ta],[p[0]+(n[0]-p[0])*tn,p[1]+(n[1]-p[1])*tn]);}
  return out;}
function plate(g,P,base,u,o){ // 一块装甲:竖向顶光渐变 + 朝上的边亮、朝下的边暗 + 接缝 + 风化
  const b=bb(P),cy=(b.y0+b.y1)/2;base=sh(base,cy>0?-Math.min(0.3,cy/22):Math.min(0.06,-cy/120)); // 顶光:腹部整体压暗
  const gr=g.createLinearGradient(0,b.y0,0,b.y1);
  gr.addColorStop(0,css(sh(base,.22)));gr.addColorStop(.45,css(sh(base,0)));gr.addColorStop(1,css(sh(base,-.32)));
  path(g,P);g.fillStyle=gr;g.fill();
  g.save();path(g,P);g.clip();
  if(o.gr!==0){const r=rnd(Math.round((b.x0+77)*131+(b.y0+50)*17)),hh=b.y1-b.y0;
    if(hh>2.6){const y=b.y0+hh*(0.38+r()*0.12);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(b.x0,y,b.x1-b.x0,0.2);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(b.x0,y+0.2,b.x1-b.x0,0.16);}
    for(let i=0;i<(b.x1-b.x0)/7;i++){const w=2+r()*5,h=Math.min(hh*0.3,0.8+r()*1.4),x=b.x0+1+r()*Math.max(0,b.x1-b.x0-w-2),y=b.y0+0.6+r()*Math.max(0,hh-h-1.2);
      g.fillStyle=r()<.6?'rgba(0,0,0,.1)':'rgba(255,255,255,.08)';g.fillRect(x,y,w,h);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x,y+h-0.14,w,0.14);}}
  if(o.seams)for(const x of o.seams){g.fillStyle='rgba(10,12,16,.55)';g.fillRect(x,b.y0,0.28,b.y1-b.y0);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(x+0.28,b.y0,0.22,b.y1-b.y0);}
  if(o.grid){g.strokeStyle='rgba(120,140,160,.35)';g.lineWidth=0.18;g.beginPath();for(let x=b.x0+1.2;x<b.x1;x+=1.2){g.moveTo(x,b.y0);g.lineTo(x,b.y1);}for(let y=b.y0+1.2;y<b.y1;y+=1.2){g.moveTo(b.x0,y);g.lineTo(b.x1,y);}g.stroke();}
  // 边:按外法线朝向
  const s=area(P)>0?1:-1;g.lineWidth=u*1.1;
  for(let i=0;i<P.length;i++){const a=P[i],q=P[(i+1)%P.length],dx=q[0]-a[0],dy=q[1]-a[1],L=Math.hypot(dx,dy)||1,nx=s*dy/L,ny=-s*dx/L;
    if(ny<-0.35)g.strokeStyle=css(sh(base,.55),.9);else if(ny>0.35)g.strokeStyle='rgba(0,0,0,.55)';else if(nx>0.35)g.strokeStyle=css(sh(base,.25),.7);else g.strokeStyle='rgba(0,0,0,.35)';
    g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(q[0],q[1]);g.stroke();}
  g.restore();}
function cylinder(g,x0,x1,y,r,r1,base){const gr=g.createLinearGradient(0,y-Math.max(r,r1),0,y+Math.max(r,r1));
  gr.addColorStop(0,css(sh(base,-.2)));gr.addColorStop(.3,css(sh(base,.55)));gr.addColorStop(.55,css(sh(base,0)));gr.addColorStop(1,css(sh(base,-.55)));
  g.fillStyle=gr;g.beginPath();g.moveTo(x0,y-r);g.lineTo(x1,y-r1);g.lineTo(x1,y+r1);g.lineTo(x0,y+r);g.closePath();g.fill();}
function turret(g,p,u){const k=p.k,d=p.d,y=p.y,x=p.x,base=hx(MAT.L2);
  // 座圈 + 炮塔房(前低后高的楔形)+ 炮管
  const ring=[[x-3*k,y],[x+3.4*k,y],[x+2.8*k,y-d*0.8*k],[x-2.6*k,y-d*0.8*k]];
  const house=[[x-2.6*k,y-d*0.8*k],[x+2.2*k,y-d*0.8*k],[x+3.4*k,y-d*1.7*k],[x+1.2*k,y-d*2.9*k],[x-2.2*k,y-d*2.9*k],[x-2.8*k,y-d*2*k]];
  const by=y-d*1.75*k;cylinder(g,x+2.2*k,x+8*k,by,0.42*k,0.34*k,hx(MAT.M));g.fillStyle=css(hx(MAT.K));g.fillRect(x+7.6*k,by-0.45*k,0.6*k,0.9*k);
  plate(g,ring,hx(MAT.D),u,{gr:0});plate(g,house,base,u,{gr:0});
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(x-1.6*k,y-d*2.2*k-(d>0?0:0.3*k),2.4*k,0.3*k);}
function engine(g,p,u){const r=p.r,x=p.x,y=p.y,L=r*2.6;
  const bell=[[x,y-r*0.95],[x-L,y-r*1.4],[x-L,y+r*1.4],[x,y+r*0.95]];
  const gr=g.createLinearGradient(0,y-r*1.4,0,y+r*1.4);gr.addColorStop(0,css(sh(MAT.D,-.1)));gr.addColorStop(.28,css(sh(MAT.M,.25)));gr.addColorStop(.6,css(hx(MAT.D)));gr.addColorStop(1,css(sh(MAT.K,-.2)));
  path(g,bell);g.fillStyle=gr;g.fill();g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=u;g.stroke();
  for(let i=1;i<4;i++){const xx=x-L*i/4;g.fillStyle='rgba(0,0,0,.35)';g.fillRect(xx,y-r*(0.95+0.45*i/4),0.25,r*2*(0.95+0.45*i/4));}}
function drawShip(g,S,f,u){
  const F=FAC[f],parts=S.parts;
  for(const p of parts){
    if(p.t==='pl'){if(p.s>=0.5&&!p.cp){p.p=cutOuter(p.p,2.2);p.cp=1;}
      if(p.s){g.save();g.globalCompositeOperation='source-atop';path(g,p.p.map(([x,y])=>[x-0.25,y+p.s]));g.fillStyle='rgba(0,0,0,.5)';g.fill();g.restore();}
      if(p.m==='F'){path(g,p.p);g.fillStyle=css(hx(F.c));g.fill();g.save();path(g,p.p);g.clip();g.fillStyle='rgba(255,255,255,.25)';const b=bb(p.p);g.fillRect(b.x0,b.y0,b.x1-b.x0,(b.y1-b.y0)*0.18);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(b.x0,b.y1-(b.y1-b.y0)*0.3,b.x1-b.x0,(b.y1-b.y0)*0.3);g.restore();}
      else plate(g,p.p,hx(MAT[p.m]),u,p);}
    else if(p.t==='rec'){const b=bb(p.p);path(g,p.p);g.fillStyle=css(hx(MAT.K));g.fill();g.save();path(g,p.p);g.clip();
      const gr=g.createLinearGradient(0,b.y0,0,b.y1);gr.addColorStop(0,'rgba(0,0,0,.6)');gr.addColorStop(.35,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(255,255,255,.08)');g.fillStyle=gr;g.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);g.restore();
      g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=u;g.beginPath();g.moveTo(b.x0,b.y1);g.lineTo(b.x1,b.y1);g.stroke();}
    else if(p.t==='cyl')cylinder(g,p.x0,p.x1,p.y,p.r,p.r1,hx(MAT[p.m]));
    else if(p.t==='tur')turret(g,p,u);
    else if(p.t==='eng')engine(g,p,u);
    else if(p.t==='hatch'){const w=(p.x1-p.x0)/p.n;for(let i=0;i<p.n;i++){const x=p.x0+i*w+0.25;plate(g,R(x,p.y0,x+w-0.5,p.y1),hx(MAT.M),u,{gr:0});g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x+w*0.15,(p.y0+p.y1)/2-0.1,w*0.5,0.22);}}
    else if(p.t==='truss'){g.strokeStyle=css(hx(MAT.M));g.lineWidth=0.4;const w=(p.x1-p.x0)/p.n;g.beginPath();g.moveTo(p.x0,p.y0);g.lineTo(p.x1,p.y0);g.moveTo(p.x0,p.y1);g.lineTo(p.x1,p.y1);
      for(let i=0;i<p.n;i++){const x=p.x0+i*w;g.moveTo(x,p.y1);g.lineTo(x+w/2,p.y0);g.lineTo(x+w,p.y1);}g.stroke();}
    else if(p.t==='hz'){path(g,p.p);g.fillStyle=MAT.Y;g.fill();g.save();path(g,p.p);g.clip();const b=bb(p.p);g.fillStyle='#1b1b1b';for(let k=b.x0-(b.y1-b.y0)-2;k<b.x1+2;k+=1.4){g.beginPath();g.moveTo(k,b.y0);g.lineTo(k+0.7,b.y0);g.lineTo(k+0.7+(b.y1-b.y0),b.y1);g.lineTo(k+(b.y1-b.y0),b.y1);g.closePath();g.fill();}g.restore();}
    else if(p.t==='fin'){const d=Math.sign(p.y1-p.y0),P=[[p.x0,p.y0],[p.x1,p.y0],[p.x1-3,p.y1],[p.x0-1.2,p.y1]];plate(g,P,hx(MAT.D),u,{gr:0});
      g.save();path(g,P);g.clip();g.fillStyle='rgba(0,0,0,.45)';for(let i=1;i<=p.n;i++){const y=p.y0+(p.y1-p.y0)*i/(p.n+1);g.fillRect(p.x0,y-0.12,p.x1-p.x0,0.24);}
      g.fillStyle='rgba(255,255,255,.12)';for(let i=1;i<=p.n;i++){const y=p.y0+(p.y1-p.y0)*i/(p.n+1)+0.24*d;g.fillRect(p.x0,y-0.08,p.x1-p.x0,0.16);}g.restore();}
    else if(p.t==='ssm'){const x=p.x,y=p.y,h=p.h,k=0.55,P=[[x,y],[x+3,y],[x+3+h*k,y-h],[x+h*k,y-h]];
      g.save();g.globalCompositeOperation='source-atop';path(g,P.map(([a,c])=>[a-0.2,c+0.6]));g.fillStyle='rgba(0,0,0,.45)';g.fill();g.restore();
      plate(g,P,hx(MAT.M),u,{gr:0});g.fillStyle=css(hx(MAT.K));path(g,[[x+h*k,y-h],[x+3+h*k,y-h],[x+3+h*k-0.25,y-h+0.7],[x+h*k-0.25,y-h+0.7]]);g.fill();
      g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+0.6,y-h*0.45,2,0.22);}
    else if(p.t==='gl'){const y=p.y,gr=g.createLinearGradient(0,y-0.5,0,y+0.5);gr.addColorStop(0,'#5f7d99');gr.addColorStop(.45,'#1c2a38');gr.addColorStop(1,'#0c121a');g.fillStyle=gr;
      g.beginPath();g.moveTo(p.x0,y-0.5);g.lineTo(p.x1,y-0.5);g.lineTo(p.x1+0.5,y+0.5);g.lineTo(p.x0+0.3,y+0.5);g.closePath();g.fill();g.fillStyle='rgba(190,225,255,.5)';g.fillRect(p.x0+0.3,y-0.5,(p.x1-p.x0)*0.4,0.16);}
    else if(p.t==='mast'){g.strokeStyle=css(hx(MAT.M));g.lineWidth=0.45;for(const l of p.ls){g.beginPath();g.moveTo(l[0][0],l[0][1]);for(let i=1;i<l.length;i++)g.lineTo(l[i][0],l[i][1]);g.stroke();}}
  }
  // 窗与灯最后画(发光)
  for(const p of parts){
    if(p.t==='win'){const w=(p.x1-p.x0)/p.n;g.fillStyle='#ffe9bf';g.shadowColor='#ffd890';g.shadowBlur=3;for(let i=0;i<p.n;i++)g.fillRect(p.x0+i*w+w*0.25,p.y-0.35,w*0.5,0.7);g.shadowBlur=0;}
    if(p.t==='rl'){g.fillStyle='#ffe2a0';g.shadowColor='#ffcf70';g.shadowBlur=3;for(let x=p.x0;x<=p.x1+0.01;x+=1.4){g.fillRect(x-0.2,p.y0-0.2,0.4,0.4);g.fillRect(x-0.2,p.y1-0.2,0.4,0.4);}g.shadowBlur=0;}
    if(p.t==='lt'){const c=p.c==='f'?F.lite:'#ffffff';g.fillStyle=c;g.shadowColor=p.c==='f'?F.c:'#ffffff';g.shadowBlur=5;g.beginPath();g.arc(p.x,p.y,0.55,0,6.283);g.fill();g.shadowBlur=0;}}
}
function shipBox(S){let b={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9};for(const p of S.parts){const q=partBox(p);if(!q)continue;b={x0:Math.min(b.x0,q.x0),x1:Math.max(b.x1,q.x1),y0:Math.min(b.y0,q.y0),y1:Math.max(b.y1,q.y1)};}return b;}
function portrait(g,S,f,W,H,D){ // 底栏肖像:离屏画船 → 很淡的阵营背光 + 顶光/腹部压暗 → 尾焰
  const b=shipBox(S),padL=14,pad=4,sc=Math.min((W-padL-pad)/(b.x1-b.x0),(H-pad*2)/(b.y1-b.y0)),cx=padL+(W-padL-pad)/2-(b.x0+b.x1)/2*sc,cy=H/2-(b.y0+b.y1)/2*sc,u=1/(sc*D)*0.9;
  const oc=document.createElement('canvas');oc.width=Math.ceil(W*D);oc.height=Math.ceil(H*D);const o=oc.getContext('2d');o.setTransform(D*sc,0,0,D*sc,cx*D,cy*D);o.lineJoin='round';
  drawShip(o,S,f,u);
  o.setTransform(1,0,0,1,0,0);o.globalCompositeOperation='source-atop';const sy0=(cy+b.y0*sc)*D,sy1=(cy+b.y1*sc)*D,ag=o.createLinearGradient(0,sy0,0,sy1);ag.addColorStop(0,'rgba(255,255,255,.06)');ag.addColorStop(.55,'rgba(0,0,0,0)');ag.addColorStop(1,'rgba(0,0,0,.28)');o.fillStyle=ag;o.fillRect(0,0,oc.width,oc.height);
  const F=FAC[f];g.save();g.shadowColor=F.back+'.45)';g.shadowBlur=6*D;g.drawImage(oc,0,0);g.restore();
  g.save();g.globalCompositeOperation='lighter';const E=hx(F.glow);
  for(const p of S.parts)if(p.t==='eng'){const ex=(cx+(p.x-p.r*2.6)*sc)*D,ey=(cy+p.y*sc)*D,r=p.r*1.25*sc*D,Lp=r*5;
    const rg=g.createRadialGradient(ex,ey,0,ex,ey,r*1.8);rg.addColorStop(0,'rgba(255,255,255,.95)');rg.addColorStop(.3,css(E,.8));rg.addColorStop(1,css(E,0));g.fillStyle=rg;g.beginPath();g.arc(ex,ey,r*1.8,0,6.283);g.fill();
    const pg=g.createLinearGradient(ex,0,ex-Lp,0);pg.addColorStop(0,css(E,.55));pg.addColorStop(1,css(E,0));g.fillStyle=pg;g.beginPath();g.moveTo(ex,ey-r*0.8);g.lineTo(ex-Lp,ey-r*0.25);g.lineTo(ex-Lp,ey+r*0.25);g.lineTo(ex,ey+r*0.8);g.closePath();g.fill();}
  g.restore();}
/* ---------- 页面 ---------- */
const D=window.devicePixelRatio||1,list=document.getElementById('list');
function cv(W,H,k){const c=document.createElement('canvas');c.width=Math.round(W*k*D);c.height=Math.round(H*k*D);c.style.width=W*k+'px';c.style.height=H*k+'px';return c;}
for(const id of ['CL','FF','DD','CA','CV']){const S=SHIPS[id],row=document.createElement('div');row.className='ship';
  row.innerHTML='<div class="t"><b>'+S.name+'</b><span>'+S.sub+'</span></div>';
  const real=document.createElement('div');real.className='real';
  for(const f of ['blue','red']){const bar=document.createElement('div');bar.className='bar';const c=cv(176,60,1);portrait(c.getContext('2d'),S,f,176,60,D);bar.appendChild(c);
    const t=document.createElement('i');t.innerHTML='<b>'+(f==='red'?'敌·':'')+'占位舰名 07</b><span>'+S.name+' · T2</span>';bar.appendChild(t);real.appendChild(bar);}
  row.appendChild(real);const big=cv(176,60,3);big.className='big';portrait(big.getContext('2d'),S,'blue',176*3,60*3,D);row.appendChild(big);list.appendChild(row);}
