  for(let i=0;i<p.gb;i++){const Ln=1.6+r()*3.6,x=x0+1+r()*(x1-x0-Ln-2),w=0.4+r()*yw*0.6,y=yc+(r()*2-1)*(yw-w),h=0.25+r()*0.45,z=zt(x+Ln/2)-0.05;
    add.push(H(x,x+Ln,w,h,Math.min(w,h)*0.5,w*0.85,h,Math.min(w,h)*0.45,{y0:y,z0:z+h,m:r()<0.3?'m':'h2',g:0}));}}S.parts=S.parts.concat(add);}
/* ---------- 面 ---------- */
function facesOf(p){const n=p.s.length,C=avg(p.s.concat(p.b)),out=[];
  const orient=(q,nn)=>{const fc=avg(q);return dot(nn,sub(fc,C))<0?nn.map(v=>-v):nn;};
  for(let i=0;i<n;i++){const j=(i+1)%n,q=[p.s[i],p.b[i],p.b[j],p.s[j]];let nn=crs(sub(q[1],q[0]),sub(q[3],q[0]));if(Math.hypot(...nn)<1e-6)nn=crs(sub(q[2],q[3]),sub(q[3],q[0]));out.push({q,n:nrm(orient(q,nrm(nn))),i});}
  if(p.cap){const q=p.b.slice();let nn=[0,0,0];for(let i=0;i<q.length;i++){const a=q[i],c=q[(i+1)%q.length];nn[0]+=(a[1]-c[1])*(a[2]+c[2]);nn[1]+=(a[2]-c[2])*(a[0]+c[0]);nn[2]+=(a[0]-c[0])*(a[1]+c[1]);} // Newell 法线
    out.push({q,n:nrm(orient(q,nrm(nn))),cap:1});}
  return out;}
function kindOf(n){return n[2]>0.75?'top':n[1]<-0.75?'side':n[0]>0.75?'bow':'bevel';}
function qpath(g,Q){g.beginPath();g.moveTo(Q[0][0],Q[0][1]);for(let i=1;i<Q.length;i++)g.lineTo(Q[i][0],Q[i][1]);g.closePath();}
function faceDetail(g,K,Q3,p,u,fac){ // 面上细节:局部坐标(u 沿舰长、v 沿截面边,世界单位)
  const P=Q3.map(prj),U=Math.hypot(...sub(Q3[1],Q3[0])),V=Math.hypot(...sub(Q3[3],Q3[0]));if(U<1||V<0.35)return;
  const r=rnd(p.seed*7+K.length*13+Math.round(Q3[0][2]*10));
  g.save();qpath(g,P);g.clip();
  g.transform((P[1][0]-P[0][0])/U,(P[1][1]-P[0][1])/U,(P[3][0]-P[0][0])/V,(P[3][1]-P[0][1])/V,P[0][0],P[0][1]);
  const lw=u*1.1,dark=a=>'rgba(0,0,0,'+a+')',lite=a=>'rgba(255,255,255,'+a+')';
  if(p.ring){for(const t of [0.22,0.5,0.76]){g.fillStyle=dark(.45);g.fillRect(U*t,0,lw*1.2,V);g.fillStyle=lite(.18);g.fillRect(U*t+lw*1.2,0,lw,V);}g.restore();return;}
  if(p.rad){for(let x=0.35;x<U;x+=0.75){g.fillStyle=dark(.5);g.fillRect(x,0,lw,V);g.fillStyle='rgba(150,165,180,.28)';g.fillRect(x+lw,0,lw*0.8,V);}g.restore();return;} // 散热片肋条
  if(p.grid){g.strokeStyle='rgba(120,170,220,.38)';g.lineWidth=lw*0.8;g.beginPath();for(let x=0.6;x<U;x+=1)g.moveTo(x,0),g.lineTo(x,V);for(let y=0.6;y<V;y+=1)g.moveTo(0,y),g.lineTo(U,y);g.stroke();
    g.fillStyle='rgba(140,200,255,.12)';g.fillRect(0,0,U,V*0.3);g.restore();return;} // 感知阵列网格
  if(!p.g){g.restore();return;}
  if(K==='side'){const x0=p.s[0][0];
    if(p.belt){g.fillStyle='#4b5158';g.fillRect(p.belt[0]-x0,V*0.3,p.belt[1]-p.belt[0],V*0.26);for(let x=p.belt[0]-x0+1.5;x<p.belt[1]-x0;x+=3){g.fillStyle=dark(.45);g.fillRect(x,V*0.3,lw,V*0.26);}
      g.fillStyle=lite(.22);g.fillRect(p.belt[0]-x0,V*0.3,p.belt[1]-p.belt[0],lw);g.fillStyle=dark(.5);g.fillRect(p.belt[0]-x0,V*0.56,p.belt[1]-p.belt[0],lw);}
    if(p.hangar){for(let x=p.hangar[0]-x0;x<p.hangar[1]-x0-5;x+=7.2){g.fillStyle='#30363c';g.fillRect(x,V*0.14,6.4,V*0.66);
      for(let k=1;k<4;k++){g.fillStyle=dark(.5);g.fillRect(x+k*1.6,V*0.14,lw,V*0.66);}g.fillStyle=lite(.18);g.fillRect(x,V*0.14,6.4,lw);
      g.fillStyle='#ffd9a0';g.shadowColor='#ffc870';g.shadowBlur=3;g.fillRect(x+0.2,V*0.76,6,V*0.035);g.shadowBlur=0;}}
    let x=0;while(x<U){const w=Math.min(U-x,2.2+r()*4.5),t=r();
      if(t<0.38){g.fillStyle=t<0.2?dark(.12):lite(.1);g.fillRect(x+0.35,V*0.14,w-0.7,V*0.72);g.fillStyle=dark(.25);g.fillRect(x+0.35,V*0.14,w-0.7,lw);}
      else if(t<0.5&&w>2){g.fillStyle=dark(.5);g.fillRect(x+0.5,V*0.3,w-1,V*0.2);}
      g.fillStyle=dark(.36);g.fillRect(x+w-lw,0,lw,V);g.fillStyle=lite(.13);g.fillRect(x+w,0,lw*0.8,V);x+=w;}
    g.fillStyle=dark(.3);g.fillRect(0,V*0.6,U,lw);g.fillStyle=lite(.14);g.fillRect(0,V*0.6-lw,U,lw*0.8);
    for(let i=0;i<p.slots;i++){const a=r()*(U-8),w=3+r()*5,y=V*(0.66+r()*0.12);g.fillStyle='#1b1f24';g.fillRect(a,y,w,V*0.12);
      g.fillStyle='#ffe2ad';for(let k=a+0.6;k<a+w-0.4;k+=0.9)if(r()<0.7)g.fillRect(k,y+V*0.04,0.4,V*0.05);}
    if(r()<0.5){g.fillStyle='#b8392f';g.fillRect(U*(0.2+r()*0.5),V*0.22,0.9,0.45);}
    if(p.stripe){g.fillStyle=css(hx(fac.c),.95);g.fillRect(p.stripe[0]-x0,0,1.4,V);g.fillRect(p.stripe[1]-x0,0,0.6,V);
      const ex=p.stripe[1]-x0+2.2,ey=V*0.36,es=Math.min(1.1,V*0.16);g.fillStyle=css(hx(fac.c),.95);g.beginPath(); // 阵营小徽记:蓝 = 箭头(同地图我方记号)、红 = 菱形
      if(fac.em==='chev'){g.moveTo(ex-es,ey-es*0.8);g.lineTo(ex+es,ey);g.lineTo(ex-es,ey+es*0.8);g.lineTo(ex-es*0.4,ey);}else{g.moveTo(ex,ey-es);g.lineTo(ex+es*0.8,ey);g.lineTo(ex,ey+es);g.lineTo(ex-es*0.8,ey);}g.closePath();g.fill();}
    if(p.dock)for(const dx of p.dock){const a=dx-x0;g.fillStyle='#d6a52a';g.fillRect(a,V*0.22,2.6,V*0.56);g.save();g.beginPath();g.rect(a,V*0.22,2.6,V*0.56);g.clip();g.fillStyle='#1c1c1c';
      for(let k=a-V;k<a+3.6;k+=0.7){g.beginPath();g.moveTo(k,V*0.22);g.lineTo(k+0.35,V*0.22);g.lineTo(k+0.35+V*0.56,V*0.78);g.lineTo(k+V*0.56,V*0.78);g.closePath();g.fill();}g.restore();
      g.fillStyle='#2a2f35';g.fillRect(a+0.35,V*0.3,1.9,V*0.4);g.fillStyle=lite(.15);g.fillRect(a+0.35,V*0.3,1.9,lw);}
    if(p.lt){const a=U*0.12,w=U*0.76,y=V*0.22,h=V*0.42;g.fillStyle='#1a2530';g.fillRect(a,y,w,h);g.fillStyle='rgba(150,200,240,.35)';g.fillRect(a,y,w,lw*1.2);
      g.fillStyle='#ffe6b8';g.shadowColor='#ffd08a';g.shadowBlur=2;for(let k=a+0.5;k<a+w-0.4;k+=0.8)if(r()<0.75)g.fillRect(k,y+h*0.35,0.35,h*0.35);g.shadowBlur=0;}
    if(p.bay){g.fillStyle='#14181d';g.fillRect(U-7,V*0.12,6.2,V*0.72);g.fillStyle='#ffd27a';for(let k=U-6.6;k<U-1;k+=1.1){g.fillRect(k,V*0.18,0.35,0.3);g.fillRect(k,V*0.76,0.35,0.3);}}
  }else if(K==='top'&&p.deck){ // 飞行甲板:跑道带 + 中线虚线 + 弹射轨 + 升降台 + 舰艏箭头
    g.fillStyle=dark(.14);g.fillRect(0,0,U,V);
    for(let x=4;x<U;x+=6){g.fillStyle=dark(.22);g.fillRect(x,0,lw,V);}
    g.fillStyle='rgba(40,46,54,.55)';g.fillRect(U*0.08,V*0.36,U*0.9,V*0.28);
    g.fillStyle='rgba(235,240,245,.75)';for(let x=U*0.1;x<U*0.95;x+=2.4)g.fillRect(x,V*0.495,1.2,lw*1.4);
    g.fillRect(U*0.08,V*0.36,U*0.9,lw);g.fillRect(U*0.08,V*0.64-lw,U*0.9,lw);
    for(const vy of [0.2,0.8]){g.fillStyle=dark(.55);g.fillRect(U*0.6,V*vy,U*0.38,lw*1.6);g.fillStyle='#ffd27a';g.fillRect(U*0.97,V*vy-0.15,0.5,0.3);}
    for(const ux of [0.14,0.34]){const a=U*ux,w=6,h=V*0.22;for(const vy of [0.08,0.7]){g.fillStyle=lite(.08);g.fillRect(a,V*vy,w,h);g.strokeStyle=dark(.45);g.lineWidth=lw;g.strokeRect(a,V*vy,w,h);
      g.fillStyle='#d6a52a';g.fillRect(a,V*vy,0.8,0.25);g.fillRect(a+w-0.8,V*vy+h-0.25,0.8,0.25);}}
    g.fillStyle='rgba(235,240,245,.7)';for(let k=0;k<3;k++){const x=U*0.84+k*1.8;g.beginPath();g.moveTo(x,V*0.4);g.lineTo(x+1.2,V*0.5);g.lineTo(x,V*0.6);g.lineTo(x+0.4,V*0.5);g.closePath();g.fill();}
  }else if(K==='top'){
    g.fillStyle=dark(.2);g.fillRect(0,V*0.5-lw/2,U,lw);
    let x=0;while(x<U){const w=Math.min(U-x,2+r()*5);if(r()<0.4){g.fillStyle=r()<0.5?lite(.1):dark(.1);g.fillRect(x+0.3,r()<0.5?0.25:V*0.5+0.2,w-0.6,V*0.5-0.45);}
      g.fillStyle=dark(.22);g.fillRect(x+w-lw,0,lw,V);x+=w;}
    if(r()<0.6){g.fillStyle=dark(.45);const a=r()*(U-3);g.fillRect(a,V*0.15,1.2+r()*2,V*0.25);}
    if(p.edge){g.fillStyle='#bfe2ff';g.shadowColor='#8fcaff';g.shadowBlur=2;for(let x=1;x<U-0.5;x+=1.6){g.fillRect(x,V*0.04,0.4,0.25);g.fillRect(x,V*0.92,0.4,0.25);}g.shadowBlur=0;} // 飞行甲板边缘灯
  }else if(K==='bevel'){let x=0;while(x<U){const w=Math.min(U-x,3+r()*6);g.fillStyle=dark(.25);g.fillRect(x+w-lw,0,lw,V);x+=w;}
    if(p.stripe){const x0=p.s[0][0];g.fillStyle=css(hx(fac.c),.95);g.fillRect(p.stripe[0]-x0,0,1.4,V);g.fillRect(p.stripe[1]-x0,0,0.6,V);}}
  g.restore();}
function drawShip(g,S,fac,u){
  const key=p=>{const P=p.s.concat(p.b),c=avg(P);return 0.05*c[0]-c[1]+PB*c[2]+0.8*Math.min(...P.map(q=>q[2]));}; // 底面高的(叠在上面的)、离观者近的后画;舰长方向只做微调(长件按中心排会盖住别人) // 离观者越近越后画
  const list=S.parts.slice().sort((a,b)=>key(a)-key(b));
  for(const p of list){const base=hx(MAT[p.m]),FS=facesOf(p).filter(F=>dot(F.n,VD)<0);
    // 落影:整个部件的投影往下挪一点,只压在已经画了的东西上
    if(!p.nz&&!p.lip){g.save();g.globalCompositeOperation='source-atop';g.fillStyle='rgba(0,0,0,.3)';for(const F of FS){qpath(g,F.q.map(prj).map(q=>[q[0]+0.4,q[1]+1]));g.fill();}g.restore();}
    for(const F of FS){const K=F.cap?'bow':kindOf(F.n),lam=Math.max(0,dot(F.n,LIT)),k=-0.5+lam*0.7+(K==='top'?0.04:0);
      const P=F.q.map(prj),col=sh(base,k);
      qpath(g,P);if(K==='side'){const y0=Math.min(...P.map(q=>q[1])),y1=Math.max(...P.map(q=>q[1])),gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,css(sh(col,.12)));gr.addColorStop(1,css(sh(col,-.28)));g.fillStyle=gr;}else g.fillStyle=css(col);g.fill();
      faceDetail(g,K,F.q,p,u,fac);
      qpath(g,P);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=u*0.9;g.stroke();
      if(lam>0.85){g.strokeStyle=css(sh(col,.55),.7);g.lineWidth=u*0.8;g.beginPath();g.moveTo(P[0][0],P[0][1]);g.lineTo(P[1][0],P[1][1]);g.stroke();}
      if(p.nz&&!F.cap){g.save();g.globalCompositeOperation='lighter';g.strokeStyle=css(hx(fac.glow),.85);g.lineWidth=u*2.2;g.beginPath();g.moveTo(P[0][0],P[0][1]);g.lineTo(P[3][0],P[3][1]);g.stroke();g.restore();}}}
}
function shipBox(S){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of S.parts)for(const q of p.s.concat(p.b)){const v=prj(q);x0=Math.min(x0,v[0]);x1=Math.max(x1,v[0]);y0=Math.min(y0,v[1]);y1=Math.max(y1,v[1]);}return {x0,x1,y0,y1};}
function portrait(g,S,f,W,H,D){
  const b=shipBox(S),padL=16,pad=4,sc=Math.min((W-padL-pad)/(b.x1-b.x0),(H-pad*2)/(b.y1-b.y0)),cx=padL+(W-padL-pad)/2-(b.x0+b.x1)/2*sc,cy=H/2-(b.y0+b.y1)/2*sc,u=0.9/(sc*D);
  const F=FAC[f],E=hx(F.glow);
  // 尾焰在船下面:从每个喷口中心往后
  g.save();g.globalCompositeOperation='lighter';
  for(const p of S.parts)if(p.nz){const c=prj(avg(p.s)),ex=(cx+c[0]*sc)*D,ey=(cy+c[1]*sc)*D,R=Math.hypot(...sub(p.s[0],avg(p.s)))*ZK*sc*D,Lp=R*5.5;
    const rg=g.createRadialGradient(ex,ey,0,ex,ey,R*1.4);rg.addColorStop(0,'rgba(255,255,255,.85)');rg.addColorStop(.35,css(E,.55));rg.addColorStop(1,css(E,0));g.fillStyle=rg;g.beginPath();g.arc(ex,ey,R*1.4,0,6.283);g.fill();
    const pg=g.createLinearGradient(ex,0,ex-Lp,0);pg.addColorStop(0,css(E,.38));pg.addColorStop(1,css(E,0));g.fillStyle=pg;g.beginPath();g.moveTo(ex,ey-R*0.75);g.lineTo(ex-Lp,ey-R*0.15);g.lineTo(ex-Lp,ey+R*0.15);g.lineTo(ex,ey+R*0.75);g.closePath();g.fill();}
  g.restore();
  const oc=document.createElement('canvas');oc.width=Math.ceil(W*D);oc.height=Math.ceil(H*D);const o=oc.getContext('2d');o.setTransform(D*sc,0,0,D*sc,cx*D,cy*D);o.lineJoin='round';
  drawShip(o,S,F,u);
  g.save();g.shadowColor=F.back+'.3)';g.shadowBlur=4*D;g.drawImage(oc,0,0);g.restore();
  g.save();g.globalCompositeOperation='lighter'; // 航行灯:舰艏白、桅顶阵营色、舰艉左红右绿
  for(const [x,y,z,c] of S.lt||[]){const v=prj([x,y,z]),px=(cx+v[0]*sc)*D,py=(cy+v[1]*sc)*D,col=c==='w'?[255,255,255]:c==='r'?[255,90,80]:c==='g'?[110,255,150]:hx(F.lite),R=Math.max(0.7,0.32*sc)*D;
    const rg=g.createRadialGradient(px,py,0,px,py,R*2.2);rg.addColorStop(0,css(col,.95));rg.addColorStop(.3,css(col,.5));rg.addColorStop(1,css(col,0));g.fillStyle=rg;g.beginPath();g.arc(px,py,R*2.2,0,6.283);g.fill();}
  g.restore();}
/* ---------- 页面 ---------- */
const D=window.devicePixelRatio||1,list=document.getElementById('list');
function cv(W,H,k){const c=document.createElement('canvas');c.width=Math.round(W*k*D);c.height=Math.round(H*k*D);c.style.width=W*k+'px';c.style.height=H*k+'px';return c;}
for(const id of ['CL','FF','DD','CA','BB','CV']){const S=SHIPS[id],row=document.createElement('div');row.className='ship';
  row.innerHTML='<div class="t"><b>'+S.name+'</b></div>';
  const real=document.createElement('div');real.className='real';
  for(const f of ['blue','red']){const bar=document.createElement('div');bar.className='bar';const c=cv(176,60,1);portrait(c.getContext('2d'),S,f,176,60,D);bar.appendChild(c);
    const t=document.createElement('i');t.innerHTML='<b>'+(f==='red'?'敌·':'')+'占位舰名 07</b><span>'+S.name+' · T2</span>';bar.appendChild(t);real.appendChild(bar);}
  row.appendChild(real);const big=cv(176,60,3);big.className='big';portrait(big.getContext('2d'),S,'blue',176*3,60*3,D);row.appendChild(big);list.appendChild(row);}
