const FLIP=p=>p.map(([x,y])=>[x,-y]);
const S2=(t,p)=>[{t,p},{t,p:FLIP(p)}]; // 左右一对
const H=p=>({t:'H',p}),G=p=>({t:'G',p}),RD=p=>({t:'R',p}),PL=p=>({t:'P',p}),DK=p=>({t:'K',p}),GL=p=>({t:'L',p}),LN=p=>({t:'N',p}),DE=p=>({t:'D',p});
const ZZ=(x0,x1,hw,st)=>{const o=[];let k=0;for(let x=x0;x<=x1+1e-9;x+=st,k++)o.push([x,k%2?hw:-hw]);return LN(o);}; // 桁架斜撑
const GRID=(x0,y0,x1,y1,nx,ny)=>{const o=[];for(let i=1;i<nx;i++){const x=x0+(x1-x0)*i/nx;o.push(LN([[x,y0],[x,y1]]));}for(let j=1;j<ny;j++){const y=y0+(y1-y0)*j/ny;o.push(LN([[x0,y],[x1,y]]));}return o;};

/* ===== 画一艘 ===== */
function path(g,p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();}
function poly(g,p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);}
function drawShip(g,des,pal,sc,x,y,ang,full){ // sc = 像素 / 单位;full = 大图(带细节),否则按地图舰标的画法
  g.save();g.translate(x,y);g.rotate(ang);g.scale(sc,sc);g.lineJoin='miter';g.miterLimit=4;
  const solid=des.parts.filter(p=>p.t==='H'||p.t==='G'||p.t==='R');
  if(!full){ // 地图舰标:实心阵营色 + 一圈暗边,够大时补一条中线;舰尾一点亮
    g.strokeStyle=pal.iconLine;g.lineWidth=1.6/sc;for(const p of solid){path(g,p.p);g.stroke();}
    g.fillStyle=pal.icon;for(const p of solid){path(g,p.p);g.fill();}
    if(sc*des.L>=30){g.strokeStyle=pal.iconLine;g.lineWidth=0.8/sc;g.globalAlpha=0.6;for(const p of des.parts)if(p.t==='K'){path(g,p.p);g.stroke();}g.globalAlpha=1;}
    g.fillStyle=pal.glow;for(const p of des.parts)if(p.t==='L'){path(g,p.p);g.fill();}
    g.restore();return;}
  g.strokeStyle=pal.edge;g.lineWidth=2.6/sc;for(const p of solid){path(g,p.p);g.stroke();} // 外轮廓:先描粗边再填色,只剩并集的外沿
  for(const p of solid){path(g,p.p);g.fillStyle=p.t==='G'?pal.gun:(p.t==='R'?pal.rad:pal.base);g.fill();}
  for(const p of des.parts)if(p.t==='P'){path(g,p.p);g.fillStyle=pal.plate;g.fill();if(ST.det){g.strokeStyle=pal.line;g.lineWidth=1/sc;g.stroke();}}
  for(const p of des.parts)if(p.t==='K'){path(g,p.p);g.fillStyle=pal.dark;g.fill();}
  if(ST.det){
    for(const p of des.parts)if(p.t==='R'){g.save();path(g,p.p);g.clip();g.strokeStyle=pal.radLine;g.lineWidth=0.8/sc;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const q of p.p){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}
      g.beginPath();for(let xx=Math.ceil(x0/1.6)*1.6;xx<x1;xx+=1.6){g.moveTo(xx,y0);g.lineTo(xx,y1);}g.stroke();g.restore();path(g,p.p);g.strokeStyle=pal.line;g.lineWidth=1/sc;g.stroke();}
    g.strokeStyle=pal.line;g.lineWidth=1/sc;for(const p of des.parts)if(p.t==='N'){poly(g,p.p);g.stroke();}
    g.strokeStyle=pal.deck;g.setLineDash([3/sc*2,3/sc*2]);for(const p of des.parts)if(p.t==='D'){poly(g,p.p);g.stroke();}g.setLineDash([]);
    for(const p of des.parts)if(p.t==='G'){path(g,p.p);g.strokeStyle=pal.edge;g.lineWidth=0.8/sc;g.stroke();}}
  for(const p of des.parts)if(p.t==='L'){path(g,p.p);g.fillStyle=pal.glow;g.shadowColor=pal.glow;g.shadowBlur=6;g.fill();g.shadowBlur=0;}
  g.restore();
}
function setup(c,w,h){const d=window.devicePixelRatio||1;c.width=Math.round(w*d);c.height=Math.round(h*d);c.style.width=w+'px';c.style.height=h+'px';const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return g;}
function bg(g,w,h,step){g.fillStyle='#070a10';g.fillRect(0,0,w,h);if(!ST.grid)return;g.fillStyle='rgba(90,120,160,.10)';for(let x=step;x<w;x+=step)g.fillRect(Math.round(x),0,1,h);for(let y=step;y<h;y+=step)g.fillRect(0,Math.round(y),w,1);}

/* ===== 页面 ===== */
const BW=240,BH=150,BIG=2.15; // 大图:同一比例(像素 / 单位)
const cells=[];
function build(){const root=document.getElementById('groups');root.innerHTML='';cells.length=0;
  for(const gp of GROUPS){const div=document.createElement('div');div.className='grp';div.innerHTML='<h2><b>'+gp.id+'</b>'+gp.name+'</h2><div class="d">'+gp.d+'</div>';const row=document.createElement('div');row.className='row';div.appendChild(row);
    for(const [k,nm] of CLS){const c=document.createElement('div');c.className='cell';const cap=document.createElement('div');cap.className='cap';cap.innerHTML='<b>'+nm+'</b>'+gp.name+' · '+k;
      const big=document.createElement('canvas'),sm=document.createElement('canvas');c.appendChild(cap);c.appendChild(big);c.appendChild(sm);row.appendChild(c);cells.push({gp,k,big,sm});}
    root.appendChild(div);}
  drawCells();}
function drawCells(){const pal=PAL[ST.f];
  for(const c of cells){const des=c.gp.ships[c.k],g=setup(c.big,BW,BH);bg(g,BW,BH,20);drawShip(g,des,pal,BIG,BW/2+2,BH/2,0,true);
    const s=setup(c.sm,BW,46);s.fillStyle='#070a10';s.fillRect(0,0,BW,46);let x=8;
    for(const len of [16,24,36]){const sc=len/des.L;drawShip(s,des,pal,sc,x+len/2,23,0,false);x+=len+16;}
    drawShip(s,des,pal,36/des.L,x+22,23,-0.5,false);
    s.fillStyle='#3b4a5c';s.font='10px Consolas';s.fillText('16 / 24 / 36 px',BW-86,42);}}
const mapC=document.getElementById('map');let MW=1100,MH=420,mg;
function layoutMap(){MW=Math.min(1300,Math.max(700,window.innerWidth-34));mg=setup(mapC,MW,MH);}
function drawMap(t){mg.fillStyle='#070a10';mg.fillRect(0,0,MW,MH);mg.fillStyle='rgba(90,120,160,.08)';for(let x=40;x<MW;x+=40)mg.fillRect(x,0,1,MH);for(let y=40;y<MH;y+=40)mg.fillRect(0,y,MW,1);
  const sc=0.45,rowH=MH/GROUPS.length;
  GROUPS.forEach((gp,i)=>{const cy=rowH*(i+0.5);mg.fillStyle='#4a5a6e';mg.font='11px "Microsoft YaHei"';mg.fillText(gp.id+' '+gp.name,8,cy-rowH*0.32);
    for(const side of ['blue','red']){const dir=side==='blue'?1:-1,base=side==='blue'?MW*0.28:MW*0.72;
      ['FF','DD','CA','CV'].forEach((k,j)=>{const des=gp.ships[k],a=(side==='blue'?0:Math.PI)+0.45*Math.sin(t/2600+i*1.3+j*0.7)*dir; // 四艘横排,各自慢慢转向
        drawShip(mg,des,PAL[side],sc,base+(j-1.5)*72*dir,cy+4,a,false);});}});}
function frame(t){drawMap(t);requestAnimationFrame(frame);}
for(const b of document.querySelectorAll('[data-f]'))b.onclick=()=>{ST.f=b.dataset.f;for(const x of document.querySelectorAll('[data-f]'))x.classList.toggle('on',x===b);drawCells();};
document.getElementById('det').onclick=e=>{ST.det=!ST.det;e.target.classList.toggle('on',ST.det);drawCells();};
document.getElementById('grid').onclick=e=>{ST.grid=!ST.grid;e.target.classList.toggle('on',ST.grid);drawCells();};
window.addEventListener('resize',layoutMap);
build();layoutMap();requestAnimationFrame(frame);
</script>
