<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>底部栏样板</title>
<style>
/* 配色、字号、控件基座照抄 css/app.css 的 token,不另起一套 */
:root{
  --void:#05070c;--srf-panel:rgba(9,13,20,.94);--srf-modal:#0a0e16;--srf-raise:#0e1420;--srf-hover:#16202f;--srf-sunk:#0a0f17;
  --line-hair:#141c27;--line:#1e2836;--line-ctl:#2a3a50;--line-acc:#34527d;
  --txt-hi:#e8eef7;--txt:#c7d0dc;--txt-read:#dbe6f2;--txt-dim:#6a7d92;--txt-mute:#46566a;--ink:#03121e;
  --acc:#5aa7ff;--acc-lite:#9fd4ff;--acc-wash:rgba(90,167,255,.14);
  --state-active:#54e0d0;--state-warn:#ff9a55;--state-ok:#3fbf6f;--state-danger:#ff6b6b;--env-sun:#ffd26e;--lance:#c9a2ff;
  --r-sm:2px;--r-md:3px;
  --ff-ui:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;--ff-mono:Consolas,"Cascadia Mono",monospace;
  --fs-micro:10px;--fs-label:11px;--fs-body:12px;--fs-read:13px;--fs-title:15px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--txt);font-family:var(--ff-ui);overflow:hidden}
canvas#map{position:fixed;inset:0;width:100%;height:100%;display:block}
body.pin canvas#map{cursor:crosshair}
.panel{position:fixed;background:var(--srf-panel);border:1px solid var(--line);border-radius:var(--r-md)}
.kb{font-family:var(--ff-mono);font-size:var(--fs-micro);color:var(--txt-mute);border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:0 3px;line-height:14px;height:15px}

/* ---------- 说明面板(样板专用,游戏里没有) ---------- */
#note{left:10px;top:10px;width:300px;padding:10px 12px;font-size:var(--fs-label);line-height:1.6;color:var(--txt-dim)}
#note h1{font-size:var(--fs-body);color:var(--txt-hi);font-weight:normal;margin:0 0 6px;letter-spacing:.06em}
#note .row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
#note button{font:inherit;font-size:var(--fs-label);color:var(--txt-dim);background:var(--srf-raise);border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:2px 8px;cursor:pointer}
#note button:hover{color:var(--txt-hi);border-color:var(--line-acc)}
#note button.on{color:var(--acc);border-color:var(--acc);background:var(--acc-wash)}
#note input[type=range]{width:120px;accent-color:var(--acc)}
#note .v{font-family:var(--ff-mono);color:var(--txt-read)}

/* ---------- 底部指挥条 ---------- */
#bar{left:50%;bottom:10px;transform:translateX(-50%);width:min(1180px,calc(100% - 20px));
  display:grid;grid-template-columns:150px 1px 330px 1px minmax(0,1fr) 1px 64px;column-gap:10px;align-items:stretch;padding:8px 10px;user-select:none}
#bar .sep{background:var(--line-ctl);margin:2px 0}

/* 身份 */
#idBlk{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
#idBlk .nm{display:flex;align-items:baseline;gap:6px;min-width:0}
#idBlk .nm b{font-size:var(--fs-title);font-weight:normal;color:var(--txt-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#idBlk .nm i{font-style:normal;font-size:var(--fs-label);color:var(--txt-dim);white-space:nowrap}
#idBlk .hp{height:4px;background:var(--srf-sunk);border-radius:2px;overflow:hidden}
#idBlk .hp i{display:block;height:100%;background:var(--state-ok)}
#idBlk .ln{display:flex;justify-content:space-between;font-size:var(--fs-label);color:var(--txt-dim)}
#idBlk .ln b{font-family:var(--ff-mono);font-weight:normal;color:var(--txt-read)}

/* 感知三行 */
#sense{display:grid;grid-template-rows:repeat(3,22px);row-gap:4px;align-content:center}
.srow{display:grid;grid-template-columns:52px auto 1fr;align-items:center;column-gap:8px}
.srow .lb{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:var(--fs-label);color:var(--txt-dim);letter-spacing:.08em}
.seg{display:inline-flex}
.seg button{font:inherit;font-size:var(--fs-body);height:22px;min-width:40px;padding:0 6px;background:var(--srf-raise);color:var(--txt-dim);
  border:1px solid var(--line-ctl);margin-left:-1px;border-radius:0;cursor:pointer;position:relative}
.seg button:first-child{margin-left:0;border-radius:var(--r-sm) 0 0 var(--r-sm)}
.seg button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.seg button:hover{color:var(--txt-hi);border-color:var(--line-acc);z-index:1}
.seg button.on{color:var(--acc);border-color:var(--acc);background:var(--acc-wash);z-index:2}
.seg button.mix{border-style:dashed;color:var(--txt)}
.seg.dim button.on{color:var(--txt-dim);border-color:var(--line-acc);background:transparent}
.seg button.warn.on{color:var(--state-warn);border-color:var(--state-warn);background:rgba(255,154,85,.12)}
.srow .rt{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.chip{font:inherit;font-size:var(--fs-label);height:22px;padding:0 7px;background:transparent;color:var(--txt-dim);border:1px solid var(--line-ctl);border-radius:var(--r-sm);
  cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip:hover{color:var(--txt-hi);border-color:var(--line-acc)}
.chip.pin{color:var(--env-sun);border-color:rgba(255,210,110,.55)}
.chip.arm{color:var(--ink);background:var(--acc);border-color:var(--acc)}
.chip.down{color:var(--state-danger);border-color:rgba(255,107,107,.6);cursor:default}
.xp{font-family:var(--ff-mono);font-size:var(--fs-label);color:var(--txt-dim);white-space:nowrap}
.xp b{font-weight:normal;color:var(--txt-read)}

/* 武器 */
#wpn{display:flex;align-items:center;gap:8px;min-width:0}
.fc{height:64px;width:50px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--srf-raise);border:1px solid var(--line-ctl);border-radius:var(--r-md);cursor:pointer}
.fc .l{font-size:var(--fs-body);color:var(--txt-dim)}
.fc .s{font-size:var(--fs-label);letter-spacing:.3em;margin-right:-.3em;color:var(--txt-mute)}
.fc:hover{border-color:var(--line-acc)}.fc:hover .l{color:var(--txt-hi)}
.fc.on{border-color:var(--state-active);background:rgba(84,224,208,.08)}.fc.on .l{color:var(--txt-hi)}.fc.on .s{color:var(--state-active)}
.cards{display:flex;gap:6px;min-width:0;flex:1}
.card{flex:1 1 92px;min-width:80px;max-width:108px;height:64px;display:grid;grid-template-rows:16px 6px 1fr;row-gap:4px;padding:5px 7px 4px;
  background:var(--srf-raise);border:1px solid var(--line-ctl);border-radius:var(--r-md);cursor:pointer;position:relative}
.card:hover{border-color:var(--line-acc);background:var(--srf-hover)}
.card.auto{border-color:var(--acc);box-shadow:inset 0 0 0 1px rgba(90,167,255,.25)}
.card.auto::after{content:"";position:absolute;left:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.card.off{opacity:.55}
.card .hd{display:flex;justify-content:space-between;align-items:center;padding-left:6px}
.card .hd b{font-size:var(--fs-body);font-weight:normal;color:var(--txt-hi)}
.card .pb{height:4px;margin-top:1px;background:var(--srf-sunk);border-radius:2px;overflow:hidden;display:flex;gap:2px}
.card .pb i{display:block;height:100%;background:var(--state-ok);border-radius:1px}
.card .pb.seg2 i{flex:1;background:var(--line-ctl)}.card .pb.seg2 i.r{background:var(--state-ok)}
.card .st{font-size:var(--fs-label);line-height:1.25;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st b{font-family:var(--ff-mono);font-weight:normal;color:var(--txt-read)}
.card .st .w{color:var(--state-warn)}.card .st .ok{color:var(--state-ok)}.card .st .lz{color:var(--lance)}
.card.flash{animation:fl .35s ease-out}
@keyframes fl{from{background:var(--acc-wash);border-color:var(--acc-lite)}to{}}

/* 舰队动作 */
#fleet{display:flex;flex-direction:column;justify-content:center;gap:6px}
#fleet button{font:inherit;font-size:var(--fs-body);height:28px;background:var(--srf-raise);color:var(--txt-dim);border:1px solid var(--line-ctl);border-radius:var(--r-sm);cursor:pointer}
#fleet button:hover{color:var(--txt-hi);border-color:var(--line-acc)}
#fleet button.on{color:var(--env-sun);border-color:rgba(255,210,110,.55)}

/* 提示与回显 */
#tip{position:fixed;display:none;min-width:200px;max-width:320px;padding:8px 10px;background:var(--srf-modal);border:1px solid var(--line-ctl);border-radius:var(--r-sm);
  font-size:var(--fs-label);line-height:1.55;color:var(--txt);pointer-events:none;z-index:50}
#tip h4{margin:0 0 4px;font-size:var(--fs-body);font-weight:normal;color:var(--txt-hi)}
#tip .r{display:flex;justify-content:space-between;gap:12px}
#tip .r span:first-child{color:var(--txt-dim)}
#tip .r span:last-child{font-family:var(--ff-mono);color:var(--txt-read)}
#tip .h{margin-top:5px;padding-top:4px;border-top:1px solid var(--line);color:var(--txt-mute)}
#say{position:fixed;left:50%;transform:translateX(-50%);padding:5px 12px;background:var(--srf-modal);border:1px solid var(--line-ctl);border-radius:var(--r-sm);
  font-size:var(--fs-label);color:var(--txt);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#say.show{opacity:1}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="note" class="panel">
  <h1>底部栏样板 · 新版交战</h1>
  这张页不加载引擎,数都照 <span class="v">数值模型-感知与武器.md</span> 摆好。悬停任何档位、武器卡片,地图上会预览它管的范围。
  <div class="row">选中:<button data-sel="CA" class="on">巡洋舰</button><button data-sel="DD">驱逐舰</button><button data-sel="FLEET">编队 3 艘</button></div>
  <div class="row">目标距离 <input id="dist" type="range" min="50" max="1500" value="420"><span class="v" id="distV">42 万</span></div>
  <div class="row"><button id="bHeard" class="on">听见敌方雷达</button><button id="bWave">模拟一拨来袭导弹</button></div>
  <div class="row" style="color:var(--txt-mute)">键:F 雷达扇区 · E 红外视场 · Shift+F / Shift+E 指向 · T 主炮 · R 反舰弹 · Q 反辐射 · B 长矛 · Esc 取消</div>
</div>

<div id="bar" class="panel">
  <section id="idBlk"></section><i class="sep"></i>
  <section id="sense">
    <div class="srow"><span class="lb">发射</span>
      <span class="seg" id="segEmit"><button data-v="silent">静默</button><button data-v="paint">照射</button><button data-v="jam" class="warn">干扰</button></span>
      <span class="rt"><span class="xp" id="xpHeard"></span></span></div>
    <div class="srow"><span class="lb">雷达<span class="kb">F</span></span>
      <span class="seg" id="segRad"><button data-v="360">全向</button><button data-v="90">扇区</button><button data-v="22.5">聚束</button></span>
      <span class="rt"><button class="chip" id="chipRad"></button></span></div>
    <div class="srow"><span class="lb">红外<span class="kb">E</span></span>
      <span class="seg" id="segIr"><button data-v="360">广角</button><button data-v="90">中焦</button><button data-v="22.5">长焦</button></span>
      <span class="rt"><button class="chip" id="chipIr"></button></span></div>
  </section><i class="sep"></i>
  <section id="wpn">
    <div class="fc" id="fcBtn"><span class="l">火控</span><span class="s"></span></div>
    <div class="cards" id="cards"></div>
  </section><i class="sep"></i>
  <section id="fleet"><button id="bFollow">跟随</button><button id="bFree">解除</button></section>
</div>
<div id="tip"></div>
<div id="say"></div>

<script>
"use strict";
/* ================= 数(照 数值模型-感知与武器.md 与引擎现值)================= */
const KM=1000,WAN=10000;
const CLS={
  CA:{label:'巡洋舰',emitK:1.607,hear:4525e3,seen:287e3,hp:900,mac:400,cells:6,ammo:240,pd:5.7,ic:320,lance:true,arm:0},
  DD:{label:'驱逐舰',emitK:1,hear:3200e3,seen:240e3,hp:550,mac:220,cells:4,ammo:192,pd:8.7,ic:384,lance:false,arm:4},
};
const RAD0_DD=1600e3;                        // 驱逐舰雷达全向看驱逐舰
const IR={cold:240e3,hot:480e3,id:97e3};     // 广角看驱逐舰
const W_RAD=[360,90,22.5],W_IR=[360,90,22.5],N_RAD=['全向','扇区','聚束'],N_IR=['广角','中焦','长焦'];
const MAC_R50=366e3,MSL_R=595e3,ARM_R=996e3,LZ={D0:60e3,AUTO:100e3,MAX:300e3,ON:20,CD:40},PD_R=40e3;
const radRange=(s,w)=>RAD0_DD*Math.pow(s.c.emitK,0.25)*Math.pow(360/w,0.25);   // 搜索方程:扇区缩到 1/k,距离 x k^(1/4)
const irK=w=>Math.sqrt(360/w);                                                  // 背景受限:视场缩到 1/k,距离 x √k
function wan(v){return v>=WAN?(v>=1e6?Math.round(v/WAN):Math.round(v/WAN*10)/10)+' 万':Math.round(v)+' km';}
function erf(x){const t=1/(1+0.3275911*Math.abs(x)),y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return x>=0?y:-y;}
const macHit=d=>erf(2000/(0.0081*d*Math.SQRT2));

/* ================= 状态 ================= */
function mkShip(cls,name){const c=CLS[cls];return {cls,c,name,hp:c.hp,emit:'silent',radW:360,radPin:null,irW:360,irPin:null,radDown:0,
  macCd:0,macAuto:true,cellT:Array(c.cells).fill(0),ammo:c.ammo,mslAuto:true,arm:c.arm,armAuto:true,lzBurst:0,lzCd:0,lzAuto:true,pdOn:true,pdBud:c.pd,ic:c.ic};}
const FLEET=[mkShip('CA','马拉松-01'),mkShip('DD','巴黎-01'),mkShip('DD','波长-01')];
const S={selKey:'CA',fc:false,dist:420e3,heard:true,pin:null,hover:null,follow:false};
function sel(){return S.selKey==='FLEET'?FLEET:(S.selKey==='CA'?[FLEET[0]]:[FLEET[1]]);}
const first=()=>sel()[0];
function common(f){const a=sel().map(f);return a.every(v=>v===a[0])?a[0]:undefined;} // 全队一致给值,不一致给 undefined(按钮画虚线)

/* ================= 地图(样板用的假局面)================= */
const cv=document.getElementById('map'),g=cv.getContext('2d');let W=0,H=0,DPR=1,SC=1,O=[0,0];
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);SC=(W*0.72)/3.6e6;O=[W*0.2,H*0.44];}
addEventListener('resize',resize);resize();
const P=(x,y)=>[O[0]+x*SC,O[1]+y*SC];
const TGT_BRG=-8*Math.PI/180,ESM_BRG=-27*Math.PI/180,SUN_BRG=-110*Math.PI/180;
function tgtPos(){return [Math.cos(TGT_BRG)*S.dist,Math.sin(TGT_BRG)*S.dist];}
function aimAng(s,kind){const pin=kind==='rad'?s.radPin:s.irPin;if(pin!=null)return pin;return kind==='ir'&&S.heard&&!S.fc?ESM_BRG:TGT_BRG;} // 自动:火控目标;红外没目标时盯听到的雷达
function wedge(ang,w,R,fill,stroke,dash){ // 扇区 / 全向
  const o=P(0,0),r=R*SC;g.beginPath();
  if(w>=360)g.arc(o[0],o[1],r,0,2*Math.PI);else{const h=w*Math.PI/360;g.moveTo(o[0],o[1]);g.arc(o[0],o[1],r,ang-h,ang+h);g.closePath();}
  if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.setLineDash(dash||[]);g.stroke();g.setLineDash([]);}
}
function arcLbl(ang,R,txt,col){const q=P(Math.cos(ang)*R,Math.sin(ang)*R);g.fillStyle=col;g.font='11px Consolas,"Microsoft YaHei"';g.textAlign='left';g.fillText(txt,q[0]+6,q[1]-4);}
function ring(R,txt,col,dash){const o=P(0,0);g.beginPath();g.arc(o[0],o[1],R*SC,0,2*Math.PI);g.strokeStyle=col;g.lineWidth=1;g.setLineDash(dash||[]);g.stroke();g.setLineDash([]);
  g.fillStyle=col;g.font='11px Consolas,"Microsoft YaHei"';g.textAlign='center';g.fillText(txt,o[0],o[1]-R*SC-4);}
function draw(){
  g.fillStyle='#070a0e';g.fillRect(0,0,W,H);
  const st=1e5*Math.pow(10,Math.floor(Math.log10(90/SC/1e5)));g.strokeStyle='#0f1620';g.lineWidth=1;g.beginPath();
  for(let x=O[0]%(st*SC);x<W;x+=st*SC){g.moveTo(Math.round(x)+.5,0);g.lineTo(Math.round(x)+.5,H);}
  for(let y=O[1]%(st*SC);y<H;y+=st*SC){g.moveTo(0,Math.round(y)+.5);g.lineTo(W,Math.round(y)+.5);}g.stroke();
  const s=first();
  // 听到的敌方雷达:沿方位的高斯团
  if(S.heard){g.save();const c=P(Math.cos(ESM_BRG)*1.6e6,Math.sin(ESM_BRG)*1.6e6);g.translate(c[0],c[1]);g.rotate(ESM_BRG);g.scale(1.2e6*SC,1.6e5*SC);
    const gr=g.createRadialGradient(0,0,0,0,0,1);gr.addColorStop(0,'rgba(170,240,230,.32)');gr.addColorStop(1,'rgba(84,224,208,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,1,0,2*Math.PI);g.fill();g.restore();
    const q=P(Math.cos(ESM_BRG)*2.3e6,Math.sin(ESM_BRG)*2.3e6);g.fillStyle='rgba(159,240,232,.8)';g.font='11px "Microsoft YaHei"';g.fillText('听到的敌方雷达',q[0],q[1]);}
  // 现役的雷达扇区 / 红外视场(淡)
  if(s.emit==='paint'&&!(s.radDown>0))wedge(aimAng(s,'rad'),s.radW,radRange(s,s.radW),'rgba(111,180,255,.05)','rgba(111,180,255,.28)',[4,5]);
  if(s.irW<360){const a=aimAng(s,'ir'),h=s.irW*Math.PI/360,o=P(0,0),L=Math.max(W,H)*2;g.strokeStyle='rgba(255,190,120,.3)';g.setLineDash([5,6]);g.beginPath();
    for(const q of [a-h,a+h]){g.moveTo(o[0],o[1]);g.lineTo(o[0]+Math.cos(q)*L,o[1]+Math.sin(q)*L);}g.stroke();g.setLineDash([]);}
  // 预览(悬停 / 指向中)
  const hv=S.hover;
  if(S.pin){const a=S.pinAng;if(S.pin==='rad')wedge(a,s.radW,radRange(s,s.radW),'rgba(255,210,110,.07)','rgba(255,210,110,.7)',[3,4]);
    else{const h=s.irW*Math.PI/360,o=P(0,0),L=Math.max(W,H)*2;g.strokeStyle='rgba(255,210,110,.75)';g.setLineDash([3,4]);g.beginPath();for(const q of [a-h,a+h]){g.moveTo(o[0],o[1]);g.lineTo(o[0]+Math.cos(q)*L,o[1]+Math.sin(q)*L);}g.stroke();g.setLineDash([]);}}
  else if(hv){
    if(hv.k==='rad'){const w=+hv.v,R=radRange(s,w),a=aimAng(s,'rad');wedge(a,w,R,'rgba(111,180,255,.10)','rgba(143,208,255,.85)');arcLbl(a,R,'看见驱逐舰 '+wan(R),'#8fd0ff');
      if(w<360){wedge(a,w,s.c.hear,null,'rgba(255,154,85,.55)',[2,4]);arcLbl(a+w*Math.PI/360,s.c.hear,'扇区里被听见 '+wan(s.c.hear),'#ffb27a');ring(s.c.hear/31.6,'扇区外 '+wan(s.c.hear/31.6),'rgba(255,154,85,.55)',[2,3]);}
      else ring(s.c.hear,'四面被听见 '+wan(s.c.hear),'rgba(255,154,85,.55)',[2,4]);}
    if(hv.k==='ir'){const w=+hv.v,k=irK(w),a=aimAng(s,'ir');wedge(a,w,IR.hot*k,'rgba(255,190,120,.07)','rgba(255,190,120,.7)');
      wedge(a,w,IR.cold*k,null,'rgba(255,190,120,.5)',[3,4]);wedge(a,w,IR.id*k,null,'rgba(255,225,170,.6)',[1,3]);

$('bFree').addEventListener('click',()=>{S.follow=false;say('解除跟随');render();});
cv.addEventListener('mousemove',e=>{if(!S.pin)return;S.pinAng=Math.atan2(e.clientY-O[1],e.clientX-O[0]);});
cv.addEventListener('click',e=>{if(!S.pin)return;const a=Math.atan2(e.clientY-O[1],e.clientX-O[0]);for(const s of sel()){if(S.pin==='rad')s.radPin=a;else s.irPin=a;}
  say((S.pin==='rad'?'雷达':'红外')+'钉住 '+degStr(a));S.pin=null;document.body.classList.remove('pin');render();});
addEventListener('keydown',e=>{
  if(e.repeat)return;const k=e.code;
  if(k==='Escape'){S.pin=null;document.body.classList.remove('pin');S.follow=false;render();return;}
  if(k==='KeyF'){e.shiftKey?pinMode('rad'):cycleW('rad');return;}
  if(k==='KeyE'){e.shiftKey?pinMode('ir'):cycleW('ir');return;}
  const m={KeyT:'mac',KeyR:'msl',KeyQ:'arm',KeyB:'lz'}[k];
  if(m&&document.querySelector(`.card[data-k="${m}"]`))fire(m);
});
document.querySelectorAll('#note [data-sel]').forEach(b=>b.addEventListener('click',()=>{S.selKey=b.dataset.sel;document.querySelectorAll('#note [data-sel]').forEach(x=>x.classList.toggle('on',x===b));render();}));
$('dist').addEventListener('input',e=>{S.dist=+e.target.value*KM;$('distV').textContent=wan(S.dist);render();});
$('bHeard').addEventListener('click',e=>{S.heard=!S.heard;e.currentTarget.classList.toggle('on',S.heard);render();});
$('bWave').addEventListener('click',()=>{const L=sel();let n=24;for(const x of L){const k=Math.min(n,Math.floor(x.pdBud));x.pdBud-=k;n-=k;}say(`来袭 24 枚:近防打掉 ${24-n},漏过 ${n}`+(n?' —— 两组同时到就是这样打穿的':''));render();});

/* ================= 计时 ================= */
let last=performance.now();
setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;
  for(const x of FLEET){if(x.macCd>0)x.macCd=Math.max(0,x.macCd-dt);for(let i=0;i<x.cellT.length;i++)if(x.cellT[i]>0)x.cellT[i]=Math.max(0,x.cellT[i]-dt);
    if(x.lzBurst>0){x.lzBurst-=dt;if(x.lzBurst<=0){x.lzBurst=0;x.lzCd=LZ.CD;}}else if(x.lzCd>0)x.lzCd=Math.max(0,x.lzCd-dt);
    x.pdBud=Math.min(x.c.pd,x.pdBud+x.c.pd/4.4*dt);if(x.radDown>0)x.radDown=Math.max(0,x.radDown-dt);}
  render();},200);
render();requestAnimationFrame(draw);
</script>
</body>
</html>
