<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多武器指令卡</title>
<!-- 2026-10-10 演示页(不加载引擎):一类里有几种武器时,底栏指令卡「格内分行」—— 四格位置不变,一种武器一行(名字 + 自己的绿条 + 就绪数 + 分开关),
     格子右上角 = 这一类的总开关(两层「与」:总开关关着这一类全不自动打)。武器清单是用户 10-10 认可的草案:
     主炮 = 轴炮 + 副炮(新);导弹 = 反舰 + 短程突击弹(新);特殊 = 浮标 + 诱饵;近防 = 拦截弹 + 近防炮。数值是起步值。
     样式照引擎底栏(css/app.css 10-10 那版):舰船块定宽、四格弹性、近防小一号、雷达 / 停火右端一列。 -->
<style>
:root{
  --void:#05070c;--srf-panel:rgba(9,13,20,.94);--srf-raise:#0e1420;--srf-hover:#16202f;--srf-sunk:#0a0f17;
  --line-hair:#141c27;--line:#1e2836;--line-ctl:#2a3a50;--line-acc:#34527d;
  --txt-hi:#e8eef7;--txt:#c7d0dc;--txt-read:#dbe6f2;--txt-dim:#6a7d92;--txt-mute:#46566a;--ink:#03121e;
  --acc:#5aa7ff;--acc-wash:rgba(90,167,255,.14);
  --state-select:#ffe066;--state-active:#54e0d0;--state-ok:#3fbf6f;--state-danger:#ff6b6b;
  --r-sm:2px;--r-md:3px;
  --ff-ui:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;--ff-mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
  --fs-micro:10px;--fs-label:11px;--fs-body:12px;--fs-read:13px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--txt);font-family:var(--ff-ui);font-size:var(--fs-body);overflow:hidden}
#map{position:absolute;inset:0;display:block}
#map.armed{cursor:crosshair}
.panel{position:absolute;background:var(--srf-panel);border:1px solid var(--line);border-radius:var(--r-md)}
#demo{top:12px;left:12px;padding:10px 12px;max-width:470px}
#demo h1{margin:0 0 6px;font-size:13px;color:var(--txt-hi);font-weight:normal}
#demo .row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#demo p{margin:4px 0;color:var(--txt-dim);font-size:var(--fs-label);line-height:1.6}
#demo b{color:var(--txt);font-weight:normal}
.btn{background:var(--srf-raise);color:var(--txt);border:1px solid var(--line-ctl);border-radius:var(--r-sm);font:inherit;padding:3px 9px;cursor:pointer}
.btn:hover{background:var(--srf-hover);border-color:var(--line-acc)}
.btn.on{background:var(--acc-wash);border-color:var(--acc);color:var(--txt-hi)}
#log{position:absolute;right:12px;top:12px;width:280px;padding:8px 10px;font-size:var(--fs-label);color:var(--txt-dim);line-height:1.6;max-height:42%;overflow:hidden}
#log div:first-child{color:var(--txt)}
/* 底栏(照引擎) */
#bar{left:50%;transform:translateX(-50%);bottom:12px;display:flex;align-items:center;gap:8px 16px;padding:8px 16px;width:min(1400px,calc(100% - 24px))}
.sep{width:1px;align-self:stretch;margin:2px 0;background:var(--line-ctl);flex:none}
.ship{display:flex;align-items:center;gap:8px;flex:0 0 330px;width:330px}
.ship canvas{width:150px;height:52px;flex:none}
.ship .nm{color:var(--txt-hi);font-size:15px}
.ship .cl{color:var(--txt-dim);font-size:var(--fs-label)}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:4px;min-width:120px}
.hb{height:4px;background:var(--srf-sunk);border-radius:1px;overflow:hidden}
.hb i{display:block;height:100%}
.mrow{display:flex;align-items:center;gap:6px}.mrow .hb{width:64px;flex:none}.mrow span{font-size:var(--fs-micro);color:var(--txt-dim)}
.card{display:flex;gap:8px;flex:1 1 auto;justify-content:center}
.wb{position:relative;flex:1 1 0;min-width:150px;max-width:250px;height:92px;background:var(--srf-raise);border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:6px 8px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;user-select:none}
.wb:hover{background:var(--srf-hover);border-color:var(--line-acc)}
.wb.armed{border-color:var(--state-select);box-shadow:0 0 0 1px var(--state-select) inset,0 0 10px rgba(255,224,102,.25)}
.wb.none{cursor:default;border-style:dashed;border-color:var(--line);background:transparent}
.wb.none .lb{color:var(--txt-mute)}
.wb .na{flex:1;display:flex;align-items:center;justify-content:center;color:var(--txt-mute);font-size:var(--fs-read)}
.wb.ciws{flex:0.62 1 0;min-width:104px;max-width:160px;cursor:default}
.hd{display:flex;align-items:center;gap:5px;height:18px;flex:none}
.lb{color:var(--txt-hi);font-size:var(--fs-body)}
.key{font-family:var(--ff-mono);font-size:var(--fs-micro);color:var(--txt-dim);border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:0 3px;line-height:13px}
.rows{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:2px}
/* 一行 = 一种武器:名字(点 = 这一行就绪的全选)| 绿条 | 就绪数 | 分开关 */
.wr{display:flex;align-items:center;gap:6px;height:18px;border-radius:var(--r-sm);padding:0 2px}
.wr.hi{background:rgba(90,167,255,.08)}
.wr .wn{flex:0 0 30px;font-size:var(--fs-label);color:var(--txt);cursor:pointer;white-space:nowrap}
.wr .wn:hover{color:var(--txt-hi);text-decoration:underline dotted}
.wr .cells{flex:1;display:flex;gap:2px;height:11px;min-width:0}
.cells i{flex:1;background:var(--srf-sunk);border-radius:1px;position:relative;overflow:hidden;min-width:3px}
.cells i b{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.cells i.ok{background:var(--state-ok)}
.cells i.gap{flex:0 0 4px;min-width:4px;background:transparent}
.cells i.ok[data-seg]{cursor:pointer}
.cells i.ok[data-seg]:hover{outline:1px solid var(--txt-hi)}
.cells i.pk{animation:breathe 1.1s ease-in-out infinite}
.cells i.sp{background:#8a6bd8}.cells i.sp.ok{background:#b08cff}
@keyframes breathe{0%,100%{background:#d9f3e2;box-shadow:0 0 2px 1px rgba(255,255,255,.3)}50%{background:#fff;box-shadow:0 0 7px 2px rgba(255,255,255,.9)}}
.wr .ct{flex:0 0 auto;min-width:30px;text-align:right;font-family:var(--ff-mono);font-size:var(--fs-label);color:var(--txt-read);font-variant-numeric:tabular-nums}
.wr .ct em{font-style:normal;color:var(--txt-dim)}
/* 开关:总开关在格子右上角(大一号),分开关在行尾 */
.ck{display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ck span{border:1px solid var(--line-acc);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;line-height:1;color:var(--ink)}
.ck.on span{background:var(--state-active);border-color:var(--state-active)}
.ck.part span{background:linear-gradient(135deg,var(--state-active) 50%,transparent 50%);border-color:var(--state-active)}
.ck.gated span{opacity:.35} /* 总开关关着:分开关的勾照记,但这一类不打 */
.ck:hover span{border-color:var(--txt-hi)}
.ckM{margin-left:auto;width:22px;height:22px}.ckM span{width:14px;height:14px;font-size:11px}
.ckS{width:16px;height:16px}.ckS span{width:11px;height:11px;font-size:9px}
/* 近防两行 */
.half{border:1px solid var(--line-ctl);border-radius:var(--r-sm);font-size:var(--fs-label);padding:1px 5px;cursor:pointer;color:var(--txt-dim);display:flex;justify-content:space-between}
.half b{font-family:var(--ff-mono);font-weight:normal}
.half:hover{border-color:var(--line-acc);color:var(--txt)}
.half.on{border-color:var(--state-active);color:var(--state-active);background:rgba(84,224,208,.08)}
.half.mix{border-color:var(--state-active);color:var(--txt);border-style:dashed}
.btns{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.sb{width:76px;padding:4px 12px;background:var(--srf-raise);border:1px solid var(--line-ctl);border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.sb .l{color:var(--txt-hi)}.sb .s{font-size:var(--fs-label);color:var(--txt-mute);letter-spacing:.3em;margin-right:-.3em}
.sb.stop .l{color:var(--state-danger)}
#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:132px;padding:5px 10px;color:var(--txt);font-size:var(--fs-label);display:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="demo" class="panel">
  <h1>多武器指令卡 · 演示(格内分行)</h1>
  <div class="row" id="pick"></div>
  <div class="row"><button class="btn" id="tx">演示时间 x10</button><button class="btn" id="auto">自动开火目标:没有</button></div>
  <p>四格位置不变,一类里几种武器就分几行。<b>点绿条</b> = 选这一发 / 这一组(泛白呼吸),再点取消;<b>点行首名字</b> = 这一行就绪的全选;<b>点格子空白处或 T / R</b> = 这一类就绪的全选;选好了点地图上的红色目标或空地发射(右键 / Esc 取消)。</p>
  <p><b>右上角大勾</b> = 这一类的自动开火总开关,<b>行尾小勾</b> = 这一种的分开关:总开关关着这一类全不自动打(小勾变淡、照记)。特殊格点一行 = 放一个(再点方向)。悬停一行只亮那一种的圈。</p>
</div>
<div id="log" class="panel"></div>
<div id="bar" class="panel"></div>
<div id="tip" class="panel"></div>
<script>
"use strict";
/* ---- 武器定义(用户 10-10 认可的草案,数值是起步值;时间 = 物理秒,射程 = km) ---- */
const WD={
  spinal:{cat:'mac',nm:'轴炮',reload:600,dmg:600,rings:[[67801,'轴炮 50%'],[117435,'轴炮 10%']],fx:'#ffe066'},
  sec:   {cat:'mac',nm:'副炮',reload:60, dmg:120,rings:[[20000,'副炮 50%'],[35000,'副炮 10%']],fx:'#ffb070'},
  asm:   {cat:'msl',nm:'反舰',reload:600,per:12, rings:[[240000,'反舰导弹 射程']],fx:'#5aa7ff',dash:1},
  ssm:   {cat:'msl',nm:'突击',reload:300,per:6,  rings:[[60000,'突击弹 射程(出膛自导)']],fx:'#7fe0ff',dash:1},
  buoy:  {cat:'sp', nm:'浮标',rings:[[191250,'浮标雷达(放出去后以浮标为圆心)']],fx:'#c890ff',dash:1},
  lure:  {cat:'sp', nm:'诱饵',rings:[[15000,'诱饵冒充驱逐舰 · 存在 300 s']],fx:'#d9a066',dash:1},
};
/* 配装:[武器, 门数 / 发射单元数 / 个数, 库存组数(导弹)] */
const CLS={
  CA:{nm:'巡洋舰',tier:'T2',hp:900,sh:300,L:{mac:[['spinal',2],['sec',2]],msl:[['asm',6,40],['ssm',2,6]],sp:[['lure',2]]},icp:320,R:{icp:8505,gun:2268},spec:[['加速','0.216 km/s²'],['最高速度','79 km/s'],['火控通道','3']]},
  DD:{nm:'驱逐舰',tier:'T2',hp:550,sh:200,L:{mac:[['spinal',1],['sec',2]],msl:[['asm',4,24],['ssm',2,6]],sp:[]},icp:352,R:{icp:11340,gun:2948},spec:[['加速','0.288 km/s²'],['最高速度','90 km/s'],['火控通道','1']]},
  FF:{nm:'护卫舰',tier:'T2',hp:550,sh:200,L:{mac:[['spinal',1]],msl:[['asm',4,24]],sp:[]},icp:384,R:{icp:14175,gun:3629},spec:[['加速','0.288 km/s²'],['最高速度','90 km/s'],['火控通道','1']]},
  CL:{nm:'巡游舰',tier:'T1',hp:550,sh:200,L:{mac:[],msl:[['asm',2,12]],sp:[['buoy',3],['lure',2]]},icp:384,R:{icp:14175,gun:3629},spec:[['加速','0.288 km/s²'],['最高速度','90 km/s'],['静听','536k']]},
};
const CATS=[['mac','主炮','T'],['msl','导弹','R'],['sp','特殊','']];
function mk(cls,name,x,y){const c=CLS[cls],W=[];
  for(const [cat] of CATS)for(const [id,n,st] of c.L[cat])W.push({id,cat,t:Array(n).fill(0),stock:st===undefined?(cat==='sp'?n:Infinity):st,auto:id!=='sec'});
  return {cls,name,x,y,hp:c.hp*(0.7+0.3*Math.random()),sh:c.sh*Math.random(),W,gate:{mac:true,msl:true},ciwsMsl:true,ciwsGun:true,icp:c.icp};}
const SH=[mk('CA','巡洋舰1',-70,10),mk('DD','驱逐舰1',-95,-45),mk('FF','护卫舰1',-120,40),mk('CL','巡游舰1',-140,-10)];
const FOES=[{x:250,y:-40,nm:'敌·驱逐舰'},{x:320,y:60,nm:'敌·巡洋舰'}];
const PICKS=[['巡洋舰1',[0]],['驱逐舰1',[1]],['护卫舰1',[2]],['巡游舰1',[3]],['四艘多选',[0,1,2,3]]];
let sel=[0],tx=1,autoTgt=false,armSp=null,hov=null;const PK=new Set(),FX=[],LOG=[];
const S=()=>sel.map(i=>SH[i]);
function log(t){LOG.unshift(t);if(LOG.length>14)LOG.pop();document.getElementById('log').innerHTML=LOG.map(x=>'<div>'+x+'</div>').join('');}
let tipT=Infinity;function tip(t,ms){const d=document.getElementById('tip');d.textContent=t;d.style.display=t?'block':'none';tipT=ms?performance.now()+ms:Infinity;}
/* ---- 就绪 / 选取 / 发射(键 = 船号:武器序号:第几门 / 单元) ---- */
const unitOk=(s,w,u)=>w.cat==='sp'?u<w.stock:(w.t[u]<=0&&(w.cat!=='msl'||w.stock>0));
function pkPrune(){for(const k of [...PK]){const [i,wi,u]=k.split(':').map(Number);if(!sel.includes(i)||!unitOk(SH[i],SH[i].W[wi],u))PK.delete(k);}}
function pkTip(){if(armSp){tip('点一个方向 = 放'+WD[armSp].nm+' · 右键 / Esc 取消',0);return;}if(!PK.size){tip('');return;}
  const c={};for(const k of PK){const [i,wi]=k.split(':').map(Number);const n=WD[SH[i].W[wi].id].nm;c[n]=(c[n]||0)+1;}
  tip('已选 '+Object.entries(c).map(([n,v])=>n+' '+v).join(' · ')+' → 点目标或空地发射 · 右键 / Esc 全部取消',0);}
function keysOf(filter){const K=[];for(const i of sel){const s=SH[i];s.W.forEach((w,wi)=>{if(!filter(w))return;w.t.forEach((_,u)=>{if(unitOk(s,w,u))K.push(i+':'+wi+':'+u);});});}return K;}
function toggleAll(K,what){if(!K.length){tip('没有就绪的'+what,1200);return;}armSp=null;const all=K.every(k=>PK.has(k));for(const k of K)all?PK.delete(k):PK.add(k);pkTip();render();}
function fireUnit(s,w,u,pt){const d=WD[w.id];if(w.cat==='msl'){w.stock--;}w.t[u]=d.reload;FX.push({a:[s.x,s.y],b:pt,c:d.fx,t:w.cat==='msl'?1.2:0.5,dash:d.dash});}
function pkFire(pt,why){const cnt=new Map();for(const k of PK){const [i,wi,u]=k.split(':').map(Number);const s=SH[i],w=s.W[wi];if(!unitOk(s,w,u))continue;fireUnit(s,w,u,pt);const key=s.name+' '+WD[w.id].nm;cnt.set(key,(cnt.get(key)||0)+1);}
  for(const [k,v] of cnt)log(k+' x'+v+' · '+why);PK.clear();return cnt.size;}
/* ---- 底栏 ---- */
const tri=a=>a.length&&a.every(Boolean)?2:(a.some(Boolean)?1:0);
const ckH=(cls,attr,v,gated)=>'<div class="ck '+cls+(v===2?' on':(v===1?' part':''))+(gated?' gated':'')+'" '+attr+'><span>'+(v===2?'✓':'')+'</span></div>';
function rowsOf(cat,L){const ids=[];for(const s of L)for(const w of s.W)if(w.cat===cat&&!ids.includes(w.id))ids.push(w.id);return ids;}
function cellHTML(cat,nm,key,L){
  const ids=rowsOf(cat,L);if(!ids.length)return '<div class="wb none"><div class="hd"><span class="lb">'+nm+'</span></div><div class="na">无</div></div>';
  const has=L.filter(s=>s.W.some(w=>w.cat===cat)),gate=cat==='sp'?null:tri(has.map(s=>s.gate[cat]));
  const armed=[...PK].some(k=>{const [i,wi]=k.split(':').map(Number);return SH[i].W[wi].cat===cat;})||(armSp&&WD[armSp].cat===cat);
  let h='<div class="wb'+(armed?' armed':'')+'" data-cat="'+cat+'"><div class="hd"><span class="lb">'+nm+'</span>'+(key?'<span class="key">'+key+'</span>':'')+(gate===null?'':ckH('ckM','data-gate="'+cat+'"',gate))+'</div><div class="rows">';
  for(const id of ids){const d=WD[id],own=L.filter(s=>s.W.some(w=>w.id===id));
    const segs=own.map(s=>{const i=SH.indexOf(s),wi=s.W.findIndex(w=>w.id===id),w=s.W[wi];
      return w.t.map((t,u)=>{const ok=unitOk(s,w,u),k=i+':'+wi+':'+u;
        if(cat==='sp')return '<i class="sp'+(ok?' ok':'')+'"></i>';
        return ok?'<i class="ok'+(PK.has(k)?' pk':'')+'" data-seg="'+k+'"></i>':'<i><b style="width:'+(t>0?Math.round((1-t/d.reload)*100):0)+'%"></b></i>';}).join('');}).join('<i class="gap"></i>');
    const rd=own.reduce((n,s)=>{const w=s.W.find(w=>w.id===id);return n+w.t.filter((_,u)=>unitOk(s,w,u)).length;},0),tot=own.reduce((n,s)=>n+s.W.find(w=>w.id===id).t.length,0);
    const stock=cat==='msl'?own.reduce((n,s)=>n+s.W.find(w=>w.id===id).stock,0):null;
    const sub=cat==='sp'?'':ckH('ckS','data-sub="'+id+'"',tri(own.map(s=>s.W.find(w=>w.id===id).auto)),gate===0);
    const ct=cat==='sp'?'余 '+rd:rd+'/'+tot+(stock!==null?' <em>'+stock+'组</em>':'');
    h+='<div class="wr'+(hov&&hov.id===id?' hi':'')+(armSp===id?' hi':'')+'" data-row="'+id+'"><span class="wn" data-rowpick="'+id+'">'+d.nm+'</span><span class="cells">'+segs+'</span><span class="ct">'+ct+'</span>'+sub+'</div>';}
  return h+'</div></div>';}
function ciwsHTML(L){const cl=v=>v===2?' on':(v===1?' mix':''),m=tri(L.map(s=>s.ciwsMsl)),g=tri(L.map(s=>s.ciwsGun)),n=L.reduce((a,s)=>a+s.icp,0);
  return '<div class="wb ciws" data-hr="ciws"><div class="hd"><span class="lb">近防</span></div><div class="rows"><div class="half'+cl(m)+'" data-cw="ciwsMsl">拦截弹<b>'+n+'</b></div><div class="half'+cl(g)+'" data-cw="ciwsGun">近防炮</div></div></div>';}
function shipHTML(L){const s=L[0],c=CLS[s.cls];
  if(L.length>1)return '<div class="ship"><div><div class="nm">'+L.length+' 艘</div><div class="bars">'+L.map(x=>'<div class="mrow"><div class="hb"><i style="width:'+Math.round(x.hp/CLS[x.cls].hp*100)+'%;background:var(--state-ok)"></i></div><span>'+x.name+'</span></div>').join('')+'</div></div></div>';
  return '<div class="ship"><canvas id="port" width="300" height="104"></canvas><div><div class="nm">'+s.name+'</div><div class="cl">'+c.nm+' · '+c.tier+'</div><div class="bars"><div class="hb"><i style="width:'+Math.round(s.hp/c.hp*100)+'%;background:var(--state-ok)"></i></div><div class="hb"><i style="width:'+Math.round(s.sh/c.sh*100)+'%;background:var(--acc)"></i></div></div></div></div>';}
function patch(a,b){if(a.childNodes.length!==b.childNodes.length){a.innerHTML=b.innerHTML;return;}
  for(let i=0;i<a.childNodes.length;i++){const x=a.childNodes[i],y=b.childNodes[i];
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);continue;}
    if(x.nodeType===3){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue;}if(x.nodeType!==1)continue;
    for(const at of [...x.attributes])if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
    for(const at of [...y.attributes])if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
    if(x.nodeName!=='CANVAS')patch(x,y);}}
const TPL=document.createElement('div');let portKey='',portEl=null;
function render(){pkPrune();const L=S();
  TPL.innerHTML=shipHTML(L)+'<div class="sep"></div><div class="card">'+CATS.map(([c,n,k])=>cellHTML(c,n,k,L)).join('')+ciwsHTML(L)+'</div><div class="sep"></div><div class="btns"><div class="sb"><span class="l">雷达</span><span class="s">静默</span></div><div class="sb stop" data-stop="1"><span class="l">停火</span><span class="s">全关</span></div></div>';
  patch(document.getElementById('bar'),TPL);
  const pc=document.getElementById('port'),pk=pc?L[0].cls+sel.join():'';if(pc&&(pk!==portKey||pc!==portEl)){drawPort(pc,L[0].cls);portEl=pc;}portKey=pk;
  document.getElementById('map').classList.toggle('armed',PK.size>0||!!armSp);}
function drawPort(cv,cls){const g=cv.getContext('2d'),w=cv.width,h=cv.height,k=cls==='CA'?1.25:1;g.clearRect(0,0,w,h);g.save();g.translate(w/2,h/2);
  g.fillStyle='rgba(159,212,255,.25)';g.strokeStyle='#5aa7ff';g.lineWidth=2;g.beginPath();g.moveTo(-110*k,-9);g.lineTo(80*k,-12);g.lineTo(115*k,0);g.lineTo(80*k,12);g.lineTo(-110*k,9);g.closePath();g.fill();g.stroke();
  g.fillStyle='#5aa7ff';g.fillRect(-35*k,-22,40*k,12);if(cls==='CL'){g.fillRect(10,-30,6,10);}g.fillStyle='#54e0d0';g.fillRect(-120*k,-4,9,8);g.restore();}
/* ---- 交互 ---- */
const bar=document.getElementById('bar');
bar.addEventListener('mousedown',e=>{if(e.button!==0)return;const t=e.target.closest('[data-seg],[data-gate],[data-sub],[data-rowpick],[data-row],[data-cw],[data-cat],[data-stop]');if(!t)return;
  if(t.dataset.seg){const k=t.dataset.seg;armSp=null;PK.has(k)?PK.delete(k):PK.add(k);pkTip();render();return;}
  if(t.dataset.gate){const c=t.dataset.gate,L=S().filter(s=>s.W.some(w=>w.cat===c)),on=L.every(s=>s.gate[c]);for(const s of L)s.gate[c]=!on;log((on?'关 ':'开 ')+(c==='mac'?'主炮':'导弹')+'自动开火(总开关)');render();return;}
  if(t.dataset.sub){const id=t.dataset.sub,W=S().flatMap(s=>s.W.filter(w=>w.id===id)),on=W.every(w=>w.auto);for(const w of W)w.auto=!on;log((on?'关 ':'开 ')+WD[id].nm+'自动开火(分开关)');render();return;}
  const rowId=t.dataset.rowpick||(t.dataset.row&&WD[t.dataset.row].cat==='sp'?t.dataset.row:null);
  if(rowId){if(WD[rowId].cat==='sp'){if(!S().some(s=>s.W.some(w=>w.id===rowId&&w.stock>0))){tip('没有'+WD[rowId].nm+'了',1200);return;}PK.clear();armSp=armSp===rowId?null:rowId;pkTip();render();return;}
    toggleAll(keysOf(w=>w.id===rowId),WD[rowId].nm);return;}
  if(t.dataset.cw){const f=t.dataset.cw,L=S(),on=L.every(s=>s[f]);for(const s of L)s[f]=!on;render();return;}
  if(t.dataset.stop){for(const s of S()){s.gate.mac=false;s.gate.msl=false;}PK.clear();armSp=null;tip('');log('停火 · 两个总开关都关');render();return;}
  if(t.dataset.cat&&t.dataset.cat!=='sp')toggleAll(keysOf(w=>w.cat===t.dataset.cat),t.dataset.cat==='mac'?'主炮':'导弹');});
bar.addEventListener('mouseover',e=>{const r=e.target.closest('[data-row]'),c=e.target.closest('[data-cat],[data-hr]');hov=r?{id:r.dataset.row,cat:WD[r.dataset.row].cat}:(c?{cat:c.dataset.cat||'ciws',hi:(e.target.closest('[data-cw]')||{}).dataset?.cw}:null);});
bar.addEventListener('mouseleave',()=>{hov=null;});
window.addEventListener('keydown',e=>{if(e.code==='KeyT')toggleAll(keysOf(w=>w.cat==='mac'),'主炮');else if(e.code==='KeyR')toggleAll(keysOf(w=>w.cat==='msl'),'导弹');else if(e.code==='Escape'){PK.clear();armSp=null;tip('');render();}});
/* ---- 地图 ---- */
const cv=document.getElementById('map'),g=cv.getContext('2d');let W=0,H=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
const toS=(x,y)=>[W/2-60+x*1.4,H/2-90+y*1.4],toW=(sx,sy)=>[(sx-W/2+60)/1.4,(sy-H/2+90)/1.4];
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{if(e.button===2){PK.clear();armSp=null;tip('');render();return;}
  const w=toW(e.clientX,e.clientY),hit=FOES.find(f=>Math.hypot(f.x-w[0],f.y-w[1])<16),pt=hit?[hit.x,hit.y]:w;
  if(armSp){const s=S().find(s=>s.W.some(x=>x.id===armSp&&x.stock>0));if(s){const x=s.W.find(x=>x.id===armSp);x.stock--;FX.push({a:[s.x,s.y],b:pt,c:WD[armSp].fx,t:1.5,dash:1});log(s.name+' 放'+WD[armSp].nm);}armSp=null;tip('');render();return;}
  if(PK.size){const n=pkFire(pt,hit?'打 '+hit.nm:'打空地');tip(n?'':'选中的都不能发了',n?0:1500);render();return;}
  const i=SH.findIndex(s=>Math.hypot(s.x-w[0],s.y-w[1])<14);if(i>=0){sel=e.ctrlKey||e.shiftKey?(sel.includes(i)?sel.filter(x=>x!==i):sel.concat(i)):[i];syncPick();PK.clear();render();}});
/* 悬停的圈:选中的每艘各画一套;悬停一行只亮那一种,同一格别的种类调暗;比例尺跟着最大那圈自动缩放 */
const fk=r=>r<10000?(r/1000).toFixed(1)+'k':Math.round(r/1000)+'k';
function ringsOf(s){const o=[],c=CLS[s.cls];if(!hov)return o;
  if(hov.cat==='ciws'){o.push([c.R.icp,'拦截弹 '+fk(c.R.icp),'ciwsMsl']);o.push([c.R.gun,'近防炮 '+fk(c.R.gun),'ciwsGun']);return o;}
  for(const w of s.W)if(w.cat===hov.cat)for(const [r,t] of WD[w.id].rings)o.push([r,t+' ≈ '+fk(r),w.id]);return o;}
let kpp0=0;
function drawRings(){if(!hov){kpp0=0;return;}const L=S().map(s=>[s,ringsOf(s)]).filter(x=>x[1].length);if(!L.length)return;
  const want=Math.max(...L.flatMap(x=>x[1].map(r=>r[0])))/(0.3*Math.min(W,H));kpp0=kpp0?kpp0*Math.pow(want/kpp0,0.25):want;
  g.font='10px Consolas';g.textAlign='center';g.textBaseline='bottom';const hiId=hov.id||hov.hi;
  for(const [s,R] of L){const p=toS(s.x,s.y);for(const [r,t,id] of R){const px=r/kpp0;if(px<4)continue;const hi=hiId&&id===hiId,lo=hiId&&id!==hiId;
    g.strokeStyle=hi?'rgba(159,212,255,.95)':(lo?'rgba(90,167,255,.25)':'rgba(90,167,255,.6)');g.lineWidth=hi?2:1;g.beginPath();g.arc(p[0],p[1],px,0,6.283);g.stroke();
    g.fillStyle=lo?'rgba(143,208,255,.4)':'rgba(143,208,255,.85)';g.fillText(t,p[0],p[1]-px-2);}}
  g.lineWidth=1;g.textBaseline='alphabetic';g.textAlign='left';g.font='11px "Microsoft YaHei"';g.fillStyle='rgba(106,125,146,.9)';g.fillText('比例尺跟着悬停的武器自动缩放:1 像素 ≈ '+Math.round(kpp0)+' km',16,H-150);}
function draw(){g.fillStyle='#05070c';g.fillRect(0,0,W,H);g.strokeStyle='rgba(30,40,54,.5)';g.lineWidth=1;
  for(let x=(W/2)%60;x<W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=(H/2)%60;y<H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  g.font='11px "Microsoft YaHei"';g.textAlign='center';
  for(const f of FOES){const p=toS(f.x,f.y);g.strokeStyle='#ff6b6b';g.beginPath();g.moveTo(p[0],p[1]-7);g.lineTo(p[0]+7,p[1]);g.lineTo(p[0],p[1]+7);g.lineTo(p[0]-7,p[1]);g.closePath();g.stroke();g.fillStyle='rgba(215,226,240,.8)';g.fillText(f.nm,p[0],p[1]+20);}
  SH.forEach((s,i)=>{const p=toS(s.x,s.y);g.fillStyle='#5aa7ff';g.beginPath();g.moveTo(p[0]+9,p[1]);g.lineTo(p[0]-7,p[1]-5);g.lineTo(p[0]-7,p[1]+5);g.closePath();g.fill();if(sel.includes(i)){g.strokeStyle='#ffe066';g.beginPath();g.arc(p[0],p[1],13,0,6.283);g.stroke();}g.fillStyle='rgba(215,226,240,.8)';g.fillText(s.name,p[0],p[1]+24);});
  drawRings();
  for(const f of FX){const a=toS(f.a[0],f.a[1]),b=toS(f.b[0],f.b[1]);g.strokeStyle=f.c;g.globalAlpha=Math.min(1,f.t*2);g.setLineDash(f.dash?[6,5]:[]);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.setLineDash([]);g.globalAlpha=1;}
  g.fillStyle='rgba(106,125,146,.9)';g.textAlign='left';g.fillText('点地图上的蓝船选中(Shift / Ctrl 加选);选好绿条后点红色目标或空地发射',16,H-132);}
/* 时间:装填按物理秒走;自动开火 = 总开关 && 分开关 */
let last=performance.now(),autoT=0;
function tick(now){const dt=Math.min(0.1,(now-last)/1000)*tx*10;last=now; // x1 = 每真实秒 10 物理秒(同引擎)
  for(const s of SH)for(const w of s.W)for(let u=0;u<w.t.length;u++)w.t[u]=Math.max(0,w.t[u]-dt);
  for(let i=FX.length-1;i>=0;i--){FX[i].t-=0.016;if(FX[i].t<=0)FX.splice(i,1);}
  autoT+=dt;if(autoT>=10){autoT=0;if(autoTgt)for(const s of SH)for(const w of s.W){if(w.cat==='sp'||!s.gate[w.cat]||!w.auto)continue;const u=w.t.findIndex((_,k)=>unitOk(s,w,k));if(u>=0){const f=FOES[w.cat==='mac'?0:1];fireUnit(s,w,u,[f.x,f.y]);log(s.name+' '+WD[w.id].nm+' · 自动开火');}}}
  if(tipT!==Infinity&&now>tipT)tip('');draw();render();requestAnimationFrame(tick);}
function syncPick(){document.querySelectorAll('#pick .btn').forEach((b,j)=>b.classList.toggle('on',JSON.stringify(PICKS[j][1])===JSON.stringify(sel)));}
document.getElementById('pick').innerHTML=PICKS.map(([l],j)=>'<button class="btn" data-j="'+j+'">'+l+'</button>').join('');
document.getElementById('pick').onclick=e=>{const b=e.target.closest('[data-j]');if(!b)return;sel=PICKS[+b.dataset.j][1].slice();PK.clear();armSp=null;tip('');syncPick();render();};
document.getElementById('tx').onclick=e=>{tx=tx===1?10:1;e.target.classList.toggle('on',tx>1);};
document.getElementById('auto').onclick=e=>{autoTgt=!autoTgt;e.target.textContent='自动开火目标:'+(autoTgt?'有':'没有');};
syncPick();log('选中 巡洋舰1');requestAnimationFrame(tick);
</script>
</body>
</html>
